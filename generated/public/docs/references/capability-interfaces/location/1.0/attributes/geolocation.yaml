      - longitudeInDegrees
    properties:
      latitudeInDegrees:
        type: number
      longitudeInDegrees:
        type: number
      accuracy:
        type: object
        description: Geographic coordinate accuracy
        properties:
          value:
            type: number
          unit:
            type: string
            enum:
              - METERS
        title: GeoAccuracy
    title: GeoCoordinate
additionalProperties: false
