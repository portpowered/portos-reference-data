name: motion-sensor
namespace: port1/systems/zero/capability-interfaces/motion-sensor
version: '1.0'
description: >-
  Motion sensors report detection state and emit motion-detected events. Use them to trigger a
  light, a notification, or another automation when movement is detected.
messages:
  - name: motion-detected
    description: A distinct motion occurrence, independent of cached detection state.
    directionality: out
    schema:
      description: A distinct motion occurrence, independent of cached detection state.
      type: object
      properties:
        value:
          type: string
          enum:
            - DETECTED
      required:
        - value
      additionalProperties: false
attributes:
  - name: detection-state
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - DETECTED
            - NOT_DETECTED
      required:
        - value
      additionalProperties: false
configuration: null
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
