name: fan-control
namespace: port1/systems/zero/capability-interfaces/fan-control
version: '1.0'
description: >-
  Fan control selects a fan mode and speed. Read the reported settings to check
  how a fan is running before changing them.
messages:
  - name: set-mode
    description: null
    directionality: in
    schema:
      type: object
      properties:
        mode:
          type: string
          description: Fan mode
          enum:
            - 'OFF'
            - LOW
            - MEDIUM
            - HIGH
            - 'ON'
            - AUTO
            - SMART
      required:
        - mode
      additionalProperties: false
  - name: set-speed
    description: null
    directionality: in
    schema:
      type: object
      properties:
        speed:
          type: integer
          description: Fan speed percentage (0-100)
          minimum: 0
          maximum: 100
      required:
        - speed
      additionalProperties: false
attributes:
  - name: fan-mode
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          description: Fan mode
          enum:
            - 'OFF'
            - LOW
            - MEDIUM
            - HIGH
            - 'ON'
            - AUTO
            - SMART
      required:
        - value
      additionalProperties: false
  - name: fan-speed
    description: null
    schema:
      type: object
      properties:
        value:
          type: integer
          description: Fan speed percentage (0-100)
          minimum: 0
          maximum: 100
      required:
        - value
      additionalProperties: false
configuration:
  type: object
  properties:
    supportedFanModes:
      type: array
      items:
        type: string
        description: Fan mode
        enum:
          - 'OFF'
          - LOW
          - MEDIUM
          - HIGH
          - 'ON'
          - AUTO
          - SMART
      description: Supported fan modes
    supportedFanSpeeds:
      type: array
      items:
        type: integer
        minimum: 0
        maximum: 100
      description: Supported fan speeds (0-100)
  additionalProperties: false
  description: >-
    Fan control selects a fan mode and speed. Read the reported settings to
    check how a fan is running before changing them.
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
