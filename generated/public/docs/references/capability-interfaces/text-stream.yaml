name: text-stream
namespace: port1/systems/zero/capability-interfaces/text-stream
version: '1.0'
description: >-
  Text streams emit text as a stream of messages. Use the stream to consume
  output as it becomes available.
messages:
  - name: text-stream
    description: null
    directionality: out
    schema:
      type: object
      properties:
        streamId:
          type: string
          description: Unique identifier for this text stream
          minLength: 1
        sequenceId:
          type: integer
          description: Sequence ID for this text stream
          minimum: 0
        isFinal:
          type: boolean
          description: Whether this is the final chunk in the stream
          default: false
        text:
          type: string
      required:
        - streamId
        - text
        - sequenceId
        - isFinal
      additionalProperties: false
attributes: []
configuration:
  type: object
  properties:
    maxChunkSize:
      type: integer
      description: Maximum size for individual text chunks
      default: 500
    maxStreamLength:
      type: integer
      description: Maximum total length for text streams
      default: 50000
    supportedEncodings:
      type: array
      items:
        type: string
        enum:
          - utf-8
          - ascii
          - latin1
      description: Supported text encodings
    defaultEncoding:
      type: string
      description: Default text encoding
      default: utf-8
    legacyMode:
      type: boolean
      description: Whether to use legacy mode for compatibility
      default: true
    chunkTimeout:
      type: integer
      description: Timeout in milliseconds for chunk delivery
      default: 10000
  required:
    - maxChunkSize
    - maxStreamLength
    - supportedEncodings
    - defaultEncoding
    - legacyMode
    - chunkTimeout
  additionalProperties: false
  description: >-
    Text streams emit text as a stream of messages. Use the stream to consume
    output as it becomes available.
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
