name: pet-feeder
namespace: port1/systems/zero/capability-interfaces/pet-feeder
version: '1.0'
description: >-
  Pet feeders accept a command to trigger a feed. Use the command to start a feeding action from an
  interface or automation.
messages:
  - name: trigger-feed
    description: null
    directionality: in
    schema:
      type: object
      properties:
        feedAmount:
          type: integer
          description: Amount of food to feed the pet
          minimum: 1
          maximum: 100
        unit:
          type: string
          description: Unit of food to feed the pet
          enum:
            - cups
            - grams
            - pounds
            - ounces
          default: cups
      additionalProperties: false
attributes: []
configuration: null
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
