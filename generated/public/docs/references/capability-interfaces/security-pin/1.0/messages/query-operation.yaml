description: >-
  Retrieve an endpoint-scoped PIN operation result by its original correlation
  token. Enforce caller and endpoint ownership. Return pin-operation-result,
  preserving the original operation correlation token in its payload and using
  this query's correlation token in the response header.
type: object
properties:
  correlationToken:
    type: string
    minLength: 1
required:
  - correlationToken
additionalProperties: false
