description: >-
  Verified optional restrictions from endpoint configuration. Omit unknown
  restrictions; absence does not guarantee vendor acceptance.
type: object
properties:
  supportedKinds:
    type: array
    uniqueItems: true
    items:
      type: string
      enum:
        - PERMANENT
        - TEMPORARY
  minLength:
    type: integer
    minimum: 0
  maxLength:
    type: integer
    minimum: 0
  maxPins:
    type: integer
    minimum: 1
    description: >-
      Maximum simultaneous PINs the device holds; 1 means a single-PIN lock.
      Omitted when unknown.
  pattern:
    type: string
additionalProperties: false
