name: speech-audio-generation
namespace: port1/systems/zero/capability-interfaces/speech-audio-generation
version: '1.0'
description: >-
  Speech audio generation turns an input into speech audio and returns it as a short-lived URL or
  inline base64, chosen with responseFormat. Use the result when an integration needs an audio file
  it can pass to a player.
messages:
  - name: audio-generated
    description: >-
      The speech audio synthesized by generate-speech, as a short-lived URL or inline base64
      according to the request's responseFormat
    directionality: out
    schema:
      description: >-
        The speech audio synthesized by generate-speech, as a short-lived URL or inline base64
        according to the request's responseFormat
      type: object
      required:
        - audio
      properties:
        audio:
          type: object
          description: >-
            One binary media result (audio or image). Exactly one of `data` (base64, inline) or
            `url` (a short-lived Port OS URL with its `expiresAt`) is present; the host rejects a
            result that carries both or neither. A plugin may return the vendor's fetchable `url`
            without `expiresAt`; the host always fetches it, republishes or inlines the bytes as the
            caller's `responseFormat` asks, and fills `byteLength`, so callers never see a vendor
            URL.
          properties:
            mimeType:
              type: string
              description: The media type of the bytes.
              enum:
                - audio/mpeg
                - audio/wav
                - audio/ogg
                - audio/flac
                - image/png
                - image/jpeg
                - image/webp
              example: audio/mpeg
            byteLength:
              type: integer
              minimum: 1
              maximum: 26214400
              description: Size of the decoded bytes. Always present on host responses.
            durationMs:
              type: integer
              minimum: 0
              description: Duration of audio in milliseconds, when known.
            width:
              type: integer
              minimum: 1
              description: Image width in pixels, when known.
            height:
              type: integer
              minimum: 1
              description: Image height in pixels, when known.
            url:
              type: string
              description: Short-lived URL of the media (valid until `expiresAt`, at most 10 minutes).
            expiresAt:
              type: string
              format: date-time
              description: When `url` stops working. Present with `url` on host responses.
            data:
              type: string
              format: byte
              maxLength: 13981016
              description: Base64 encoded bytes, at most 10 MiB decoded.
          required:
            - mimeType
          additionalProperties: false
          title: MediaContent
      additionalProperties: false
      title: SpeechAudioGenerationInterfaceAudioGeneratedMessage
  - name: generate-speech
    description: null
    directionality: in
    schema:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: The text content to synthesize into speech audio
        speakerEmbeddingUrl:
          type: string
          description: URL or base64 data URI of the speaker embedding for voice characteristics
        responseFormat:
          type: string
          description: >-
            How a request wants binary media (audio or image) returned. URL returns a short-lived
            signed URL hosted by Port OS (at most 10 minutes), never the vendor's own link. BASE64
            returns the bytes inline as base64 and fails with a typed error above 10 MiB, in which
            case use URL.
          enum:
            - URL
            - BASE64
          default: URL
      additionalProperties: false
attributes: []
configuration: null
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
