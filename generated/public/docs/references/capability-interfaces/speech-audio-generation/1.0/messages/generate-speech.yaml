type: object
required:
  - text
properties:
  text:
    type: string
    description: The text content to synthesize into speech audio
  speakerEmbeddingUrl:
    type: string
    description: URL or base64 data URI of the speaker embedding for voice characteristics
  responseFormat:
    type: string
    description: >-
      How a request wants binary media (audio or image) returned. URL returns a
      short-lived signed URL hosted by Port OS (at most 10 minutes), never the
      vendor's own link. BASE64 returns the bytes inline as base64 and fails
      with a typed error above 10 MiB, in which case use URL.
    enum:
      - URL
      - BASE64
    default: URL
additionalProperties: false
