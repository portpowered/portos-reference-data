description: >-
  Request to report attributes of a control route sent from port OS to the
  control routes provider
type: object
properties:
  items:
    type: array
    items:
      type: object
      description: >-
        A control route report request with cookies and optional attribute
        selections. Omitted or empty attributes request all supported
        attributes.
      properties:
        associatedPluginRouteId:
          type: string
        cookies:
          type: object
          additionalProperties: true
        attributes:
          type: array
          items:
            type: object
            description: >-
              The exact identity of an attribute requested from a provider,
              without an observed value.
            properties:
              namespace:
                type: string
                minLength: 1
              name:
                type: string
                minLength: 1
              version:
                type: string
                minLength: 1
            required:
              - namespace
              - name
              - version
            additionalProperties: false
            title: AttributeSelection
      required:
        - associatedPluginRouteId
      additionalProperties: false
      title: ControlRouteReportItem
required:
  - items
additionalProperties: false
