name: color-temperature
namespace: port1/systems/zero/capability-interfaces/color-temperature
version: '1.0'
description: >-
  Color temperature adjusts a light between warmer and cooler tones. Set a
  temperature directly or increase and decrease it, then read the reported value
  in kelvin.
messages:
  - name: decrease-color-temperature
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: increase-color-temperature
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: set-color-temperature
    description: null
    directionality: in
    schema:
      type: object
      required:
        - colorTemperatureInKelvin
      properties:
        colorTemperatureInKelvin:
          type: integer
          description: >-
            The colorTemperatureInKelvin property represents the color
            temperature in degrees Kelvin of an endpoint, and is used by
            endpoints that support tunable white light. Valid values range from
            1,000 to 10,000 absolute Kelvin.

            The color values roughly map to:  - warm white: 2000 - soft white:
            2500 - white: 4000 - daylight white: 5500 - cool white: 7000
      additionalProperties: false
attributes:
  - name: color-temperature-in-kelvin
    description: null
    schema:
      type: object
      properties:
        value:
          type: integer
      required:
        - value
      additionalProperties: false
configuration: null
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
