name: media-player
namespace: port1/systems/zero/capability-interfaces/media-player
version: '1.0'
description: >-
  Media players select media by its Port OS media ID, play supplied audio or a URI, and control
  playback. Read playback state and use only the commands supported by the connected player.
messages:
  - name: audio
    description: null
    directionality: out
    schema:
      type: object
      properties:
        audioData:
          type: string
          description: Base64 encoded audio data
          format: base64
        isFinal:
          type: boolean
          description: Whether the audio is the final chunk
          default: false
        sequenceId:
          type: integer
          description: Number of audio channels
        streamId:
          type: string
          description: Audio stream ID
          default: default
        text:
          type: string
          description: Audio text
          default: ''
        mimeType:
          type: string
          description: Audio MIME type
          default: audio/ogg
        rawBytes:
          type: string
          description: Audio raw bytes
          format: binary
        duration:
          type: number
          description: Audio duration in seconds
          minimum: 0
      additionalProperties: false
  - name: audio-stream
    description: null
    directionality: out
    schema:
      type: object
      properties:
        streamId:
          type: string
          description: Unique identifier for this audio stream
          minLength: 1
        sequenceId:
          type: integer
          description: Sequence ID for this audio stream
          minimum: 0
        isFinal:
          type: boolean
          description: Whether this is the final chunk in the stream
          default: false
        audioData:
          type: string
          description: Base64 encoded audio data
          format: base64
        rawBytes:
          type: string
          description: Audio raw bytes
          format: binary
      required:
        - streamId
        - sequenceId
        - isFinal
      additionalProperties: false
  - name: fast-forward
    description: >-
      Begin provider-defined fast-forward playback. This does not seek by a specific duration; use
      skip-forward or seek for a known position change.
    directionality: in
    schema:
      description: >-
        Begin provider-defined fast-forward playback. This does not seek by a specific duration; use
        skip-forward or seek for a known position change.
      type: object
      additionalProperties: false
  - name: next
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: pause
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: play-audio
    description: >-
      Play a base64 encoded audio object on the endpoint. Requires audio output support; RTSP or SDP
      alone does not establish playback support.
    directionality: in
    schema:
      description: >-
        Play a base64 encoded audio object on the endpoint. Requires audio output support; RTSP or
        SDP alone does not establish playback support.
      type: object
      properties:
        audio:
          type: object
          description: An audio object to play on an endpoint with audio output.
          properties:
            data:
              type: string
              format: byte
              minLength: 4
              maxLength: 13981016
              pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
              description: Base64 encoded audio, at most 10 MiB decoded.
              example: UklGRg==
            mimeType:
              type: string
              pattern: ^audio/[a-zA-Z0-9.+-]+$
              description: The audio MIME type, such as audio/wav or audio/mpeg.
              example: audio/wav
          required:
            - data
            - mimeType
          additionalProperties: false
          title: PlayableAudio
      required:
        - audio
      additionalProperties: false
      title: MediaPlayerInterfacePlayAudioMessage
  - name: play-media
    description: null
    directionality: in
    schema:
      type: object
      properties:
        mediaId:
          title: MediaId
          type: string
          minLength: 1
          example: portos-media://portpowered.com/spotify/audio/track/Ab123
          pattern: >-
            ^(portos-media://portpowered[.]com/[a-z][a-z0-9_-]*/(audio|video|image)/[a-z][a-z0-9_-]*/([^/?#\s]|%[0-9A-Fa-f]{2})+|https?://[^\s]+|portos://[^\s]+|youtube:video:[A-Za-z0-9_-]+)$
          description: >
            Exact provider resource identity. The canonical form is
            portos-media://portpowered.com/provider/media-type/resource-kind/resource-id, with no
            URI version. Spotify emits audio track, playlist, album, artist, show and episode
            identities. Copy an ID returned by search or library discovery; do not send a search
            phrase as an ID. Legacy providers retain their own input contracts until explicitly
            migrated. See https://portpowered.com/docs/media.
      required:
        - mediaId
      additionalProperties: false
  - name: play
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: play-uri
    description: null
    directionality: in
    schema:
      type: object
      properties:
        uri:
          type: string
          description: Public HTTPS URI of the audio to play
          format: uri
          minLength: 1
        title:
          type: string
          description: Optional title for display or logging purposes
        offsetInMilliseconds:
          type: integer
          description: Playback start position in milliseconds
          minimum: 0
          default: 0
      required:
        - uri
      additionalProperties: false
  - name: previous
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: rewind
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: search-and-play
    description: >-
      Search for and play media by title or query using a service advertised by the endpoint.
      Omitting mediaType retains audio search behavior; video-only endpoints may default to video.
    directionality: in
    schema:
      description: >-
        Search for and play media by title or query using a service advertised by the endpoint.
        Omitting mediaType retains audio search behavior; video-only endpoints may default to video.
      type: object
      properties:
        query:
          type: string
          description: Query to search for media content
          minLength: 1
        provider:
          type: string
          description: >-
            Media service identifier. A provider enum value does not imply that every endpoint
            supports that service; use the endpoint's advertised provider lists.
          enum:
            - SPOTIFY
            - AMAZON_MUSIC
            - APPLE_MUSIC
            - AUDIBLE
            - TUNE_IN
            - PANDORA
            - IHEART_RADIO
            - SIRIUSXM
            - DEEZER
            - TIDAL
            - YOUTUBE
            - NETFLIX
            - PRIME_VIDEO
            - DAILYMOTION
        mediaType:
          type: string
          enum:
            - AUDIO
            - VIDEO
          description: Media search domain. The endpoint must advertise support for the selected type.
        timerSeconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Optional provider playback timer in seconds.
      required:
        - query
      additionalProperties: false
  - name: seek
    description: null
    directionality: in
    schema:
      type: object
      properties:
        positionMilliseconds:
          type: integer
          description: Position to seek to in milliseconds
          minimum: 0
      required:
        - positionMilliseconds
      additionalProperties: false
  - name: skip-backward
    description: null
    directionality: in
    schema:
      type: object
      properties:
        deltaPositionMilliseconds:
          type: integer
          description: Number of milliseconds to skip backward
          minimum: 0
      additionalProperties: false
  - name: skip-forward
    description: null
    directionality: in
    schema:
      type: object
      properties:
        deltaPositionMilliseconds:
          type: integer
          description: Number of milliseconds to skip forward
          minimum: 0
      additionalProperties: false
  - name: start-over
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: stop
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
attributes:
  - name: now-playing
    description: >-
      Media identity observed on this route. Active false means the provider session is on another
      target; it does not prove the speaker is silent through other providers.
    schema:
      description: >-
        Media identity observed on this route. Active false means the provider session is on another
        target; it does not prove the speaker is silent through other providers.
      type: object
      properties:
        active:
          type: boolean
        mediaId:
          title: MediaId
          type: string
          minLength: 1
          example: portos-media://portpowered.com/spotify/audio/track/Ab123
          pattern: >-
            ^(portos-media://portpowered[.]com/[a-z][a-z0-9_-]*/(audio|video|image)/[a-z][a-z0-9_-]*/([^/?#\s]|%[0-9A-Fa-f]{2})+|https?://[^\s]+|portos://[^\s]+|youtube:video:[A-Za-z0-9_-]+)$
          description: >
            Exact provider resource identity. The canonical form is
            portos-media://portpowered.com/provider/media-type/resource-kind/resource-id, with no
            URI version. Spotify emits audio track, playlist, album, artist, show and episode
            identities. Copy an ID returned by search or library discovery; do not send a search
            phrase as an ID. Legacy providers retain their own input contracts until explicitly
            migrated. See https://portpowered.com/docs/media.
        contextMediaId:
          $ref: '#/properties/mediaId'
        name:
          type: string
      required:
        - active
      additionalProperties: false
  - name: playback-speed
    description: null
    schema:
      type: object
      properties:
        value:
          type: number
          description: Playback speed multiplier (1.0 = normal speed)
          minimum: 0.1
          maximum: 10
      required:
        - value
      additionalProperties: false
  - name: playback-state
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          description: The current playback state
          enum:
            - PLAYING
            - PAUSED
            - STOPPED
            - LOADING
            - ERROR
      required:
        - value
      additionalProperties: false
configuration:
  description: >-
    Media players select media by its Port OS media ID, play supplied audio or a URI, and control
    playback. Read playback state and use only the commands supported by the connected player.
  type: object
  properties:
    supportedMediaResources:
      type: array
      description: >-
        Exact play-media URI combinations accepted by this route. Member or endpoint unions do not
        imply support by every route.
      items:
        title: SupportedMediaResource
        description: A provider, media type and resource-kind combination accepted by a control route.
        type: object
        properties:
          provider:
            $ref: '#/properties/supportedAudioProviders/items'
          mediaType:
            type: string
            enum:
              - AUDIO
              - VIDEO
              - IMAGE
          resourceKinds:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              description: Lowercase resource-kind segment from the provider URI.
        required:
          - provider
          - mediaType
          - resourceKinds
        additionalProperties: false
    supportedAudioProviders:
      type: array
      uniqueItems: true
      description: >-
        Audio services accepted by search-and-play on this endpoint. These describe command support,
        not active subscriptions.
      items:
        type: string
        description: >-
          Media service identifier. A provider enum value does not imply that every endpoint
          supports that service; use the endpoint's advertised provider lists.
        enum:
          - SPOTIFY
          - AMAZON_MUSIC
          - APPLE_MUSIC
          - AUDIBLE
          - TUNE_IN
          - PANDORA
          - IHEART_RADIO
          - SIRIUSXM
          - DEEZER
          - TIDAL
          - YOUTUBE
          - NETFLIX
          - PRIME_VIDEO
          - DAILYMOTION
    supportedVideoProviders:
      type: array
      uniqueItems: true
      description: >-
        Video services accepted by search-and-play on this endpoint. These describe command support,
        not installed applications or active subscriptions.
      items:
        $ref: '#/properties/supportedAudioProviders/items'
    defaultAudioProvider:
      $ref: '#/properties/supportedAudioProviders/items'
      description: Default service for an audio search. Must be in supportedAudioProviders.
    defaultVideoProvider:
      $ref: '#/properties/supportedAudioProviders/items'
      description: Default service for a video search. Must be in supportedVideoProviders.
    supportedPlaybackStates:
      type: array
      items:
        type: string
        description: The current playback state
        enum:
          - PLAYING
          - PAUSED
          - STOPPED
          - LOADING
          - ERROR
      description: Supported playback states
    supportedPlaybackSpeeds:
      type: array
      items:
        type: number
      description: Supported playback speeds (e.g., 0.5, 1.0, 1.5, 2.0)
    seekRange:
      description: Seek range in seconds
      type: object
      properties:
        min:
          type: number
          description: Minimum measured value
        max:
          type: number
          description: Maximum measured value
      required:
        - min
        - max
      additionalProperties: false
      title: MeasurementRange
    supportedMediaTypes:
      type: array
      items:
        type: string
        enum:
          - AUDIO
          - VIDEO
          - IMAGE
          - PLAYLIST
      description: List of supported media types
    supportedFormats:
      type: array
      items:
        type: string
        enum:
          - MP3
          - WAV
          - FLAC
          - AAC
          - OGG
          - MP4
          - AVI
          - MKV
          - JPG
          - PNG
          - GIF
      description: List of supported media formats
    maxPlaylistSize:
      type: integer
      description: Maximum number of items in a playlist
      minimum: 1
      maximum: 10000
    defaultQuality:
      type: string
      description: Default quality setting for media playback
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - LOSSLESS
    supportsPlayURI:
      type: boolean
      description: Whether the endpoint can play an audio URI.
    supportedAudioMimeTypes:
      type: array
      description: >-
        Audio MIME types accepted by play-audio. Advertise play-audio only when audio output is
        supported.
      items:
        type: string
  additionalProperties: false
  title: MediaPlayerInterfaceConfiguration
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
