name: media-player
namespace: port1/systems/zero/capability-interfaces/media-player
version: '1.0'
description: >-
  Media players select media by its Port OS media ID, play supplied audio or a URI, and control
  playback. Read playback state and use only the commands supported by the connected player.
messages:
  - name: audio
    description: null
    directionality: out
    schema:
      type: object
      properties:
        audioData:
          type: string
          description: Base64 encoded audio data
          format: base64
        isFinal:
          type: boolean
          description: Whether the audio is the final chunk
          default: false
        sequenceId:
          type: integer
          description: Number of audio channels
        streamId:
          type: string
          description: Audio stream ID
          default: default
        text:
          type: string
          description: Audio text
          default: ''
        mimeType:
          type: string
          description: Audio MIME type
          default: audio/ogg
        rawBytes:
          type: string
          description: Audio raw bytes
          format: binary
        duration:
          type: number
          description: Audio duration in seconds
          minimum: 0
      additionalProperties: false
  - name: audio-stream
    description: null
    directionality: out
    schema:
      type: object
      properties:
        streamId:
          type: string
          description: Unique identifier for this audio stream
          minLength: 1
        sequenceId:
          type: integer
          description: Sequence ID for this audio stream
          minimum: 0
        isFinal:
          type: boolean
          description: Whether this is the final chunk in the stream
          default: false
        audioData:
          type: string
          description: Base64 encoded audio data
          format: base64
        rawBytes:
          type: string
          description: Audio raw bytes
          format: binary
      required:
        - streamId
        - sequenceId
        - isFinal
      additionalProperties: false
  - name: fast-forward
    description: >-
      Begin provider-defined fast-forward playback. This does not seek by a specific duration; use
      skip-forward or seek for a known position change.
    directionality: in
    schema:
      description: >-
        Begin provider-defined fast-forward playback. This does not seek by a specific duration; use
        skip-forward or seek for a known position change.
      type: object
      additionalProperties: false
  - name: next
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: pause
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: play-audio
    description: >-
      Play a base64 encoded audio object on the endpoint. Requires audio output support; RTSP or SDP
      alone does not establish playback support.
    directionality: in
    schema:
      description: >-
        Play a base64 encoded audio object on the endpoint. Requires audio output support; RTSP or
        SDP alone does not establish playback support.
      type: object
      properties:
        audio:
          type: object
          description: An audio object to play on an endpoint with audio output.
          properties:
            data:
              type: string
              format: byte
              minLength: 4
              maxLength: 13981016
              pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
              description: Base64 encoded audio, at most 10 MiB decoded.
              example: UklGRg==
            mimeType:
              type: string
              pattern: ^audio/[a-zA-Z0-9.+-]+$
              description: The audio MIME type, such as audio/wav or audio/mpeg.
              example: audio/wav
          required:
            - data
            - mimeType
          additionalProperties: false
          title: PlayableAudio
      required:
        - audio
      additionalProperties: false
      title: MediaPlayerInterfacePlayAudioMessage
  - name: play-media
    description: null
    directionality: in
    schema:
      type: object
      properties:
        mediaId:
          title: MediaId
          type: string
          minLength: 1
          example: portos-media://portoperatingsystem.com/spotify/audio/track/Ab123
          pattern: >-
            ^(portos-media://(portpowered[.]com|portoperatingsystem[.]com)/[a-z][a-z0-9_-]*/(audio|video|image)/[a-z][a-z0-9_-]*/([^/?#\s]|%[0-9A-Fa-f]{2})+|https?://[^\s]+|portos://[^\s]+|youtube:(video|channel):[A-Za-z0-9_-]+)$
          description: >
            Exact provider resource identity. The canonical form is
            portos-media://portoperatingsystem.com/provider/media-type/resource-kind/resource-id,
            with no URI version. Spotify emits audio track, playlist, album, artist, show and
            episode identities. The prior portpowered.com authority remains readable. YouTube and
            YouTube Music share provider youtube, with video/video and video/channel resource kinds.
            Legacy youtube:video:ID and youtube:channel:ID identities normalize to the same
            canonical resources. Copy an ID returned by search or library discovery; do not send a
            search phrase as an ID. Legacy providers retain their own input contracts until
            explicitly migrated. See https://portoperatingsystem.com/docs/media.
      required:
        - mediaId
      additionalProperties: false
  - name: play
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: play-uri
    description: null
    directionality: in
    schema:
      type: object
      properties:
        uri:
          type: string
          description: Public HTTPS URI of the audio to play
          format: uri
          minLength: 1
        title:
          type: string
          description: Optional title for display or logging purposes
        sourceType:
          description: >-
            URI transport semantics. Omission retains FILE behavior. LIVE_STREAM requires explicit
            live source support on the selected route; it must not be interpreted as a finite clip.
          allOf:
            - type: string
              description: >-
                Transport source kind for play-uri. FILE is finite externally hosted audio;
                LIVE_STREAM is continuous live audio and requires explicit route support. Neither
                value resolves a catalog provider identity.
              enum:
                - FILE
                - LIVE_STREAM
        offsetInMilliseconds:
          type: integer
          description: Playback start position in milliseconds
          minimum: 0
          default: 0
      required:
        - uri
      additionalProperties: false
  - name: previous
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: rewind
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: search-and-play
    description: >-
      Search for and play media by title or query using a service advertised by the endpoint.
      Omitting mediaType retains audio search behavior; video-only endpoints may default to video.
    directionality: in
    schema:
      description: >-
        Search for and play media by title or query using a service advertised by the endpoint.
        Omitting mediaType retains audio search behavior; video-only endpoints may default to video.
      type: object
      properties:
        query:
          type: string
          description: Query to search for media content
          minLength: 1
        provider:
          type: string
          description: >-
            Media service identifier. A provider enum value does not imply that every endpoint
            supports that service; use the endpoint's advertised provider lists.
          enum:
            - SPOTIFY
            - AMAZON_MUSIC
            - APPLE_MUSIC
            - AUDIBLE
            - TUNE_IN
            - PANDORA
            - IHEART_RADIO
            - SIRIUSXM
            - DEEZER
            - TIDAL
            - YOUTUBE
            - NETFLIX
            - PRIME_VIDEO
            - DAILYMOTION
        mediaType:
          type: string
          enum:
            - AUDIO
            - VIDEO
          description: Media search domain. The endpoint must advertise support for the selected type.
        timerSeconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Optional provider playback timer in seconds.
      required:
        - query
      additionalProperties: false
  - name: seek
    description: null
    directionality: in
    schema:
      type: object
      properties:
        positionMilliseconds:
          type: integer
          description: Position to seek to in milliseconds
          minimum: 0
      required:
        - positionMilliseconds
      additionalProperties: false
  - name: skip-backward
    description: null
    directionality: in
    schema:
      type: object
      properties:
        deltaPositionMilliseconds:
          type: integer
          description: Number of milliseconds to skip backward
          minimum: 0
      additionalProperties: false
  - name: skip-forward
    description: null
    directionality: in
    schema:
      type: object
      properties:
        deltaPositionMilliseconds:
          type: integer
          description: Number of milliseconds to skip forward
          minimum: 0
      additionalProperties: false
  - name: start-over
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: stop
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: transfer-playback
    description: >-
      Move the current playback session of the destination route's connected provider account to
      this one destination, preserving playing or paused state and media context. Select an
      advertised destination route. This affects that account's current session; it does not copy
      media, restart playback, transfer between providers or accounts, or fan out to group members.
      Read fresh source and destination state before and after dispatch to verify the move. An
      unavailable target requires an explicit choice of another destination.
    directionality: in
    schema:
      description: >-
        Move the current playback session of the destination route's connected provider account to
        this one destination, preserving playing or paused state and media context. Select an
        advertised destination route. This affects that account's current session; it does not copy
        media, restart playback, transfer between providers or accounts, or fan out to group
        members. Read fresh source and destination state before and after dispatch to verify the
        move. An unavailable target requires an explicit choice of another destination.
      type: object
      additionalProperties: false
attributes:
  - name: clip-status
    description: >-
      Latest admitted vendor observation for the latest physical-player clip attempt. This is
      separate from ordinary group playback. Missing, expired or revoked observations are
      unavailable, never inferred completion. Command acceptance alone supplies no value; physical
      clips do not support pause or resume.
    schema:
      description: >-
        Latest admitted vendor observation for the latest physical-player clip attempt. This is
        separate from ordinary group playback. Missing, expired or revoked observations are
        unavailable, never inferred completion. Command acceptance alone supplies no value; physical
        clips do not support pause or resume.
      type: object
      properties:
        value:
          type: object
          description: >-
            Bounded passive telemetry for an exactly correlated physical-player command. This
            observation cannot authorize controls, retry playback or establish audible delivery.
          properties:
            attemptId:
              type: string
              minLength: 1
              maxLength: 2048
              pattern: ^[^\x00-\x1F\x7F-\x9F]+$
              description: >-
                Port OS correlation for the latest admitted command, not a vendor media identifier
                or authorization token.
            status:
              type: string
              description: >-
                Vendor-reported physical clip lifecycle. SCHEDULED is command acceptance and is
                excluded. Unknown values and silence do not imply DONE.
              enum:
                - ACTIVE
                - DONE
                - ERROR
                - DISMISSED
                - INTERRUPTED
            errorCode:
              type: string
              description: >-
                Allowlisted Sonos clip error identifier. Omit unrecognized codes and vendor error
                text rather than exposing arbitrary payloads.
              enum:
                - ERROR_AUDIO_CLIP_ID_NOT_FOUND
                - ERROR_AUDIO_CLIP_MEDIA_ERROR
                - ERROR_AUDIO_CLIP_PAUSE_CONTENT_FAILED
            provenance:
              type: object
              description: >-
                Assurance of passive Sonos telemetry. Header authentication, exact issued-command
                correlation and ordering do not authenticate the event body. This is never proof of
                audible delivery or authority for automatic controls.
              properties:
                integration:
                  type: string
                  enum:
                    - SONOS
                  description: Integration that supplied the observation.
                assurance:
                  type: string
                  enum:
                    - PASSIVE_HEADER_AUTH
                  description: >-
                    Signed headers were verified against configured application credentials; the
                    body remains unsigned.
                payloadIntegrity:
                  type: boolean
                  enum:
                    - false
                  description: Always false because Sonos does not sign the callback payload.
              required:
                - integration
                - assurance
                - payloadIntegrity
              additionalProperties: false
              title: MediaClipProvenance
          required:
            - attemptId
            - status
            - provenance
          additionalProperties: false
          title: MediaClipObservation
      required:
        - value
      additionalProperties: false
  - name: current-content
    description: >-
      Currently selected media metadata. Report only metadata supplied by the media provider;
      omission means unknown, not an empty playback session.
    schema:
      description: >-
        Currently selected media metadata. Report only metadata supplied by the media provider;
        omission means unknown, not an empty playback session.
      type: object
      properties:
        value:
          type: object
          description: Metadata for the media currently selected by a provider.
          properties:
            mediaId:
              type: string
              description: Provider media identifier for the selected content.
            nativeIdentity:
              type: object
              description: >-
                Observed Sonos music-service coordinates for the current item, scoped to the
                reporting route and authorized connection. This identity is not a portable catalog
                ID, playable URL or authorization to play content. Preserve opaque values exactly;
                do not decode or log them.
              required:
                - integration
                - objectId
              properties:
                integration:
                  type: string
                  enum:
                    - SONOS
                  description: >-
                    Integration defining this native identity format, independent of the source
                    catalog provider.
                serviceId:
                  type: string
                  minLength: 1
                  maxLength: 20
                  pattern: ^[^\x00-\x1F\x7F-\x9F]+$
                  description: Exact service identifier reported by Sonos, when present.
                objectId:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: ^[^\x00-\x1F\x7F-\x9F]+$
                  description: >-
                    Exact opaque content identifier reported by Sonos, including its original case
                    and percent escapes.
                accountId:
                  type: string
                  minLength: 1
                  maxLength: 13
                  pattern: ^[^\x00-\x1F\x7F-\x9F]+$
                  description: >-
                    Exact Sonos music-service account coordinate, when present. This is not a
                    credential and must not authorize subsequent playback by itself.
              additionalProperties: false
              title: MediaSonosNativeIdentity
            title:
              type: string
              description: Display title supplied by the media provider.
            artist:
              type: string
              description: Artist or creator supplied by the media provider.
            artworkUrl:
              type: string
              format: uri
              description: >-
                HTTP or HTTPS URL of provider artwork. Consumers must treat this as untrusted
                display data, never executable content.
            durationSeconds:
              type: number
              minimum: 0
              description: Reported duration of the selected media in seconds.
            positionSeconds:
              type: number
              minimum: 0
              description: Observed playback position in seconds; not a command acknowledgement.
          additionalProperties: false
          title: MediaCurrentContent
      required:
        - value
      additionalProperties: false
  - name: now-playing
    description: >-
      Media identity observed on this route. Active false means the provider session is on another
      target; it does not prove the speaker is silent through other providers.
    schema:
      description: >-
        Media identity observed on this route. Active false means the provider session is on another
        target; it does not prove the speaker is silent through other providers.
      type: object
      properties:
        active:
          type: boolean
        mediaId:
          title: MediaId
          type: string
          minLength: 1
          example: portos-media://portoperatingsystem.com/spotify/audio/track/Ab123
          pattern: >-
            ^(portos-media://(portpowered[.]com|portoperatingsystem[.]com)/[a-z][a-z0-9_-]*/(audio|video|image)/[a-z][a-z0-9_-]*/([^/?#\s]|%[0-9A-Fa-f]{2})+|https?://[^\s]+|portos://[^\s]+|youtube:(video|channel):[A-Za-z0-9_-]+)$
          description: >
            Exact provider resource identity. The canonical form is
            portos-media://portoperatingsystem.com/provider/media-type/resource-kind/resource-id,
            with no URI version. Spotify emits audio track, playlist, album, artist, show and
            episode identities. The prior portpowered.com authority remains readable. YouTube and
            YouTube Music share provider youtube, with video/video and video/channel resource kinds.
            Legacy youtube:video:ID and youtube:channel:ID identities normalize to the same
            canonical resources. Copy an ID returned by search or library discovery; do not send a
            search phrase as an ID. Legacy providers retain their own input contracts until
            explicitly migrated. See https://portoperatingsystem.com/docs/media.
        contextMediaId:
          $ref: '#/properties/mediaId'
        name:
          type: string
        positionMs:
          description: >-
            Provider-observed position within the current media item in milliseconds. Omitted when
            unknown. Compare fresh observations with media identity and playback state; a track
            transition does not prove continuity.
          type: integer
          minimum: 0
      required:
        - active
      additionalProperties: false
  - name: playback-speed
    description: null
    schema:
      type: object
      properties:
        value:
          type: number
          description: Playback speed multiplier (1.0 = normal speed)
          minimum: 0.1
          maximum: 10
      required:
        - value
      additionalProperties: false
  - name: playback-state
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          description: The current playback state
          enum:
            - PLAYING
            - PAUSED
            - STOPPED
            - LOADING
            - ERROR
      required:
        - value
      additionalProperties: false
configuration:
  description: >-
    Media players select media by its Port OS media ID, play supplied audio or a URI, and control
    playback. Read playback state and use only the commands supported by the connected player.
  type: object
  properties:
    supportedMediaResources:
      type: array
      description: >-
        Exact play-media URI combinations accepted by this route. Member or endpoint unions do not
        imply support by every route.
      items:
        title: SupportedMediaResource
        description: A provider, media type and resource-kind combination accepted by a control route.
        type: object
        properties:
          provider:
            $ref: '#/properties/supportedAudioProviders/items'
          mediaType:
            type: string
            enum:
              - AUDIO
              - VIDEO
              - IMAGE
          resourceKinds:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              description: Lowercase resource-kind segment from the provider URI.
        required:
          - provider
          - mediaType
          - resourceKinds
        additionalProperties: false
    supportedAudioProviders:
      type: array
      uniqueItems: true
      description: >-
        Audio services accepted by search-and-play on this endpoint. These describe command support,
        not active subscriptions.
      items:
        type: string
        description: >-
          Media service identifier. A provider enum value does not imply that every endpoint
          supports that service; use the endpoint's advertised provider lists.
        enum:
          - SPOTIFY
          - AMAZON_MUSIC
          - APPLE_MUSIC
          - AUDIBLE
          - TUNE_IN
          - PANDORA
          - IHEART_RADIO
          - SIRIUSXM
          - DEEZER
          - TIDAL
          - YOUTUBE
          - NETFLIX
          - PRIME_VIDEO
          - DAILYMOTION
    supportedVideoProviders:
      type: array
      uniqueItems: true
      description: >-
        Video services accepted by search-and-play on this endpoint. These describe command support,
        not installed applications or active subscriptions.
      items:
        $ref: '#/properties/supportedAudioProviders/items'
    defaultAudioProvider:
      description: Default service for an audio search. Must be in supportedAudioProviders.
      allOf:
        - $ref: '#/properties/supportedAudioProviders/items'
    defaultVideoProvider:
      description: Default service for a video search. Must be in supportedVideoProviders.
      allOf:
        - $ref: '#/properties/supportedAudioProviders/items'
    supportedPlaybackStates:
      type: array
      items:
        type: string
        description: The current playback state
        enum:
          - PLAYING
          - PAUSED
          - STOPPED
          - LOADING
          - ERROR
      description: Supported playback states
    supportedPlaybackSpeeds:
      type: array
      items:
        type: number
      description: Supported playback speeds (e.g., 0.5, 1.0, 1.5, 2.0)
    seekRange:
      description: Seek range in seconds
      allOf:
        - type: object
          description: Range of measurement values (min and max)
          properties:
            min:
              type: number
              description: Minimum measured value
            max:
              type: number
              description: Maximum measured value
          required:
            - min
            - max
          additionalProperties: false
          title: MeasurementRange
    supportedMediaTypes:
      type: array
      items:
        type: string
        enum:
          - AUDIO
          - VIDEO
          - IMAGE
          - PLAYLIST
      description: List of supported media types
    supportedFormats:
      type: array
      items:
        type: string
        enum:
          - MP3
          - WAV
          - FLAC
          - AAC
          - OGG
          - MP4
          - AVI
          - MKV
          - JPG
          - PNG
          - GIF
      description: List of supported media formats
    maxPlaylistSize:
      type: integer
      description: Maximum number of items in a playlist
      minimum: 1
      maximum: 10000
    defaultQuality:
      type: string
      description: Default quality setting for media playback
      enum:
        - LOW
        - MEDIUM
        - HIGH
        - LOSSLESS
    supportsPlayURI:
      type: boolean
      description: Whether the endpoint can play an audio URI.
    supportedURISourceTypes:
      type: array
      uniqueItems: true
      description: >-
        Exact source kinds accepted by play-uri on this route. With URI support, omission retains
        legacy FILE-only behavior; an empty list admits none. LIVE_STREAM must be explicitly listed.
        This does not resolve provider catalog identities.
      items:
        type: string
        description: >-
          Transport source kind for play-uri. FILE is finite externally hosted audio; LIVE_STREAM is
          continuous live audio and requires explicit route support. Neither value resolves a
          catalog provider identity.
        enum:
          - FILE
          - LIVE_STREAM
    supportedAudioMimeTypes:
      type: array
      description: >-
        Audio MIME types accepted by play-audio. Advertise play-audio only when audio output is
        supported.
      items:
        type: string
    maxAudioDurationSeconds:
      type: integer
      minimum: 1
      maximum: 86400
      description: >-
        Maximum encoded duration accepted by play-audio. Longer inputs are rejected without
        truncation.
    audioPlaybackMode:
      type: string
      enum:
        - CLIP
        - QUEUE
      description: >-
        CLIP means finite immediate play-audio playback, which may interrupt or duck current
        content. QUEUE means finite controllable play-audio playback that replaces the current
        playback session. Neither mode appends to an existing queue, resolves a provider track, or
        establishes a live stream.
  additionalProperties: false
  title: MediaPlayerInterfaceConfiguration
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
