description: >-
  Currently selected media metadata. Report only metadata supplied by the media
  provider; omission means unknown, not an empty playback session.
type: object
properties:
  value:
    type: object
    description: Metadata for the media currently selected by a provider.
    properties:
      mediaId:
        type: string
        description: Provider media identifier for the selected content.
      title:
        type: string
        description: Display title supplied by the media provider.
      artist:
        type: string
        description: Artist or creator supplied by the media provider.
      artworkUrl:
        type: string
        format: uri
        description: >-
          HTTP or HTTPS URL of provider artwork. Consumers must treat this as
          untrusted display data, never executable content.
      durationSeconds:
        type: number
        minimum: 0
        description: Reported duration of the selected media in seconds.
      positionSeconds:
        type: number
        minimum: 0
        description: Observed playback position in seconds; not a command acknowledgement.
    additionalProperties: false
    title: MediaCurrentContent
required:
  - value
additionalProperties: false
