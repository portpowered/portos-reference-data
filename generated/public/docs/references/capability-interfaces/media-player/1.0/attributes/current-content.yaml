description: >-
  Currently selected media metadata. Report only metadata supplied by the media
  provider; omission means unknown, not an empty playback session.
type: object
properties:
  value:
    type: object
    description: Metadata for the media currently selected by a provider.
    properties:
      mediaId:
        type: string
        description: Provider media identifier for the selected content.
      nativeIdentity:
        type: object
        description: >-
          Observed Sonos music-service coordinates for the current item, scoped
          to the reporting route and authorized connection. This identity is not
          a portable catalog ID, playable URL or authorization to play content.
          Preserve opaque values exactly; do not decode or log them.
        required:
          - integration
          - objectId
        properties:
          integration:
            type: string
            enum:
              - SONOS
            description: >-
              Integration defining this native identity format, independent of
              the source catalog provider.
          serviceId:
            type: string
            minLength: 1
            maxLength: 20
            pattern: ^[^\x00-\x1F\x7F-\x9F]+$
            description: Exact service identifier reported by Sonos, when present.
          objectId:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\x00-\x1F\x7F-\x9F]+$
            description: >-
              Exact opaque content identifier reported by Sonos, including its
              original case and percent escapes.
          accountId:
            type: string
            minLength: 1
            maxLength: 13
            pattern: ^[^\x00-\x1F\x7F-\x9F]+$
            description: >-
              Exact Sonos music-service account coordinate, when present. This
              is not a credential and must not authorize subsequent playback by
              itself.
        additionalProperties: false
        title: MediaSonosNativeIdentity
      title:
        type: string
        description: Display title supplied by the media provider.
      artist:
        type: string
        description: Artist or creator supplied by the media provider.
      artworkUrl:
        type: string
        format: uri
        description: >-
          HTTP or HTTPS URL of provider artwork. Consumers must treat this as
          untrusted display data, never executable content.
      durationSeconds:
        type: number
        minimum: 0
        description: Reported duration of the selected media in seconds.
      positionSeconds:
        type: number
        minimum: 0
        description: Observed playback position in seconds; not a command acknowledgement.
    additionalProperties: false
    title: MediaCurrentContent
required:
  - value
additionalProperties: false
