description: >-
  Play a base64 encoded audio object on the endpoint. Requires audio output
  support; RTSP or SDP alone does not establish playback support.
type: object
properties:
  audio:
    type: object
    description: An audio object to play on an endpoint with audio output.
    properties:
      data:
        type: string
        format: byte
        minLength: 4
        maxLength: 13981016
        pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        description: Base64 encoded audio, at most 10 MiB decoded.
        example: UklGRg==
      mimeType:
        type: string
        pattern: ^audio/[a-zA-Z0-9.+-]+$
        description: The audio MIME type, such as audio/wav or audio/mpeg.
        example: audio/wav
    required:
      - data
      - mimeType
    additionalProperties: false
    title: PlayableAudio
required:
  - audio
additionalProperties: false
title: MediaPlayerInterfacePlayAudioMessage
