description: >-
  Move the current playback session of the destination route's connected
  provider account to this one destination, preserving playing or paused state
  and media context. Select an advertised destination route. This affects that
  account's current session; it does not copy media, restart playback, transfer
  between providers or accounts, or fan out to group members. Read fresh source
  and destination state before and after dispatch to verify the move. An
  unavailable target requires an explicit choice of another destination.
type: object
additionalProperties: false
