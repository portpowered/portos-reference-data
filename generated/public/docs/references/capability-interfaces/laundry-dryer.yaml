name: laundry-dryer
namespace: port1/systems/zero/capability-interfaces/laundry-dryer
version: '1.0'
description: >-
  Laundry dryers report their operational state. Use it to show the current appliance status or
  react to a change in a flow.
messages: []
attributes:
  - name: operational-state
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          description: >-
            Operational state of a device. RETURNING_TO_DOCK means a robot is driving back to its
            dock; DOCKED means it is on the dock and not charging; DOCK_MAINTENANCE means it is on
            the dock while the dock services it (emptying the dust bin, washing or drying the mop),
            and it does not start cleaning until that finishes.
          enum:
            - STOPPED
            - RUNNING
            - PAUSED
            - ERROR
            - CHARGING
            - DOCKED
            - RETURNING_TO_DOCK
            - DOCK_MAINTENANCE
      required:
        - value
      additionalProperties: false
configuration: null
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
