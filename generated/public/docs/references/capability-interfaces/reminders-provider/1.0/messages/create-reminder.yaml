description: >-
  Create a reminder in a discovered list. Creation is sent once; refresh before
  retrying an uncertain result.
type: object
additionalProperties: false
properties:
  listId:
    type: string
    minLength: 1
    description: Discovered list identifier.
  title:
    type: string
    minLength: 1
    description: Reminder title.
  notes:
    type: string
  dueDate:
    type: string
    format: date-time
    description: >-
      Exact due instant in RFC3339 with an explicit UTC offset. Omitted on
      undated reminders.
  timeZone:
    type: string
    description: >-
      IANA time zone, for example America/Los_Angeles. Defaults to UTC for newly
      dated reminders.
  allDay:
    type: boolean
    description: Whether the supplied due date represents an all-day reminder.
required:
  - listId
  - title
title: RemindersProviderInterfaceCreateReminderMessage
