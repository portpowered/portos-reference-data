description: Reminder lists and one bounded page of reminders.
type: object
additionalProperties: false
properties:
  reminderLists:
    type: array
    items:
      type: object
      description: A reminder list
      properties:
        listId:
          type: string
        title:
          type: string
      required:
        - listId
      title: ReminderList
  reminders:
    type: array
    items:
      type: object
      additionalProperties: false
      description: A reminder and its current provider revision for guarded edits.
      properties:
        reminderId:
          type: string
        listId:
          type: string
        title:
          type: string
        notes:
          type: string
        completed:
          type: boolean
        revision:
          type: string
          description: >-
            Omitted when the provider does not supply a revision; writes require
            it.
      required:
        - reminderId
        - listId
        - title
        - completed
      title: Reminder
  nextCursor:
    type: string
required:
  - reminderLists
  - reminders
title: RemindersProviderInterfaceListRemindersResponseMessage
