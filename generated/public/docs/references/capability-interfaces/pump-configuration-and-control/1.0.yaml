name: pump-configuration-and-control
namespace: port1/systems/zero/capability-interfaces/pump-configuration-and-control
version: '1.0'
description: >-
  Pump controls set a pump mode and speed. Read its capacity, mode, and status to keep a control
  interface in step with the pump.
messages:
  - name: set-mode
    description: null
    directionality: in
    schema:
      type: object
      properties:
        mode:
          type: string
          enum:
            - STANDARD
            - CONSTANT_SPEED
            - CONSTANT_PRESSURE
            - PROPORTIONAL_PRESSURE
            - CONSTANT_FLOW
            - PROPORTIONAL_FLOW
            - CONSTANT_TEMPERATURE
            - AUTOMATIC
      required:
        - mode
      additionalProperties: false
  - name: set-speed
    description: null
    directionality: in
    schema:
      type: object
      properties:
        speed:
          type: integer
          description: Pump speed percentage (0-100)
          minimum: 0
          maximum: 100
      required:
        - speed
      additionalProperties: false
attributes:
  - name: capacity
    description: null
    schema:
      type: object
      properties:
        value:
          type: number
          description: Pump capacity
          minimum: 0
      required:
        - value
      additionalProperties: false
  - name: pump-mode
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - STANDARD
            - CONSTANT_SPEED
            - CONSTANT_PRESSURE
            - PROPORTIONAL_PRESSURE
            - CONSTANT_FLOW
            - PROPORTIONAL_FLOW
            - CONSTANT_TEMPERATURE
            - AUTOMATIC
      required:
        - value
      additionalProperties: false
  - name: pump-status
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          description: >-
            Operational state of a device. RETURNING_TO_DOCK means a robot is driving back to its
            dock; DOCKED means it is on the dock and not charging.
          enum:
            - STOPPED
            - RUNNING
            - PAUSED
            - ERROR
            - CHARGING
            - DOCKED
            - RETURNING_TO_DOCK
      required:
        - value
      additionalProperties: false
configuration:
  type: object
  properties:
    supportedPumpModes:
      type: array
      items:
        type: string
        enum:
          - STANDARD
          - CONSTANT_SPEED
          - CONSTANT_PRESSURE
          - PROPORTIONAL_PRESSURE
          - CONSTANT_FLOW
          - PROPORTIONAL_FLOW
          - CONSTANT_TEMPERATURE
          - AUTOMATIC
      description: Supported pump modes
  additionalProperties: false
  description: >-
    Pump controls set a pump mode and speed. Read its capacity, mode, and status to keep a control
    interface in step with the pump.
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
