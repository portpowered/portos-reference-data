name: doorbell
namespace: port1/systems/zero/capability-interfaces/doorbell
version: '1.0'
description: >-
  Doorbells emit a chime event. Use that event to start a notification or another flow when someone
  rings the bell.
messages:
  - name: chime
    description: A distinct doorbell press. A chime does not imply a door was opened.
    directionality: out
    schema:
      description: A distinct doorbell press. A chime does not imply a door was opened.
      type: object
      properties:
        value:
          type: string
          enum:
            - PRESSED
      required:
        - value
      additionalProperties: false
attributes: []
configuration: null
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
