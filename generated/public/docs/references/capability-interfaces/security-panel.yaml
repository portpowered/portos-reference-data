name: security-panel
namespace: port1/systems/zero/capability-interfaces/security-panel
version: '1.0'
description: >-
  Security panels accept arm and disarm commands and report alarm and arming states. Use those
  reports to show the status supplied by a connected panel.
messages:
  - name: arm
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: disarm
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
attributes:
  - name: arm-state
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - ARMED_AWAY
            - ARMED_STAY
            - ARMED_NIGHT
            - DISARMED
      required:
        - value
      additionalProperties: false
  - name: burglary-alarm
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - OK
            - ALARM
      required:
        - value
      additionalProperties: false
  - name: carbon-monoxide-alarm
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - OK
            - ALARM
      required:
        - value
      additionalProperties: false
  - name: delay-state
    description: null
    schema:
      type: object
      properties:
        state:
          type: string
          enum:
            - ENTRY_DELAY
            - EXIT_DELAY
            - NONE
        delayInSeconds:
          type: integer
        playlistId:
          type: string
        playOrder:
          type: array
          items:
            type: object
            description: A play order item for security panel audio playback
            properties:
              assetId:
                type: string
              loopCount:
                type: integer
              loopPauseInMilliseconds:
                type: integer
            title: SecurityPlayOrderItem
      additionalProperties: false
  - name: fire-alarm
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - OK
            - ALARM
      required:
        - value
      additionalProperties: false
  - name: siren-state
    description: null
    schema:
      type: object
      properties:
        state:
          type: string
          enum:
            - 'ON'
            - 'OFF'
        playlistId:
          type: string
        playOrder:
          type: array
          items:
            type: object
            description: A play order item for security panel audio playback
            properties:
              assetId:
                type: string
              loopCount:
                type: integer
              loopPauseInMilliseconds:
                type: integer
            title: SecurityPlayOrderItem
      additionalProperties: false
  - name: water-alarm
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - OK
            - ALARM
      required:
        - value
      additionalProperties: false
configuration:
  type: object
  properties:
    supportedAuthorizationTypes:
      type: array
      items:
        type: object
        description: A supported security authorization type
        properties:
          type:
            type: string
            enum:
              - FOUR_DIGIT_PIN
        title: SecurityAuthorizationType
    supportedArmStates:
      type: array
      items:
        type: object
        description: A supported security arm state
        properties:
          value:
            type: string
            enum:
              - ARMED_AWAY
              - ARMED_STAY
              - ARMED_NIGHT
              - DISARMED
        title: SecurityArmState
    alerts:
      type: array
      items:
        type: object
        description: A security alert type
        properties:
          type:
            type: string
            enum:
              - CHIME
              - SIREN
              - ENTRY_DELAY
              - EXIT_DELAY
        title: SecurityAlert
    assets:
      type: array
      items:
        type: object
    playlists:
      type: array
      items:
        type: object
        description: A security panel audio playlist
        properties:
          id:
            type: string
          playOrder:
            type: array
            items:
              type: object
              description: A play order item for security panel audio playback
              properties:
                assetId:
                  type: string
                loopCount:
                  type: integer
                loopPauseInMilliseconds:
                  type: integer
              title: SecurityPlayOrderItem
        title: SecurityPlaylist
  additionalProperties: false
  description: >-
    Security panels accept arm and disarm commands and report alarm and arming states. Use those
    reports to show the status supplied by a connected panel.
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
