name: content-launcher
namespace: port1/systems/zero/capability-interfaces/content-launcher
version: '1.0'
description: >-
  Content launchers open content or a URL on a connected device. Use them to
  send a selected item to a screen or start the content a customer asked for.
messages:
  - name: launch-content
    description: null
    directionality: in
    schema:
      type: object
      properties:
        search:
          type: object
          description: Content search criteria
          properties:
            parameterList:
              type: array
              items:
                type: object
                description: A content search parameter
                properties:
                  type:
                    type: string
                    enum:
                      - VIDEO
                      - AUDIO
                      - IMAGE
                      - OTHER
                  value:
                    type: string
                required:
                  - type
                  - value
                additionalProperties: false
                title: ContentSearchParameter
          additionalProperties: false
          title: ContentSearch
        autoPlay:
          type: boolean
          description: Whether to auto-play the content
          default: true
      additionalProperties: false
  - name: launch-url
    description: null
    directionality: in
    schema:
      type: object
      properties:
        contentUrl:
          type: string
          format: uri
          description: URL of the content to launch
        displayString:
          type: string
          description: Display string for the content
        brandingInformation:
          type: object
          description: Content provider branding information
          properties:
            providerName:
              type: string
              description: Provider name
            background:
              type: string
              format: uri
              description: Background image URL
            logo:
              type: string
              format: uri
              description: Logo image URL
          additionalProperties: false
          title: BrandingInformation
      required:
        - contentUrl
      additionalProperties: false
attributes: []
configuration:
  type: object
  properties:
    acceptHeader:
      type: string
      description: Accept header for content requests
    supportedStreamingProtocols:
      type: array
      items:
        type: string
        enum:
          - DASH
          - HLS
          - SMOOTH_STREAMING
          - OTHER
      description: Supported streaming protocols
  additionalProperties: false
  description: >-
    Content launchers open content or a URL on a connected device. Use them to
    send a selected item to a screen or start the content a customer asked for.
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
