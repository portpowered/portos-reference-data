name: light-sensor
namespace: port1/systems/zero/capability-interfaces/light-sensor
version: '1.0'
description: >-
  Light sensors report illuminance. Use the reading to understand ambient light and provide input to
  a lighting automation.
messages: []
attributes:
  - name: illuminance
    description: null
    schema:
      type: object
      properties:
        value:
          type: number
          description: >-
            The illuminance value is a number between 1 and 65533. This attribute SHALL indicate the
            illuminance in Lux (symbol lx) as follows:
              • MeasuredValue = 10,000 x log10(illuminance) + 1,
                where 1 lx <= illuminance <= 3.576 Mlx, corresponding to a MeasuredValue in the range 1 to 0xFFFE.
                The MeasuredValue attribute can take the following values:
              • 0 indicates a value of illuminance that is too low to be measured,
              • MinMeasuredValue <= MeasuredValue <= MaxMeasuredValue under normal circumstances,
              • null indicates that the illuminance measurement is invalid.
                The MeasuredValue attribute is updated continuously as new measurements are made
      required:
        - value
      additionalProperties: false
configuration: null
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
