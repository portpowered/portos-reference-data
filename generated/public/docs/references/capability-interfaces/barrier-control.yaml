name: barrier-control
namespace: port1/systems/zero/capability-interfaces/barrier-control
version: '1.0'
description: >-
  Barrier control opens, closes, or positions a connected barrier. Read its
  position and state to check a garage door or gate before sending the next
  command.
messages:
  - name: close
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
  - name: go-to-position
    description: null
    directionality: in
    schema:
      type: object
      properties:
        position:
          type: integer
          description: Barrier position percentage (0-100)
          minimum: 0
          maximum: 100
      required:
        - position
      additionalProperties: false
  - name: open
    description: null
    directionality: in
    schema:
      type: object
      additionalProperties: false
attributes:
  - name: barrier-position
    description: null
    schema:
      type: object
      properties:
        value:
          type: integer
          description: Barrier position percentage (0-100)
          minimum: 0
          maximum: 100
      required:
        - value
      additionalProperties: false
  - name: barrier-state
    description: null
    schema:
      type: object
      properties:
        value:
          type: string
          enum:
            - CLOSED
            - OPEN
            - OPENING
            - CLOSING
            - STOPPED
      required:
        - value
      additionalProperties: false
configuration: null
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
