name: flow-sensor
namespace: port1/systems/zero/capability-interfaces/flow-sensor
version: '1.0'
description: >-
  Flow measurements report the flow observed by a sensor. Use the reading and
  its declared units to monitor changes in a connected system.
messages: []
attributes:
  - name: measured-value
    description: null
    schema:
      type: object
      properties:
        value:
          type: object
          description: A measurement value with optional null support
          properties:
            value:
              type: number
              description: The measured value
            isNull:
              type: boolean
              description: True if the measurement is invalid/null
              default: false
          required:
            - value
            - isNull
          additionalProperties: false
          title: MeasurementValue
        unit:
          type: string
          description: Unit of measurement
          enum:
            - LUX
            - PPM
            - PPB
            - PERCENT
            - PASCAL
            - LITERS_PER_MINUTE
            - PERCENT_VOLUME
            - PH
            - SIEMENS_PER_METER
            - METERS_PER_SECOND
            - DEGREES_CELSIUS
            - DEGREES_FAHRENHEIT
      required:
        - value
        - unit
      additionalProperties: false
configuration: null
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
