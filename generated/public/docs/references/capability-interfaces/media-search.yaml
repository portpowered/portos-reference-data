name: media-search
namespace: port1/systems/zero/capability-interfaces/media-search
version: '1.0'
description: >-
  Media search requests content matching a search and returns audio media
  results. Use it to find an item before asking a player to play it.
messages:
  - name: audio-media-results
    description: null
    directionality: out
    schema:
      type: object
      properties:
        artists:
          type: array
          items:
            type: object
            description: Artist information
            properties:
              id:
                type: string
                description: Unique identifier for the artist
                minLength: 1
              name:
                type: string
                description: Artist name
                minLength: 1
            required:
              - id
              - name
            additionalProperties: false
            title: Artist
          description: Artist results
        albums:
          type: array
          items:
            type: object
            description: Album information
            properties:
              id:
                type: string
                description: Unique identifier for the album
                minLength: 1
              name:
                type: string
                description: Album name
                minLength: 1
              artists:
                type: array
                items:
                  $ref: '#/properties/artists/items'
                description: Album artists
            required:
              - id
              - name
              - artists
            additionalProperties: false
            title: Album
          description: Album results
        tracks:
          type: array
          items:
            type: object
            description: Track information
            properties:
              id:
                type: string
                description: Unique identifier for the track
                minLength: 1
              name:
                type: string
                description: Track name
                minLength: 1
              artists:
                type: array
                items:
                  $ref: '#/properties/artists/items'
                description: Track artists
              album:
                $ref: '#/properties/albums/items'
                description: Track album
            required:
              - id
              - name
              - artists
              - album
            additionalProperties: false
            title: Track
          description: Track results
        playlists:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Unique identifier for the playlist
                minLength: 1
              name:
                type: string
                description: Playlist name
                minLength: 1
            required:
              - id
              - name
            additionalProperties: false
            title: Playlist
          description: Playlist results
      required:
        - artists
        - albums
        - tracks
        - playlists
      additionalProperties: false
  - name: search-media
    description: null
    directionality: in
    schema:
      type: object
      properties:
        query:
          type: string
          description: Freeform query string
        type:
          type: string
          description: Supported types, track, album, artist, playlist. Defaults to track
          default: track
        album:
          type: string
          description: >-
            Search by album name, can only be used when searching albums, and
            tracks
        artist:
          type: string
          description: >-
            Search by artist name, can only be used when searching artists,
            albums and tracks
        year:
          type: string
          description: >-
            Search by year, can only be used when searching albums, years, and
            tracks. You can pass a range like 1990-2000
      required:
        - query
      additionalProperties: false
attributes: []
configuration: null
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
