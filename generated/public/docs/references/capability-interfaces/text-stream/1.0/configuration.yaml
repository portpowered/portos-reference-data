type: object
properties:
  maxChunkSize:
    type: integer
    description: Maximum size for individual text chunks
    default: 500
  maxStreamLength:
    type: integer
    description: Maximum total length for text streams
    default: 50000
  supportedEncodings:
    type: array
    items:
      type: string
      enum:
        - utf-8
        - ascii
        - latin1
    description: Supported text encodings
  defaultEncoding:
    type: string
    description: Default text encoding
    default: utf-8
  legacyMode:
    type: boolean
    description: Whether to use legacy mode for compatibility
    default: true
  chunkTimeout:
    type: integer
    description: Timeout in milliseconds for chunk delivery
    default: 10000
required:
  - maxChunkSize
  - maxStreamLength
  - supportedEncodings
  - defaultEncoding
  - legacyMode
  - chunkTimeout
additionalProperties: false
description: >-
  Text streams emit text as a stream of messages. Use the stream to consume output as it becomes
  available.
