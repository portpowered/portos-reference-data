description: List recordings response.
type: object
properties:
  items:
    type: array
    items:
      type: object
      description: A stored recording.
      properties:
        recordingId:
          type: string
          minLength: 1
          description: Provider identifier of the recording.
        mediaId:
          title: MediaId
          type: string
          minLength: 1
          example: portos-media://portoperatingsystem.com/spotify/audio/track/Ab123
          pattern: >-
            ^(portos-media://(portpowered[.]com|portoperatingsystem[.]com)/[a-z][a-z0-9_-]*/(audio|video|image)/[a-z][a-z0-9_-]*/([^/?#\s]|%[0-9A-Fa-f]{2})+|https?://[^\s]+|portos://[^\s]+|youtube:(video|channel):[A-Za-z0-9_-]+)$
          description: >
            Exact provider resource identity. The canonical form is
            portos-media://portoperatingsystem.com/provider/media-type/resource-kind/resource-id,
            with no URI version. Spotify emits audio track, playlist, album,
            artist, show and episode identities. The prior portpowered.com
            authority remains readable. YouTube and YouTube Music share provider
            youtube, with video/video and video/channel resource kinds. Legacy
            youtube:video:ID and youtube:channel:ID identities normalize to the
            same canonical resources. Copy an ID returned by search or library
            discovery; do not send a search phrase as an ID. Legacy providers
            retain their own input contracts until explicitly migrated. See
            https://portoperatingsystem.com/docs/media.
        startedAt:
          type: string
          format: date-time
          description: Recording start time.
        durationSeconds:
          type: number
          minimum: 0
          description: Recording duration in seconds.
      required:
        - recordingId
      additionalProperties: false
      title: Recording
    description: Recordings in this page.
  nextCursor:
    type: string
    description: >-
      Opaque cursor for the next page; omitted when there are no further
      results.
required:
  - items
additionalProperties: false
title: RecordingsInterfaceListRecordingsResponseMessage
