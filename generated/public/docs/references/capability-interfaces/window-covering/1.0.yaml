name: window-covering
namespace: port1/systems/zero/capability-interfaces/window-covering
version: '1.0'
description: >-
  Window coverings move to a requested lift or tilt percentage. Read their reported position to keep
  a shade or blind control in step with the device.
messages:
  - name: go-to-lift-percentage
    description: null
    directionality: in
    schema:
      type: object
      properties:
        liftPercent100thsValue:
          type: integer
          description: Lift position in percent (0-10000, where 10000 = 100%)
          minimum: 0
          maximum: 10000
      required:
        - liftPercent100thsValue
      additionalProperties: false
  - name: go-to-tilt-percentage
    description: null
    directionality: in
    schema:
      type: object
      properties:
        tiltPercent100thsValue:
          type: integer
          description: Tilt position in percent (0-10000, where 10000 = 100%)
          minimum: 0
          maximum: 10000
      required:
        - tiltPercent100thsValue
      additionalProperties: false
attributes:
  - name: position
    description: null
    schema:
      type: object
      properties:
        liftPosition:
          type: integer
          description: Lift position percentage (0-100)
          minimum: 0
          maximum: 100
        tiltPosition:
          type: integer
          description: Tilt position percentage (0-100)
          minimum: 0
          maximum: 100
      required:
        - liftPosition
      additionalProperties: false
configuration:
  type: object
  properties:
    supportsLift:
      type: boolean
      description: Whether the window covering supports lift control
      default: true
    supportsTilt:
      type: boolean
      description: Whether the window covering supports tilt control
      default: false
  additionalProperties: false
  description: >-
    Window coverings move to a requested lift or tilt percentage. Read their reported position to
    keep a shade or blind control in step with the device.
authorization:
  configuration: endpoint:read
  attributes: endpoint:read
  inboundMessages: message:send
  resourcePermissionRequired: true
