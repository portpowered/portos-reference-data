  /plugin-oauth-authorizations:
    post:
      operationId: beginPluginOAuthAuthorization
      tags:
        - Plugins
      summary: Begin plugin OAuth authorization
      description: >-
        Starts a state-managed provider connection for the authenticated principal. Requires the
        plugin-establish-link permission and, for renewal, auth-link-write on the exact selected
        connection. The configured provider and host must support the state-managed flow. Client
        credentials, scope, issuer, PKCE material and principal cannot be supplied by the caller.

        The attempt expires after five minutes. The exact original URL/expiry may be replayed under
        the same Idempotency-Key for 24 hours, even after attempt expiry. Begin with a fresh key to
        obtain a new attempt; replay never extends it. Current authorization and renewal eligibility
        are checked before replay.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - oauth2: []
        - bearerAuth: []
      x-portos-delegated: false
      x-portos-resource-permission: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginOAuthAuthorizationRequest'
            example:
              pluginId: port1/systems/zero/plugins/9d21576b-e2fe-4d6a-99ab-4fc969a08d53
              redirectUri: https://auth.portoperatingsystem.com/plugins
      responses:
        '200':
          description: Authorization attempt persisted; the account is not connected yet.
          headers:
            Cache-Control:
              description: Authorization responses must not be cached.
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOAuthAuthorizationResponse'
              example:
                authorizationUrl: >-
                  https://api.sonos.com/login/v3/oauth?client_id=example&response_type=code&state=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                expiresAt: '2026-10-16T12:05:00Z'
        '400':
          description: Malformed request, unsupported configuration or missing/invalid Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: BAD_REQUEST
                code: BAD_REQUEST
                message: Authorization request is invalid; start connecting again
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: UNAUTHORIZED
                code: UNAUTHORIZED
                message: Sign in before connecting this provider
        '403':
          description: Current plugin or renewal permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: FORBIDDEN
                code: FORBIDDEN
                message: You do not have permission to connect this provider
        '404':
          description: Selected plugin or renewal connection no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: NOT_FOUND
                code: NOT_FOUND
                message: The selected connection no longer exists; choose another connection
        '409':
          description: A request with the same Idempotency-Key is still in flight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: CONFLICT
                code: IDEMPOTENCY_KEY_IN_FLIGHT
                message: >-
                  Authorization is in progress or uncertain; start a new authorization if no
                  committed result is available
        '422':
          description: Idempotency-Key was used with a different payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: UNPROCESSABLE_ENTITY
                code: IDEMPOTENCY_KEY_REUSED
                message: Idempotency-Key has a different request body; use a new key
        '500':
          description: Host authorization storage failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: INTERNAL_SERVER_ERROR
                code: INTERNAL
                message: Authorization could not be saved; retry with the same request key
        '503':
          description: Authorization service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: SERVICE_UNAVAILABLE
                code: SERVICE_UNAVAILABLE
                message: Authorization is unavailable; retry with the same request key
  /plugin-oauth-authorization-completions:
    post:
      operationId: completePluginOAuthAuthorization
      tags:
        - Plugins
      summary: Complete plugin OAuth authorization
      description: >-
        Completes a state-managed connection for the authenticated principal using the exact plugin,
        new/renewal intent and redirect from its begin request. Requires the plugin-establish-link
        permission and, for renewal, auth-link-write on the selected connection. Current eligibility
        is checked before replaying a committed response.

        One transaction consumes state and commits an exchange-started fence before contacting the
        provider. Credential/connection installation and the nonsecret completion receipt then
        commit together. A successful response means that installation committed; it does not prove
        device discovery or playback.

        Retry a transport failure with the same complete payload and Idempotency-Key. A committed
        result is replayed for 24 hours. An exchange-started or uncertain result returns 409 and
        cannot be repaired by another key or token exchange; start a fresh authorization instead.
        Vendor failure never rearms consumed state. Callback code and state must not be logged or
        placed in URL paths.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - oauth2: []
        - bearerAuth: []
      x-portos-delegated: false
      x-portos-resource-permission: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginOAuthCompletionRequest'
            example:
              pluginId: port1/systems/zero/plugins/9d21576b-e2fe-4d6a-99ab-4fc969a08d53
              redirectUri: https://auth.portoperatingsystem.com/plugins
              code: provider-code-example
              state: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '200':
          description: Connection installation committed, or its committed response was replayed.
          headers:
            Cache-Control:
              description: Authorization responses must not be cached.
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOAuthCompletionResponse'
              example:
                authLinkId: port1/principals/example/auth-links/installed-connection
        '400':
          description: Malformed request, invalid/expired state or missing/invalid Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: BAD_REQUEST
                code: BAD_REQUEST
                message: Authorization request is invalid; start connecting again
        '401':
          description: Authentication required or provider authorization credentials rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: UNAUTHORIZED
                code: UNAUTHORIZED
                message: Sign in before connecting this provider
        '403':
          description: Current plugin or renewal permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: FORBIDDEN
                code: FORBIDDEN
                message: You do not have permission to connect this provider
        '404':
          description: Selected plugin or renewal connection no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: NOT_FOUND
                code: NOT_FOUND
                message: The selected connection no longer exists; choose another connection
        '409':
          description: An exchange is in progress or uncertain; do not exchange again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: CONFLICT
                code: IDEMPOTENCY_KEY_IN_FLIGHT
                message: >-
                  Authorization is in progress or uncertain; start a new authorization if no
                  committed result is available
        '422':
          description: Idempotency-Key was used with a different payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: UNPROCESSABLE_ENTITY
                code: IDEMPOTENCY_KEY_REUSED
                message: Idempotency-Key has a different request body; use a new key
        '429':
          description: Provider authorization is rate limited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: TOO_MANY_REQUESTS
                code: TOO_MANY_REQUESTS
                message: Provider authorization is rate limited; try again later
        '500':
          description: Host storage or installation failed; retry with the same request key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: INTERNAL_SERVER_ERROR
                code: INTERNAL
                message: Authorization could not be saved; retry with the same request key
        '502':
          description: Provider returned an invalid authorization response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: PROVIDER_BAD_RESPONSE
                code: INVALID_PROVIDER_RESPONSE
                message: Provider authorization returned an invalid response; start connecting again
        '503':
          description: Provider or authorization service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: SERVICE_UNAVAILABLE
                code: SERVICE_UNAVAILABLE
                message: Authorization is unavailable; retry with the same request key
        '504':
          description: Provider authorization timed out; start a fresh authorization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                family: PROVIDER_TIMEOUT
                code: PROVIDER_TIMEOUT
                message: Provider authorization timed out; start a fresh authorization
  /endpoint-groups:
