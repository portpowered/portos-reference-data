        icon:
          type: string
          description: Icon identifier from plugin metadata (populated when expand=metadata)
        authType:
          type: string
          enum:
            - OAUTH2
            - TWO_FACTOR
            - API_KEY
            - API_KEY_ENDPOINT
            - USERNAME_PASSWORD
            - QR_CODE
            - CODE_LINK
            - NONE
          x-enum-varnames:
            - Oauth2
            - TwoFactor
            - ApiKey
            - ApiKeyEndpoint
            - UsernamePassword
            - QrCode
            - CodeLink
            - None
          description: >-
            Authentication type from plugin metadata (populated when expand=metadata). "API_KEY"
            accepts a single API key; "API_KEY_ENDPOINT" accepts both an API key and a custom
            endpoint URL (used for OpenAI-compatible providers where users bring their own base
            URL); "QR_CODE" uses an access-code + QR code scanning flow (e.g., Tuya Smart app).
        oauth:
          $ref: '#/components/schemas/PluginMetadataOAuth'
        multifactor:
          $ref: '#/components/schemas/PluginMetadataMultifactor'
        capabilityInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/PluginCapabilityInterface'
          description: Capability interfaces from plugin metadata (populated when expand=metadata)
        authorizationVariants:
          type: array
          items:
            $ref: '#/components/schemas/PluginAuthorizationVariant'
          description: Authorization variants the plugin supports (populated when expand=metadata)
        regionalizations:
          type: array
          items:
            $ref: '#/components/schemas/PluginRegionalization'
          description: Regionalizations the plugin supports (populated when expand=metadata)
    WebsocketPlugin:
      allOf:
        - $ref: '#/components/schemas/BasePlugin'
        - type: object
          required:
            - connectionId
            - active
          properties:
            connectionId:
              type: string
              description: Unique identifier provided for a websocket by the websocket gateway
            active:
              type: boolean
              description: Whether the websocket connection is active
    OAuth2ConnectionData:
      type: object
      required:
        - clientId
        - clientSecret
        - redirectUri
      properties:
        clientId:
          type: string
          description: The OAuth2 client ID
        clientSecret:
          type: string
          description: The OAuth2 client secret
        redirectUri:
          type: string
          description: The OAuth2 redirect URI
        tokenUrl:
          type: string
          description: The OAuth2 token endpoint URL used for token exchange and refresh
    HttpPlugin:
      allOf:
        - $ref: '#/components/schemas/BasePlugin'
        - type: object
          required:
            - oauthConnectionData
          properties:
            oauthConnectionData:
              description: OAuth2 connection data for the HTTP plugin
              allOf:
                - $ref: '#/components/schemas/OAuth2ConnectionData'
    WebservicePlugin:
      allOf:
        - $ref: '#/components/schemas/BasePlugin'
        - type: object
          required:
            - routingIdentifier
            - oauthConnectionData
          properties:
            routingIdentifier:
              type: string
              description: The web URI where requests should be dispatched to
            oauthConnectionData:
              description: OAuth2 connection data for the webservice plugin
              allOf:
                - $ref: '#/components/schemas/OAuth2ConnectionData'
    ApplePushNotificationPlugin:
      allOf:
        - $ref: '#/components/schemas/BasePlugin'
        - type: object
          required:
            - bundleId
            - environment
            - teamId
            - keyId
            - topic
          properties:
            bundleId:
              type: string
              description: The bundle ID of the application receiving notifications
            environment:
              type: string
              enum:
                - DEVELOPMENT
                - PRODUCTION
              x-enum-varnames:
                - ApplePushEnvironmentDevelopment
                - ApplePushEnvironmentProduction
              description: The environment to push against
            teamId:
              type: string
              description: The team ID of the application receiving notifications
            keyId:
              type: string
              description: The key ID of the application receiving notifications
            topic:
              type: string
              description: The topic for the notification (usually the app's bundle ID)
    HostedComputePlugin:
      allOf:
        - $ref: '#/components/schemas/BasePlugin'
        - type: object
          required:
            - computationId
            - oauth2ConnectionData
          properties:
            computationId:
              type: string
              description: The ID of the hosted computation
            oauth2ConnectionData:
              description: OAuth2 connection data for the hosted compute plugin
              allOf:
                - $ref: '#/components/schemas/OAuth2ConnectionData'
    Plugin:
      oneOf:
        - $ref: '#/components/schemas/WebsocketPlugin'
        - $ref: '#/components/schemas/HttpPlugin'
        - $ref: '#/components/schemas/WebservicePlugin'
        - $ref: '#/components/schemas/ApplePushNotificationPlugin'
        - $ref: '#/components/schemas/HostedComputePlugin'
      discriminator:
        propertyName: type
        mapping:
          WEBSOCKET: '#/components/schemas/WebsocketPlugin'
          HTTP: '#/components/schemas/HttpPlugin'
          WEBSERVICE: '#/components/schemas/WebservicePlugin'
          APPLE_PUSH_NOTIFICATION: '#/components/schemas/ApplePushNotificationPlugin'
          HOSTED_COMPUTE: '#/components/schemas/HostedComputePlugin'
    PluginsList:
      type: array
      items:
        $ref: '#/components/schemas/Plugin'
    EnumeratePluginsResponse:
      type: object
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/PluginsList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    UpsertPluginRequest:
      type: object
      properties:
        plugin:
          $ref: '#/components/schemas/Plugin'
        applePushNotificationSecret:
          type: object
          description: >-
            APNS authentication token secret (required when creating an APPLE_PUSH_NOTIFICATION
            plugin with new credentials)
          properties:
            keyId:
              type: string
              description: The Apple Push Notification key ID
            authKey:
              type: string
              description: The Apple Push Notification private key (P8 file contents)
        secretReferenceId:
          type: string
          description: >-
            Reference to an existing secret in the secret store (use instead of inline credentials
            when the secret already exists)
    UpsertPluginResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The created plugin ID
          pattern: ^port1/[^/]+/[^/]+/plugins/[^/]+$
    DeletePluginRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The plugin ID to delete
    EstablishPluginRequest:
      type: object
      required:
        - plugin
      properties:
        plugin:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              description: |
                The plugin type (e.g. webservice, applePushNotification)
            applePushNotificationPlugin:
              type: object
              description: Configuration for Apple Push Notification plugins
            webservicePlugin:
              type: object
              description: Configuration for HTTP-based remote plugins
            clientCredentials:
              type: object
              description: OAuth client credentials for webservice plugins
              properties:
                clientId:
                  type: string
                clientSecret:
                  type: string
                tokenEndpoint:
                  type: string
            secretReferenceId:
              type: string
              description: Reference to an existing secret in the secret store
            applePushNotificationSecret:
              type: object
              description: APNS authentication token secret
    EstablishPluginResponse:
      type: object
      required:
        - pluginId
      properties:
        pluginId:
          type: string
          description: The ID of the created or updated plugin
        isUpdateResponse:
          type: boolean
          description: Whether this was an update to an existing plugin rather than a new creation
    AuthLinkSecret:
      type: object
      required:
        - id
        - role
      properties:
        id:
          type: string
          description: The unique identifier for the secret
        role:
          $ref: '#/components/schemas/AuthLinkSecretRole'
    AuthLinkStatus:
      type: string
      description: Lifecycle state of an auth link. A DRAFT is incomplete and not yet usable by endpoints.
      enum:
        - DRAFT
        - CONNECTED
    AuthLinkProviderConfiguration:
      type: object
      description: Provider-specific, non-secret configuration of an auth link.
      additionalProperties: false
      properties:
        nestDeviceAccess:
          type: object
          description: Google Nest Device Access configuration.
          additionalProperties: false
          properties:
            projectId:
              type: string
              pattern: ^[A-Za-z0-9-]{1,128}$
              description: The Device Access project ID.
    AuthLinkReadiness:
      type: object
      description: Whether an auth link has everything its authorization variant requires.
      readOnly: true
      required:
        - state
        - missingSecretRoles
        - missingConfiguration
      properties:
        state:
          type: string
          enum:
            - READY
            - INCOMPLETE
            - NEEDS_REPAIR
        missingSecretRoles:
          type: array
          items:
            $ref: '#/components/schemas/AuthLinkSecretRole'
          description: Secret roles the variant requires that the link does not have.
        missingConfiguration:
          type: array
          items:
            type: string
          description: Names of required provider configuration fields that are not set.
    AuthLink:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the auth link
          pattern: ^port1/[^/]+/[^/]+/auth-links/[^/]+$
        ownerId:
          type: string
          description: The owner ID of the auth link
        associatedPrincipalId:
          type: string
          description: The ID of the associated principal that the auth link is established against
        associatedSecrets:
          type: array
          items:
            $ref: '#/components/schemas/AuthLinkSecret'
          description: List of associated secrets that are relevant to the auth link
        associatedPluginId:
          type: string
          description: The ID of the associated plugin
        owner:
          $ref: '#/components/schemas/Principal'
        status:
          $ref: '#/components/schemas/AuthLinkStatus'
        authorizationVariantId:
          type: string
          description: The plugin authorization variant the link uses
        regionalizationId:
          type: string
          description: The plugin regionalization the link targets
        providerConfiguration:
          $ref: '#/components/schemas/AuthLinkProviderConfiguration'
        etag:
          type: string
          readOnly: true
          description: The quoted strong entity tag of the auth link, for If-Match
        readiness:
          $ref: '#/components/schemas/AuthLinkReadiness'
    AuthLinksList:
      type: array
      items:
        $ref: '#/components/schemas/AuthLink'
    EnumerateAuthLinksResponse:
      type: object
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/AuthLinksList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    UpsertAuthLinkRequest:
      type: object
      description: A request denoting the creation of an auth link between a principal and a plugin
      required:
        - authLink
      properties:
        authLink:
          $ref: '#/components/schemas/AuthLink'
    UpsertAuthLinkResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The created auth link ID
    DeleteAuthLinkRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The auth link ID to delete
    CreateAuthLinkDraftRequest:
      type: object
      description: Create a draft auth link for a plugin authorization variant.
      additionalProperties: false
      required:
        - pluginId
        - authorizationVariantId
        - regionalizationId
      properties:
        pluginId:
          type: string
          description: The plugin the link is for.
        authorizationVariantId:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          maxLength: 63
          description: The plugin authorization variant the link uses.
        regionalizationId:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          maxLength: 63
          description: The plugin regionalization the link targets.
        providerConfiguration:
          $ref: '#/components/schemas/AuthLinkProviderConfiguration'
        oauthClient:
          description: The customer OAuth client, either an existing secret or new client credentials.
          oneOf:
            - type: object
              title: ExistingOAuthClient
              additionalProperties: false
              required:
                - secretId
              properties:
                secretId:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  description: An existing OAuth client secret owned by the caller.
            - type: object
              title: NewOAuthClient
              additionalProperties: false
              required:
                - clientId
                - clientSecret
              properties:
                clientId:
                  type: string
                  minLength: 1
                  maxLength: 2048
                clientSecret:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  writeOnly: true
    AuthLinkClientCredentialSummary:
      type: object
      description: A reusable customer OAuth client, without its secret.
      required:
        - id
        - type
        - clientId
        - updatedAt
        - etag
      properties:
        id:
          type: string
          description: The secret ID of the client credential.
        type:
          type: string
          description: The secret type.
        clientId:
          type: string
          description: The OAuth client ID.
        updatedAt:
          type: string
          format: date-time
        etag:
          type: string
          description: The quoted strong entity tag of the credential.
    AuthLinkClientCredentialSummaries:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuthLinkClientCredentialSummary'
        nextToken:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
    UpdateAuthLinkDraftRequest:
      type: object
      description: Update a draft auth link. Omitted fields are unchanged.
      additionalProperties: false
      properties:
        regionalizationId:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          maxLength: 63
          description: The plugin regionalization the link targets.
        providerConfiguration:
          $ref: '#/components/schemas/AuthLinkProviderConfiguration'
        oauthClient:
          description: The customer OAuth client, either an existing secret or new client credentials.
          oneOf:
            - type: object
              title: ExistingOAuthClient
              additionalProperties: false
              required:
                - secretId
              properties:
                secretId:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  description: An existing OAuth client secret owned by the caller.
            - type: object
              title: NewOAuthClient
              additionalProperties: false
              required:
                - clientId
                - clientSecret
              properties:
                clientId:
                  type: string
                  minLength: 1
                  maxLength: 2048
                clientSecret:
                  type: string
                  minLength: 1
                  maxLength: 2048
                  writeOnly: true
    EstablishAuthLinkRequest:
      type: object
      required:
        - pluginId
      properties:
        authLinkId:
          type: string
          description: Identifier for the auth link
        pluginId:
          type: string
          description: The plugin to associate with this auth link
        applePushNotificationDeviceToken:
          type: string
          description: Device token for Apple Push Notification Service
        oauthTokens:
          type: object
          description: OAuth token credentials
          properties:
            type:
              type: string
              enum:
                - OAUTH2_TOKENS
              description: Native OAuth token secret discriminator.
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
            scopes:
              type: string
              description: Granted provider scopes, preserved with the OAuth credentials.
            customMetadata:
              type: object
              additionalProperties: true
              description: >-
                Opaque provider-owned credential metadata, such as the Tuya endpoint and account
                identifiers.
        usernamePassword:
          type: object
          description: Username and password credentials
          properties:
            username:
              type: string
            password:
              type: string
        apiKey:
          type: string
          description: API key for service authentication (e.g. OpenRouter)
        endpointUrl:
          type: string
          format: uri
          description: >-
            Optional custom endpoint URL stored with an API-key connection for an OpenAI-compatible
            provider.
    EstablishAuthLinkResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The ID of the created auth link
    PluginAuthMultifactorExchangeRequest:
      type: object
      required:
        - pluginId
        - principalId
        - pluginAuthenticationData
      properties:
        pluginId:
          type: string
          description: The ID of the plugin for which we are attempting to receive the multifactor code for.
        principalId:
          type: string
          description: >-
            The ID of the principal to setup the auth link for, or alternatively ~self, when the
            target is the current user principal.
        pluginAuthenticationData:
          type: object
          additionalProperties: true
          description: >-
            The data to exchange the multifactor code with. This is opaque data that is bespoke to
            the plugin and the plugin's authentication flow.
    PluginAuthCodeExchangeRequest:
      type: object
      required:
        - pluginId
        - principalId
        - pluginAuthenticationData
      properties:
        pluginId:
          type: string
          description: >-
            The ID of the plugin for which we are attempting to exchange the code for an access
            token for.
        authLinkId:
          type: string
          description: >-
            Optional existing auth link to renew. It must belong to the requester, reference this
            plugin, and permit auth-link-write; renewal preserves its endpoint and route identities.
        principalId:
          type: string
          description: >-
            The ID of the principal to exchange the code for an access token for, or alternatively
            ~self, when the target is the current user principal.
        pluginAuthenticationData:
          type: object
          additionalProperties: true
          description: >-
            The data to exchange the code with. This is opaque data that is bespoke to the plugin
            and the plugin's authentication flow.
    PortosIdentifier:
      type: string
      description: A Portos identifier is a unique identifier for a resource.
      example: port1/user/alice/endpoint/thermostat-zero
    authLinkId:
      allOf:
        - $ref: '#/components/schemas/PortosIdentifier'
        - type: string
          minLength: 1
          maxLength: 2048
      description: >-
        Existing auth link to authorize: a DRAFT is activated in place (same ID), a CONNECTED link
        is renewed. Omit only for plugins with a single authorization variant. It must belong to the
        authenticated principal, reference this plugin and permit auth-link-write. Activation and
        renewal preserve the link and its endpoint/route identities.
    PluginOAuthCompletionResponse:
      type: object
      additionalProperties: false
      required:
        - authLinkId
      properties:
        authLinkId:
          allOf:
            - $ref: '#/components/schemas/authLinkId'
          description: Canonical ID of the committed connection, including a newly created connection.
    PluginAuthCodeLinkRequest:
      type: object
      additionalProperties: false
      required:
        - pluginId
        - principalId
      properties:
        pluginId:
          type: string
          minLength: 1
          description: Canonical ID of a plugin declaring code-link authentication.
        principalId:
          type: string
          x-enum-exempt: principal identifier alias
          enum:
            - ~self
          description: Start linking for the authenticated Port OS principal.
    PluginAuthCodeLinkResponse:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - userCode
        - verificationUri
        - expiresIn
      properties:
        sessionId:
          type: string
          description: >-
            Opaque, principal-bound session ID used for plugin-auth-code-exchange. Not a vendor
            private code.
        userCode:
          type: string
          description: Public code the user enters on the vendor's verification page.
        verificationUri:
          type: string
          format: uri
          description: Vendor verification page where the user signs in and approves linking.
        expiresIn:
          type: integer
          minimum: 1
          description: Session lifetime in seconds. Expired sessions require starting again.
    PluginOAuthAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - pluginId
        - redirectUri
      properties:
        pluginId:
          allOf:
            - $ref: '#/components/schemas/PortosIdentifier'
            - type: string
              minLength: 1
              maxLength: 2048
          description: Exact canonical registered plugin instance ID; aliases are rejected.
        authLinkId:
          allOf:
            - $ref: '#/components/schemas/PortosIdentifier'
            - type: string
              minLength: 1
              maxLength: 2048
          description: >-
            Existing auth link to authorize: a DRAFT is activated in place (same ID), a CONNECTED
            link is renewed. Omit only for plugins with a single authorization variant. It must
            belong to the authenticated principal, reference this plugin and permit auth-link-write.
            Activation and renewal preserve the link and its endpoint/route identities.
        redirectUri:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: Exact HTTPS callback from the server-configured allowlist.
    PluginOAuthAuthorizationResponse:
      type: object
      additionalProperties: false
      required:
        - authorizationUrl
        - expiresAt
      properties:
        authorizationUrl:
          type: string
          format: uri
          description: >-
            Provider authorization URL containing private one-use state. Navigate to it without
            logging or publishing it. Receiving this URL does not connect the account; credentials
            are installed only by successful completion.
        expiresAt:
          type: string
          format: date-time
          description: Expiry of the original authorization attempt, unchanged by replay.
    pluginId:
      allOf:
        - $ref: '#/components/schemas/PortosIdentifier'
        - type: string
          minLength: 1
          maxLength: 2048
      description: Exact canonical registered plugin instance ID; aliases are rejected.
    redirectUri:
      type: string
      format: uri
      minLength: 1
      maxLength: 2048
      description: Exact HTTPS callback from the server-configured allowlist.
    PluginOAuthCompletionRequest:
      type: object
      additionalProperties: false
      required:
        - pluginId
        - redirectUri
        - code
        - state
      properties:
        pluginId:
          $ref: '#/components/schemas/pluginId'
        authLinkId:
          $ref: '#/components/schemas/authLinkId'
        redirectUri:
          $ref: '#/components/schemas/redirectUri'
        code:
          type: string
          minLength: 1
          maxLength: 4096
          description: Provider authorization code; never persisted or logged by Port OS.
        state:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          description: >-
            Exact one-use state returned by the provider. The server also checks canonical encoding,
            expiry and the authenticated principal, plugin, connection intent, redirect and current
            provider configuration.
    EndpointGroupsList:
      type: array
      items:
        $ref: '#/components/schemas/EndpointGroup'
    CreateEndpointGroupItem:
      type: object
      description: >
        The client-supplied fields of a new endpoint group. Members are added afterwards with
        `add-members` or created together through `/endpoint-groups-manage` `CREATE_GROUP`. A user
        group name is `{"type": "PLAIN", "value": ...}` whose value is non-blank UTF-8 text of at
        most 256 bytes with no control characters; anything else is rejected with BAD_REQUEST.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          description: The display name of the new endpoint group.
          allOf:
            - $ref: '#/components/schemas/TypeValue'
    CreateEndpointGroupRequest:
      type: object
      description: >-
        Request payload for creating a user endpoint group. The server assigns the ID, owner, etag
        and every derived field.
      additionalProperties: false
      required:
        - item
      properties:
        item:
          $ref: '#/components/schemas/CreateEndpointGroupItem'
    CreateEndpointGroupResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The created endpoint group ID
          examples:
            id:
              value: port1/systems/zero/endpoint-groups/123
    EndpointGroupsSetEnablementOperation:
      type: object
      description: >
        Enables or disables a group. A disabled group is hidden from group lists by default and
        cannot be targeted by messages such as clean-room. Rediscovery never re-enables it, so
        disabling (not deleting) is how a user hides a discovered group, such as a robot's room, for
        good.
      additionalProperties: false
      required:
        - requestId
        - operation
        - groupId
        - etag
        - enablement
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - SET_ENABLEMENT
          x-enum-varnames:
            - SetEnablement
          description: Operation discriminator.
        groupId:
          type: string
          minLength: 1
          description: The endpoint group to modify.
        etag:
          type: string
          minLength: 1
          description: >
            The group etag the client last read. When an earlier operation in the same request
            changes this group, send the etag that operation reports instead: every operation that
            changes the group advances its etag by one.
        enablement:
          $ref: '#/components/schemas/Enablement'
    GroupRoutesList:
      type: array
      items:
        $ref: '#/components/schemas/EndpointGroupRoute'
    AccessControlRuleEffect:
      type: string
      enum:
        - ALLOW
        - DENY
    AccessControlConditionKey:
      type: string
      description: The operation-context attribute a rule condition compares against.
      enum:
        - AUTH_VARIANT
        - REGIONALIZATION
        - TARGET_OPERATION
        - TARGET_IDENTITY_KIND
    AccessControlConditionComparator:
      type: string
      description: How a rule condition compares the context attribute with its value.
      enum:
        - EQUALS
    AccessControlRuleCondition:
      type: object
      description: >-
        A condition that must hold on the operation context for the rule to apply. A rule applies
        only when all of its conditions match.
      additionalProperties: false
      required:
        - key
        - comparator
        - value
      properties:
        key:
          $ref: '#/components/schemas/AccessControlConditionKey'
        comparator:
          $ref: '#/components/schemas/AccessControlConditionComparator'
        value:
          type: string
          minLength: 1
          maxLength: 200
          description: The value the context attribute is compared with.
          example: google-nest-customer-oauth
    AccessControlRule:
      type: object
      required:
        - operation
        - resource
        - identity
        - effect
        - owner
        - conditions
      properties:
        id:
          type: string
          description: The ID of the access control rule
          example: port1/account/john/access-control-rule/123
        effect:
          $ref: '#/components/schemas/AccessControlRuleEffect'
        operation:
          type: string
          description: >-
            The operation that the identity is granted to perform on a resource. A Universal
            resource identifier namespaced under port1/endpoint/read
          example: port1/endpoint/read
        resource:
          type: string
          description: The resource permissions are granted to
          example: port1/user/alice/endpoint/thermostat-zero
        identity:
          type: string
          description: The identity permissions are granted to
          example: port1/account/john/user/alice
        owner:
          type: string
          description: The owner of the access control rule
          example: port1/account/john
        conditions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/AccessControlRuleCondition'
          description: >-
            Conditions on the operation context that must all match for the rule to apply. Always
            returned, possibly empty.
    GetAccessControlRulesResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AccessControlRule'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    UpsertAccessControlRuleRequest:
      type: object
      required:
        - operation
        - resource
        - identity
        - effect
      properties:
        id:
          type: string
          description: |
            The ID of the access control rule to upsert on.
          example: port1/systems/zero/access-control-rules/123
        effect:
          $ref: '#/components/schemas/AccessControlRuleEffect'
        operation:
          type: string
          description: >
            The operation to grant access to.  This could be a read, write, delete, etc.  Please see
            the access controls list specification for all operations and their descriptions. 
          example: port1/systems/zero/operations/endpoint-read
        resource:
          type: string
          description: >
            The resource to grant access to.  This could be an endpoint, a flow, a secret, etc.  You
            can define this as either a class of resources, or a specific resource. 

            Examples: - port1/users/alice/endpoints/thermostat-zero grants access to that thermostat
            - port1/users/alice/flows/* grants access to all flows owned by alice
          example: port1/users/alice/endpoints/thermostat-zero
        identity:
          type: string
          description: >
            The identity to grant access to. This could be a user, a role, a group, etc. You can
            define this as either a class of identities, or a specific identity.

            Examples: - port1/account/john/users/alice grants access to alice -
            port1/account/john/users/* grants access to all users owned by john - * just grants
            access to all identities
          example: port1/account/john/users/alice
        conditions:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/AccessControlRuleCondition'
          description: >-
            Conditions on the operation context that must all match for the rule to apply. Omitting
            conditions means the rule has none.
    UpsertAccessControlRuleResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The ID of the access control rule
          example: port1/account/john/access-control-rule/123
    AccessControlRequesterContext:
      type: object
      required:
        - requesterId
      properties:
        requesterId:
          type: string
          description: The ID of the requester
    AccessControlResourceContext:
      type: object
      required:
        - resourceId
      properties:
        resourceId:
          type: string
          description: The ID of the resource
    AccessControlEntity:
      type: object
      required:
        - id
        - owner
        - type
      properties:
        id:
          type: string
          description: The ID of the entity
        type:
          description: The type of the entity
          allOf:
            - $ref: '#/components/schemas/AuthResourceType'
        owner:
          type: string
          description: The owner of the entity
        context:
          type: object
          additionalProperties: true
          description: Additional context for the entity
    AccessControlOperationContext:
      type: object
      description: Attributes of the requested operation that rule conditions are evaluated against.
      additionalProperties: false
      properties:
        authVariant:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          maxLength: 63
          description: The plugin authorization variant ID being established.
        regionalization:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          maxLength: 63
          description: The plugin regionalization ID being established.
        targetOperation:
          type: string
          maxLength: 200
          pattern: ^port1/systems/zero/operations/([a-z0-9][a-z0-9-]{0,127}|\*)$
          description: The operation a rule being created or changed grants.
        targetIdentityKind:
          type: string
          description: >-
            Whether the identity of a rule being created or changed is an exact identity or a
            wildcard.
          enum:
            - EXACT
            - WILDCARD
    EvaluateAccessControlRuleRequest:
      type: object
      description: Evaluate whether or not a request is allowed to be performed.
      required:
        - requests
      properties:
        requesterContext:
          $ref: '#/components/schemas/AccessControlRequesterContext'
        resourceContext:
          $ref: '#/components/schemas/AccessControlResourceContext'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/AccessControlEntity'
        operation:
          type: string
        operationContext:
          $ref: '#/components/schemas/AccessControlOperationContext'
    EvaluateAccessControlRuleResult:
      type: string
      enum:
        - ALLOW
        - DENY
    EvaluateAccessControlRuleResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/EvaluateAccessControlRuleResult'
        error:
          $ref: '#/components/schemas/Error'
    BaseSecret:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: The unique identifier for the secret
        type:
          type: string
          description: The secret type
        ownerId:
          type: string
          description: The owner ID of the secret
        owner:
          $ref: '#/components/schemas/Principal'
        etag:
          type: string
          readOnly: true
          description: The quoted strong entity tag of the secret, derived from its stored version
    OauthTokenSecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - accessToken
            - refreshToken
            - expiresIn
            - scopes
          properties:
            accessToken:
              type: string
              description: The OAuth access token
            refreshToken:
              type: string
              description: The OAuth refresh token
            pluginCustomMetadata:
              type: object
              additionalProperties: true
              description: >-
                A set of custom metadata that the plugin uses and attaches to the token, this is
                meant specifically for the plugin to use.
            expiresIn:
              type: integer
              description: The token expiration time in seconds
            scopes:
              type: string
              description: The OAuth scopes
    OauthClientCredentialSecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - clientId
            - clientSecret
          properties:
            clientId:
              type: string
              description: The OAuth client ID
            clientSecret:
              type: string
              description: The OAuth client secret
    ApplePushNotificationAuthTokenSecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - keyId
          properties:
            keyId:
              type: string
              description: The Apple Push Notification key ID
            authKey:
              type: string
              format: binary
              description: The Apple Push Notification private key (P8 file)
    PersonalAccessTokenSecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - accessToken
          properties:
            accessToken:
              type: string
              description: The access token
    CustomPluginSecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - secretPluginId
          properties:
            secretPluginId:
              type: string
              description: >-
                The ID of the plugin that the secret is associated with, all custom secrets must be
                associated with a plugin.
          additionalProperties: true
    ApiKeySecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - apiKey
          properties:
            apiKey:
              type: string
              description: >-
                The API key value (e.g. for OpenRouter, Anthropic, OpenAI, or other API-key-based
                services)
    Secret:
      oneOf:
        - $ref: '#/components/schemas/OauthTokenSecret'
        - $ref: '#/components/schemas/OauthClientCredentialSecret'
        - $ref: '#/components/schemas/ApplePushNotificationAuthTokenSecret'
        - $ref: '#/components/schemas/PersonalAccessTokenSecret'
        - $ref: '#/components/schemas/CustomPluginSecret'
        - $ref: '#/components/schemas/ApiKeySecret'
      discriminator:
        propertyName: type
        mapping:
          OAUTH2_TOKENS: '#/components/schemas/OauthTokenSecret'
          OAUTH2_CLIENT_CREDENTIALS: '#/components/schemas/OauthClientCredentialSecret'
          APPLE_PUSH_NOTIFICATION_CREDENTIALS: '#/components/schemas/ApplePushNotificationAuthTokenSecret'
          PERSONAL_ACCESS_TOKEN: '#/components/schemas/PersonalAccessTokenSecret'
          CUSTOM_PLUGIN_SECRET: '#/components/schemas/CustomPluginSecret'
          API_KEY: '#/components/schemas/ApiKeySecret'
    SecretsList:
      type: array
      items:
        $ref: '#/components/schemas/Secret'
    EnumerateSecretsResponse:
      type: object
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/SecretsList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    UpsertSecretRequest:
      type: object
      required:
        - secret
      properties:
        secret:
          $ref: '#/components/schemas/Secret'
    UpsertSecretResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The created secret ID
    PrincipalsList:
      type: array
      items:
        $ref: '#/components/schemas/Principal'
    EnumeratePrincipalsResponse:
      type: object
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/PrincipalsList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    UpsertPrincipalRequest:
      type: object
      required:
        - items
      properties:
        item:
          $ref: '#/components/schemas/Principal'
    UpsertPrincipalResponse:
      type: object
      required:
        - id
      properties:
        result:
          $ref: '#/components/schemas/Principal'
    GenerateTokenRequest:
      type: object
      required:
        - grant_type
        - client_id
      properties:
        grant_type:
          type: string
          description: >
            The OAuth grant type. Use authorization_code for code exchange, or
            urn:ietf:params:oauth:grant-type:refresh_token to exchange a vended JWT (from POST
            /tokens) for an access token.
        client_id:
          type: string
          description: >-
            The client ID (e.g. port1/systems/zero/oauth-clients/custom-access-token for token
            vending).
        client_secret:
          type: string
          description: Required for confidential clients. Public DCR/CIMD clients omit this field and use PKCE.
        subject_token:
          type: string
          description: >-
            Identity token to exchange; required for
            urn:ietf:params:oauth:grant-type:token-exchange.
        subject_token_type:
          type: string
          description: >-
            Subject token type; use urn:ietf:params:oauth:token-type:id_token for identity token
            exchange.
        requested_token_type:
          type: string
          description: Requested token type for identity token exchange.
        audience:
          type: string
          description: Target audience for identity token exchange.
        device_code:
          type: string
          description: Device code; required for urn:ietf:params:oauth:grant-type:device_code.
        code:
          type: string
          description: Authorization code; required when grant_type is authorization_code.
        refresh_token:
          type: string
          description: >-
            The vended JWT from POST /tokens; required when grant_type is
            urn:ietf:params:oauth:grant-type:refresh_token.
        redirect_uri:
          type: string
          description: Redirect URI; required when grant_type is authorization_code.
        code_verifier:
          type: string
          description: Original PKCE verifier; required for public-client code exchange.
        resource:
          type: string
          format: uri
          description: >-
            Exact resource from authorization; canonical issuer for REST or issuer/mcp for MCP.
            Required for DCR and CIMD.
        scope:
          type: string
          description: Optional narrower subset during refresh; cannot add scopes.
    GenerateTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The access token
        token_type:
          type: string
          description: The token type
        expires_in:
          type: integer
          description: The token expiration time in seconds
        refresh_token:
          type: string
          description: Rotating refresh credential for resource-bound grants; store privately.
        scope:
          type: string
          description: Granted space-separated scopes.
    TokenPurpose:
      type: string
      enum:
        - API
        - WEBSITE_LOGIN
      default: API
      description: >-
        API keys authenticate automation. WEBSITE_LOGIN keys grant full account website sign-in and
        explicit OAuth consent, cannot have restricted scopes, and must be created through an
        existing account sign-in. Keys expire and can be revoked; OAuth connections approved with a
        website key are revoked separately.
    TokenListItem:
      type: object
      description: A token in a list response (no raw JWT).
      properties:
        purpose:
          $ref: '#/components/schemas/TokenPurpose'
        id:
          type: string
          description: Token identifier (same as JWT jti).
        subject:
          type: string
          description: Principal path that is the subject of the token.
        created_at:
          type: string
          format: date-time
          description: When the token was created (ISO 8601).
        expires_at:
          type: string
          format: date-time
          description: When the token expires (ISO 8601).
        client_id:
          type: string
          description: OAuth client ID for the token (e.g. custom-access-token client).
        scope:
          type: string
          description: Space-separated scopes, if any.
        label:
          type: string
          description: Human-readable label, if set.
    TokenList:
      type: array
      items:
        $ref: '#/components/schemas/TokenListItem'
    EnumerateTokensResponse:
      type: object
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/TokenList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    CreateTokenRequest:
      type: object
      description: Create an expiring, revocable access key for API use or website sign-in.
      additionalProperties: false
      properties:
        purpose:
          $ref: '#/components/schemas/TokenPurpose'
        subject:
          type: string
          description: >
            Identity for the token. Use ~self for the current user (resolved to the authenticated
            principal at create time), or that same principal's full path. Other principals are
            rejected.
        expires_in:
          type: integer
          description: >-
            Lifetime in seconds, default 3600. Website sign-in keys require a positive lifetime of
            at most 604800 (seven days).
        scope:
          type: string
          description: >
            Space-separated scopes. Optional; default no scopes. See scopes documentation for
            allowed values and semantics.
        label:
          type: string
          description: Optional human-readable label for the token (e.g. "CLI token").
    CreateTokenResponse:
      type: object
      required:
        - id
        - token
        - expires_at
      description: >
        Response when a token is created. The raw JWT (token) is returned only once; store it
        securely. Use id for list/delete and in the DELETE URL.
      properties:
        id:
          type: string
          description: Token identifier (same as JWT jti). Use for list/delete and in the DELETE URL.
        token:
          type: string
          description: The raw JWT. Returned only once at creation; cannot be retrieved again.
        expires_at:
          type: string
          format: date-time
          description: When the token expires (ISO 8601).
    InvalidateTokenResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Confirmation message (e.g. "Token invalidated successfully").
    OAuthErrorResponse:
      type: object
      required:
        - error
        - error_description
      description: >
        Standard OAuth 2.0 error response format. Used for error responses in OAuth-related
        endpoints.
      properties:
        error:
          type: string
          description: OAuth error code
          x-enum-exempt: OAuth 2.0 error codes (RFC 6749)
          enum:
            - invalid_request
            - invalid_client
            - invalid_scope
            - invalid_grant
            - server_error
          example: invalid_request
        error_description:
          type: string
          description: Human-readable description of the error
          example: user_code is required
    DeviceAuthorizationRequest:
      type: object
      required:
        - client_id
      properties:
        client_id:
          type: string
          description: The OAuth client identifier
        scope:
          type: string
          description: Space-separated list of scopes requested by the client
          example: read write
    DeviceAuthorizationResponse:
      type: object
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_in
        - interval
      properties:
        device_code:
          type: string
          description: The device verification code used to poll the token endpoint
        user_code:
          type: string
          description: The user verification code displayed to the user
        verification_uri:
          type: string
          description: The URI where the user should enter the user code
          example: https://portoperatingsystem.com/oauth/device/verify
        verification_uri_complete:
          type: string
          description: The complete URI including the user code (optional, for convenience)
          example: https://portoperatingsystem.com/oauth/device/verify?user_code=ABC123
        expires_in:
          type: integer
          description: The lifetime in seconds of the device_code and user_code
          example: 1800
        interval:
          type: integer
          description: >-
            The minimum amount of time in seconds that the client should wait between polling
            requests
          example: 5
    OAuthScope:
      type: string
      x-enum-exempt: OAuth scope tokens carried in issued access tokens
      enum:
        - endpoint:read
        - endpoint:write
        - message:read
        - message:send
        - secret:read
        - secret:write
        - flow:read
        - flow:write
        - flow:trigger
        - principal:read
        - principal:write
        - subscription:read
        - subscription:write
        - access-control-rule:read
        - access-control-rule:write
        - group:read
        - group:manage
      description: >
        OAuth 2.0 scope values that can be requested by clients. Delegated REST scopes bound
        operations before the owning service evaluates resource policy. A scope is an upper bound,
        not a resource permission or an automatic Cedar grant. Each scope follows the pattern
        "resource:action" where resource indicates the resource type and action indicates the
        permitted operation (read, write, send, trigger).
    DynamicClientMetadata:
      type: object
      required:
        - redirect_uris
        - token_endpoint_auth_method
      properties:
        client_name:
          type: string
          maxLength: 200
          description: Unverified display name.
        redirect_uris:
          type: array
          description: >-
            Exact callbacks must form either an entirely localhost/loopback set or an entirely
            remote HTTPS set. HTTP is allowed only for localhost or literal loopback IPs. Local and
            remote callbacks cannot be mixed; user information and fragments are forbidden.
          minItems: 1
          maxItems: 8
          items:
            type: string
            format: uri
            maxLength: 2048
        token_endpoint_auth_method:
          type: string
          enum:
            - none
          x-enum-exempt: RFC 7591 defines case-sensitive OAuth token endpoint authentication method identifiers.
        grant_types:
          type: array
          maxItems: 2
          items:
            type: string
            enum:
              - authorization_code
              - refresh_token
            x-enum-exempt: RFC 6749 and RFC 7591 define case-sensitive OAuth grant type identifiers.
        response_types:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum:
              - code
            x-enum-exempt: RFC 6749 and RFC 7591 define case-sensitive OAuth response type identifiers.
        scope:
          type: string
          description: >-
            Space-separated OAuthScope values accepted by the deployment DCR allowed_scopes policy.
            Omission selects the first configured scope; defaults to endpoint:read.
        client_uri:
          type: string
          maxLength: 2048
          description: Unverified descriptive URL; never fetched as evidence.
        software_id:
          type: string
          maxLength: 200
          description: Unverified software claim.
        software_version:
          type: string
          maxLength: 100
        software_statement:
          type: string
          description: Unsupported; rejected if supplied.
    OAuthProtocolError:
      type: object
      required:
        - error
        - error_description
      properties:
        error:
          type: string
          description: Stable OAuth protocol error identifier.
        error_description:
          type: string
          description: Human-readable recovery guidance.
    MessageAuthorizationContext:
      type: object
      required:
        - senderApplicationId
      properties:
        senderApplicationId:
          type: string
          description: The ID of the application that sent the message
    MessageContext:
      type: object
      properties:
        authorization:
          description: Authorization context for the message
          allOf:
            - $ref: '#/components/schemas/MessageAuthorizationContext'
        inputPlugin:
          $ref: '#/components/schemas/PluginType'
    MessageType:
      type: string
      description: Type of the message
    MessageHeader:
      type: object
      required:
        - namespace
        - name
        - version
      properties:
        namespace:
          type: string
          description: The namespace of the message
        name:
          type: string
          description: The name of the message
        version:
          type: string
          description: The version of the message
        id:
          type: string
          description: Unique identifier for the message
        correlationToken:
          type: string
          description: Token used for correlating related messages
    MessageTargetType:
      type: string
      enum:
        - ENDPOINT
        - PLUGIN
        - GROUP
        - FLOW
        - CONTROL_ROUTE
        - MCP_EVENT_BINDING
    MessageTargetGroupRouteReference:
      type: object
      description: >-
        A group route Port OS resolved for this dispatch. The plugin addresses it by its own
        pluginRouteId and cookie (the group route's pluginCustomMetadata).
      required:
        - id
        - groupId
        - pluginRouteId
      properties:
        id:
          type: string
          description: Typed group-route ID (…/endpoint-group-routes/…).
        groupId:
          type: string
          description: Canonical endpoint group the group route belongs to, after merge redirects.
        pluginRouteId:
          type: string
          description: The plugin's own identifier for the group route, as reported in discovery.
        cookie:
          type: object
          description: The group route's pluginCustomMetadata, as reported in discovery.
          additionalProperties: true
    MessageTargetGroupRoute:
      description: >-
        A group route selected for this dispatch, for example a room the robot can clean, with its
        IS_PART_OF parent (for example the room's map) when it has one.
      allOf:
        - $ref: '#/components/schemas/MessageTargetGroupRouteReference'
        - type: object
          properties:
            parent:
              $ref: '#/components/schemas/MessageTargetGroupRouteReference'
    MessageTarget:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MessageTargetType'
        id:
          type: string
        cookie:
          description: Abstract blob of contextual information necessary to dispatch a message to an endpoint.
          type: object
          additionalProperties: true
        groupRoutes:
          description: >-
            Group routes Port OS selected for this dispatch, in the order the message requested them
            (for example the rooms of a clean-room message). Only Port OS sets this field; a value
            supplied by an API client is discarded.
          type: array
          items:
            $ref: '#/components/schemas/MessageTargetGroupRoute'
    MessageEndpoint:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The ID of an endpoint associated with the message
        customMetadata:
          type: object
          description: Route custom metadata available to plugins during message dispatch.
          additionalProperties: true
    Message:
      description: A message is an object that can be received and sent to endpoints.
      type: object
      required:
        - body
      properties:
        context:
          description: Message context including authorization and input plugin
          allOf:
            - $ref: '#/components/schemas/MessageContext'
        correlationToken:
          type: string
          description: Token used for correlating related messages
        type:
          $ref: '#/components/schemas/MessageType'
        header:
          description: Message header with namespace, name, and version
          allOf:
            - $ref: '#/components/schemas/MessageHeader'
        target:
          description: The target of the message
          allOf:
            - $ref: '#/components/schemas/MessageTarget'
        endpoint:
          $ref: '#/components/schemas/MessageEndpoint'
        auth-token:
          type: string
          description: >-
            Port OS bearer token available to plugins during dispatch when they need to call Port OS
            APIs.
        secrets:
          description: >-
            The secrets associated with the authorization link between the port OS principal and the
            plugin.
          type: array
          items:
            $ref: '#/components/schemas/Secret'
        ownerId:
          type: string
          description: The ID of the owner of the message
        body:
          type: object
          description: The message body, which can be any valid JSON object
          additionalProperties: true
    CreateMessageTargetType:
      type: string
      enum:
        - ENDPOINT
        - SYSTEM
        - PLUGIN
        - GROUP
      description: >-
        The type of target. `GROUP` addresses an endpoint group and carries only group-route-native
        capabilities (for example media playback on a speaker group); spatial cleaning is always
        sent to the robot endpoint.
      x-enum-varnames:
        - EndpointTarget
        - SystemTarget
        - PluginTarget
        - GroupTarget
    CreateMessageTarget:
      type: object
      required:
        - type
        - id
      properties:
        type:
          $ref: '#/components/schemas/CreateMessageTargetType'
        id:
          type: string
          description: The ID of the target
        routeId:
          type: string
          description: >-
            Optional full route or group-route ID belonging to this target. Selects one advertised
            provider route and preserves that provider for follow-up transport or volume commands.
    CreateMessageRequestResponseType:
      type: string
      enum:
        - SYNC
        - FIRE_FORGET
        - AUTO
      description: >
        How to handle the request. AUTO resolves the actual selected route's current plugin
        declaration: synchronous operations wait for a correlated response; asynchronous and
        fire-and-forget operations return dispatch acceptance without claiming device execution.
        Legacy integrations retain synchronous behavior in AUTO mode. Omission retains the existing
        FIRE_FORGET default.
      x-enum-varnames:
        - SyncResponseType
        - FireForgetResponseType
        - AutoResponseType
    CreateMessageRequest:
      type: object
      required:
        - target
        - message
      properties:
        target:
          description: The target of the message
          allOf:
            - $ref: '#/components/schemas/CreateMessageTarget'
        message:
          description: The message to send
          allOf:
            - $ref: '#/components/schemas/Message'
        responseType:
          $ref: '#/components/schemas/CreateMessageRequestResponseType'
    CreateMessageResponse:
      type: object
      required:
        - messageId
      properties:
        messageId:
          type: string
          description: >-
            Identifies the unary response message when one is returned. An accepted asynchronous
            request can return an empty string with no message. This field does not provide a
            durable dispatch receipt, retry deduplication or proof of observed device state.
        message:
          description: >-
            The message that was responded with if there was a unary message response. If the
            response is SYNC, this may be non empty. Sometimes, the response may be empty, if the
            downstream didn't send any message back and just ACKED the message. 
          allOf:
            - $ref: '#/components/schemas/Message'
    EnumerateSubscriptionsResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    UpsertSubscriptionRequest:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/Subscription'
    UpsertSubscriptionResult:
      type: object
      properties:
        id:
          type: string
          description: The ID of the subscription
          example: port1/systems/zero/subscriptions/123
    UpsertSubscriptionResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/UpsertSubscriptionResult'
x-portos-plugin-contracts:
  - PluginTokenResult
  - PluginTokenRefreshRequest
  - PluginTokenRefreshResponse
  - PluginInvocationContext
  - CameraInterfaceEventImageResponseMessage
