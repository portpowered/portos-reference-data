        Changes the label only. Preserves the ID, original host arguments, query, target, generation
        and activation sequence. Refresh and unsubscribe continue to resolve the original host
        identity.
      x-portos-delegated: true
      x-portos-resource-permission: true
  /webhooks/smartthings:
    post:
      tags:
        - Webhooks
      description: >-
        This is the API endpoint for receiving events from smart things


        Requires a signed user/session or the existing authenticated client flow. The anonymous DCR
        delegated device profile cannot invoke this operation.
      operationId: handleSmartThingsWebhook
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request payload
        '500':
          description: Internal server error
      x-portos-delegated: false
      x-portos-resource-permission: true
      security:
        - oauth2: []
        - bearerAuth: []
      summary: Handle Smart Things Webhook
  /webhooks/google-cloud-scheduler:
    post:
      tags:
        - Webhooks
      summary: Handle Google Cloud Scheduler webhook
      description: >-
        Receives scheduled job invocations from Google Cloud Scheduler.

        Triggers a flow run for the specified flow and node. Authentication

        is enforced by the webhook auth middleware (service account validation).


        This endpoint always returns 200 OK to prevent Google Cloud Scheduler

        from retrying deliveries.



        Requires a signed user/session or the existing authenticated client flow. The anonymous DCR
        delegated device profile cannot invoke this operation.
      operationId: handleGoogleCloudSchedulerWebhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - flow_id
                - node_id
              properties:
                flow_id:
                  type: string
                  description: The Port OS identifier of the flow to trigger
                node_id:
                  type: string
                  description: The Port OS identifier of the flow node to execute
            example:
              flow_id: port1/principals/example
              node_id: port1/principals/example
      responses:
        '200':
          description: Webhook received and flow run triggered (always returned to prevent retries)
        '400':
          description: Invalid request payload or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid request payload
                code: BAD_REQUEST
                family: BAD_REQUEST
        '401':
          description: Unauthorized — invalid or missing service account credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Authentication required
                code: UNAUTHORIZED
                family: UNAUTHORIZED
      x-portos-delegated: false
      x-portos-resource-permission: true
  /tuya/qrcode:
    post:
      tags:
        - Tuya
      summary: Generate Tuya QR Code
      operationId: generateTuyaQrCode
      description: >
        Generates a QR code for Tuya smart home device authentication. The QR code can be scanned by
        the Tuya Smart app to link a Tuya account. Requires a valid Tuya client ID and access code
        obtained from the Tuya IoT platform.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accessCode
                - clientId
              properties:
                accessCode:
                  type: string
                  description: Access code obtained from the Tuya IoT platform
                schema:
                  type: string
                  description: Optional Tuya app schema identifier
                clientId:
                  type: string
                  description: Tuya IoT platform client ID
                authenticationUrl:
                  type: string
                  description: >
                    Optional override for the Tuya authentication API endpoint. Defaults to
                    https://apigw.iotbing.com if not provided.
            example:
              accessCode: port1/principals/example
              clientId: port1/principals/example
      responses:
        '200':
          description: QR code generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Raw QR code token
                  qrFormattedCode:
                    type: string
                    description: >
                      Formatted QR code string suitable for rendering as a QR image (e.g.,
                      tuyaSmart--qrLogin?token={code})
              example:
                key: value
        '400':
          description: Bad request — missing required fields or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid request payload
                code: BAD_REQUEST
                family: BAD_REQUEST
        '500':
          description: Internal server error — Tuya API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Internal server error
                code: INTERNAL
                family: INTERNAL_SERVER_ERROR
      x-portos-delegated: false
      x-portos-resource-permission: false
  /tuya/validatetoken:
    post:
      tags:
        - Tuya
      summary: Validate Tuya Login Code
      operationId: validateTuyaLoginCode
      description: >
        Validates a Tuya login code obtained from QR code scanning and returns authentication
        tokens. After a user scans the QR code generated by the /tuya/qrcode endpoint, this endpoint
        verifies the login and retrieves the Tuya access and refresh tokens for the authenticated
        user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginCode
                - userCode
                - clientId
              properties:
                loginCode:
                  type: string
                  description: Login code obtained from QR code scanning
                userCode:
                  type: string
                  description: User code associated with the QR code session
                clientId:
                  type: string
                  description: Tuya IoT platform client ID
                authenticationUrl:
                  type: string
                  description: >
                    Optional override for the Tuya authentication API endpoint. Defaults to
                    https://apigw.iotbing.com if not provided.
            example:
              loginCode: port1/principals/example
              userCode: port1/principals/example
              clientId: port1/principals/example
      responses:
        '200':
          description: Login code validated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the validation was successful
                  accessToken:
                    type: string
                    description: Tuya access token for API calls
                  refreshToken:
                    type: string
                    description: Tuya refresh token for renewing the access token
                  expireTime:
                    type: integer
                    description: Token expiry time in seconds
                  terminalID:
                    type: string
                    description: Terminal identifier for the authenticated session
                  uid:
                    type: string
                    description: Tuya user identifier
                  username:
                    type: string
                    description: Tuya username
                  endpoint:
                    type: string
                    description: Tuya API endpoint for subsequent calls
              example:
                key: value
        '400':
          description: Bad request — missing required fields or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid request payload
                code: BAD_REQUEST
                family: BAD_REQUEST
        '500':
          description: Internal server error — Tuya API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Internal server error
                code: INTERNAL
                family: INTERNAL_SERVER_ERROR
      x-portos-delegated: false
      x-portos-resource-permission: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      type: oauth2
      description: OAuth2 authentication using the OAuth2 flow.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.portoperatingsystem.com/oauth/authorize
          tokenUrl: https://auth.portoperatingsystem.com/auth/token
          scopes:
            endpoint:read: View authorized devices, connected services and their state.
            endpoint:write: Manage authorized devices, connected services and provider connections.
            message:read: Read authorized messages.
            message:send: Dispatch capability messages to authorized targets.
            group:read: View authorized rooms, device groups and their members.
            group:manage: Manage authorized groups and membership.
            subscription:read: Read authorized subscriptions.
            subscription:write: Manage authorized subscriptions.
            secret:read: Read secrets; unavailable to anonymous DCR clients.
            secret:write: Manage secrets; unavailable to anonymous DCR clients.
            flow:read: Read flows; unavailable to anonymous DCR clients.
            flow:write: Manage flows; unavailable to anonymous DCR clients.
            flow:trigger: Trigger flows; unavailable to anonymous DCR clients.
            principal:read: Read principals; unavailable to anonymous DCR clients.
            principal:write: Manage principals; unavailable to anonymous DCR clients.
            access-control-rule:read: Read resource rules; unavailable to anonymous DCR clients.
            access-control-rule:write: Manage resource rules; unavailable to anonymous DCR clients.
        clientCredentials:
          tokenUrl: https://auth.portoperatingsystem.com/auth/token
          scopes: {}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-chosen key that makes a non-idempotent request retry-safe, following
        draft-ietf-httpapi-idempotency-key-header. A committed response is stored for 24 hours and
        replayed for the same principal, operation, key and payload. Missing key returns 400
        IDEMPOTENCY_KEY_REQUIRED, a key longer than 255 characters returns 400
        IDEMPOTENCY_KEY_INVALID, the same key with a different payload returns 422, and the same key
        while the first request is still in flight returns 409. Failed (rolled-back) requests do not
        consume the key.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 6f1c3b0e-5a52-4b1f-9a0e-2f7c6d8e9a10
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >
        The quoted strong entity tag of the resource the client last read (its `etag` field or
        `ETag` response header). The mutation is applied only when it still matches: a stale value
        returns 412 PRECONDITION_FAILED and a missing header returns 428 PRECONDITION_REQUIRED. `*`
        matches any current version of an existing group (RFC 9110), for a deliberate
        last-writer-wins change.
      schema:
        type: string
        minLength: 1
      example: '"12"'
    EnablementQuery:
      name: enablement
      in: query
      required: false
      description: |
        Filter the results by enablement.

        Enablement is a customer setting that stops Port OS from using a resource
        without deleting it. Port OS uses it in place of deletion because it cannot
        delete a device on the provider's side.

        Defaults to ENABLED. Use DISABLED to list only disabled resources, or '*' to
        include both enabled and disabled resources.

        Looking up a resource by its exact id ignores this filter.
      schema:
        $ref: '#/components/schemas/EnablementFilter'
    OwnerQuery:
      name: owner
      in: query
      required: false
      description: |
        Filter the results by the owner of the resource.

        Defaults to the authenticated caller's resources when omitted. Use '~caller'
        to make that scope explicit.

        Another owner can be selected only for resources the caller can read.
      schema:
        type: string
      examples:
        caller:
          value: ~caller
        principal:
          value: port1/principals/example
    ExpandQuery:
      name: expand
      in: query
      required: false
      description: |
        Expansion tokens that request related or computed fields for each result.

        When omitted, the response contains only the default, shallower set of
        fields for each result.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
    NextTokenQuery:
      name: nextToken
      in: query
      required: false
      description: |
        Opaque token for the next page of results.

        Pass the continuation token returned by the previous response, unchanged.
        Omit it to start from the first page.
      schema:
        type: string
    MaxResultsQuery:
      name: maxResults
      in: query
      required: false
      description: |
        Maximum number of results to return in one page.

        Defaults to 10. Values from 1 through 100 are accepted.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  headers:
    ETag:
      description: >
        Opaque strong entity tag of the returned resource version. Send it back in `If-Match` on the
        next mutation of the same resource.
      schema:
        type: string
        example: '"12"'
  schemas:
    IntegrationRequest:
      type: object
      description: >-
        Email and explicit consent for updates about a future integration. Custom requests also
        require the manufacturer or device name.
      additionalProperties: false
      required:
        - email
        - pluginId
        - consent
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        pluginId:
          type: string
          description: >-
            Stable provider ID from the device catalog or supported AI client ID. The server accepts
            only registered waitlist identities.
        manufacturer:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Manufacturer or device to add. Required only for the Custom provider
            (port1/systems/zero/plugins/50161180-0a4a-483d-8e31-24ff480615cf); omit for all other
            providers.
        consent:
          type: boolean
          enum:
            - true
    PluginTokenResult:
      type: object
      description: Provider credentials returned by a plugin auth handler to its host.
      additionalProperties: false
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        customMetadata:
          type: object
          additionalProperties: true
          x-go-type-skip-optional-pointer: true
          description: Opaque plugin-owned metadata persisted alongside the credentials.
        refresh_token:
          type: string
          x-go-type-skip-optional-pointer: true
    PluginTokenRefreshRequest:
      type: object
      description: Credentials supplied to a plugin for a token refresh.
      additionalProperties: false
      required:
        - authLinkId
        - refreshToken
        - accessToken
        - scopes
      properties:
        authLinkId:
          type: string
        refreshToken:
          type: string
        accessToken:
          type: string
        customMetadata:
          type: object
          additionalProperties: true
          x-go-type-skip-optional-pointer: true
        scopes:
          type: string
    PluginTokenRefreshResponse:
      type: object
      description: Credentials returned by a plugin refresh operation.
      additionalProperties: false
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - scopes
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: Seconds until the access token expires.
        scopes:
          type: string
        customMetadata:
          type: object
          additionalProperties: true
          x-go-type-skip-optional-pointer: true
    PluginInvocationContext:
      type: object
      description: >-
        Host-verified identity for one plugin invocation. Plugins obtain this from an injected host
        resolver, not from untrusted request fields.
      additionalProperties: false
      required:
        - principalId
      properties:
        principalId:
          type: string
          description: Port OS principal for the authenticated invocation.
        authLinkId:
          type: string
          x-go-type-skip-optional-pointer: true
          description: Auth link selected for the invocation, when one exists.
    SyntheticEventEndpoint:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 2048
      description: Endpoint identity resolved to the authorized active simulator source binding.
    SyntheticEventHeader:
      type: object
      additionalProperties: false
      description: >-
        Capability occurrence or ambient attribute header. No caller-supplied occurrence identity or
        timestamp.
      required:
        - namespace
        - name
        - version
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 2048
        name:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 128
    SyntheticEventRequest:
      type: object
      additionalProperties: false
      description: >-
        Authenticated synthetic admission on enabled simulator endpoints only. Server derives
        tenant, active source binding, event ID and occurrence time. Maximum encoded request size is
        64 KiB, enforced by the service; per-source rate limit is 10 requests per second with tenant
        quotas.
      required:
        - requestId
        - endpoint
        - header
        - body
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            Idempotency key scoped to authenticated tenant and resolved simulator binding. Reuse
            with different semantic input fails 409.
        endpoint:
          $ref: '#/components/schemas/SyntheticEventEndpoint'
        header:
          $ref: '#/components/schemas/SyntheticEventHeader'
        body:
          type: object
          additionalProperties: true
          description: >-
            Validated against the selected canonical capability schema and enabled simulator
            profile. Unsupported fields are rejected.
    SyntheticEventAccepted:
      type: object
      additionalProperties: false
      description: >-
        202 is returned only after durable admission. Semantic duplicates return the same IDs.
        Acceptance does not prove delivery or ChatGPT task execution.
      required:
        - receiptId
        - eventId
        - endpointId
        - status
      properties:
        receiptId:
          type: string
        eventId:
          type: string
        endpointId:
          type: string
        status:
          type: string
          enum:
            - ACCEPTED
          x-enum-varnames:
            - SyntheticAdmissionAccepted
    EventDeliverySummary:
      type: object
      additionalProperties: false
      description: >-
        Authorized subscription delivery metadata. Acknowledged means host HTTP acceptance only.
        Callback URL, credentials and event body are never exposed.
      required:
        - subscriptionId
        - eventId
        - status
        - attemptCount
      properties:
        subscriptionId:
          type: string
        eventId:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - SENDING
            - ACKNOWLEDGED
            - DEAD
            - DROPPED
            - CANCELLED
          x-enum-varnames:
            - EventDeliveryStatusPending
            - EventDeliveryStatusSending
            - EventDeliveryStatusAcknowledged
            - EventDeliveryStatusDead
            - EventDeliveryStatusDropped
            - EventDeliveryStatusCancelled
        reasonCode:
          type: string
        attemptCount:
          type: integer
          minimum: 0
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
    EventReceiptDeliveryCounts:
      type: object
      additionalProperties: false
      description: >-
        Compact delivery totals for this receipt, limited to subscriptions the reader can currently
        inspect. May remain available when per-job details exceed the response bound or are pruned
        only if retained authorization evidence proves the included monitor set. Never copy
        unfiltered tenant-wide dedup counters. Omit deliveryCounts when ownership or current
        authorization cannot be resolved; omission does not mean zero. Acknowledged counts host HTTP
        acceptance and never proves a ChatGPT response or task execution.
      required:
        - matched
        - acknowledged
        - pending
        - failed
      properties:
        matched:
          type: integer
          minimum: 0
          description: Matching delivery jobs in the authorized monitor set.
        acknowledged:
          type: integer
          minimum: 0
          description: Jobs accepted through host HTTP acknowledgement; not proof of task execution.
        pending:
          type: integer
          minimum: 0
          description: Nonterminal jobs, including pending and sending.
        failed:
          type: integer
          minimum: 0
          description: Terminal unacknowledged jobs, including dead, dropped and cancelled.
    EventReceipt:
      type: object
      additionalProperties: false
      description: >-
        Retained source receipt and delivery summaries limited to subscriptions the reader may
        inspect. Missing retained detail is explicitly unavailable, not an inferred zero count. No
        receipt proves execution of a ChatGPT task.
      required:
        - id
        - receiptId
        - eventId
        - endpointId
        - status
        - acceptedAt
        - observedAt
        - eventIds
        - deliveryDetail
        - deliveries
      properties:
        id:
          type: string
          description: Canonical resource identity, equal to receiptId.
        receiptId:
          type: string
        eventId:
          type: string
        endpointId:
          type: string
        status:
          type: string
          enum:
            - ACCEPTED
            - PROCESSING
            - COMPLETED
            - DEAD
            - DROPPED
          x-enum-varnames:
            - EventReceiptStatusAccepted
            - EventReceiptStatusProcessing
            - EventReceiptStatusCompleted
            - EventReceiptStatusDead
            - EventReceiptStatusDropped
        reasonCode:
          type: string
        acceptedAt:
          type: string
          format: date-time
        observedAt:
          type: string
          format: date-time
        eventIds:
          type: array
          items:
            type: string
        deliveryDetail:
          type: string
          enum:
            - AVAILABLE
            - UNAVAILABLE
          x-enum-varnames:
            - EventDeliveryDetailAvailable
            - EventDeliveryDetailUnavailable
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/EventDeliverySummary'
        deliveryCounts:
          $ref: '#/components/schemas/EventReceiptDeliveryCounts'
    EventDeadLetter:
      type: object
      additionalProperties: false
      description: >-
        Tenant/operator-authorized redacted diagnostics. Does not expose raw payload, callback URL
        or credentials. Unresolved provider records belong only to provider operators.
      required:
        - id
        - stage
        - reasonCode
        - createdAt
        - expiresAt
        - redriveCount
        - redriveEligible
        - observedAt
      properties:
        id:
          type: string
        receiptId:
          type: string
          nullable: true
        eventId:
          type: string
          nullable: true
        subscriptionId:
          type: string
          nullable: true
        stage:
          type: string
          enum:
            - INGRESS
            - PROCESSING
            - DELIVERY
            - MANAGEMENT
          x-enum-varnames:
            - EventDeadLetterStageIngress
            - EventDeadLetterStageProcessing
            - EventDeadLetterStageDelivery
            - EventDeadLetterStageManagement
        reasonCode:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        redriveCount:
          type: integer
          minimum: 0
          maximum: 3
        redriveEligible:
          type: boolean
        observedAt:
          type: string
          format: date-time
    EventDeadLetterQueryResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventDeadLetter'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors; omitted when no errors occurred.
          items:
            $ref: '#/components/schemas/Error'
      description: >-
        Authorized redacted dead-letter results with opaque cursor pagination and partial query
        errors.
    EventRedriveResult:
      type: object
      additionalProperties: false
      description: >-
        Audited reprocessing of the original identity and deadline. Does not reset TTLs or bypass
        outbox uniqueness.
      required:
        - deadLetterId
        - status
        - redriveCount
      properties:
        deadLetterId:
          type: string
        receiptId:
          type: string
          nullable: true
        eventId:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - ACCEPTED
          x-enum-varnames:
            - EventRedriveStatusAccepted
        redriveCount:
          type: integer
          minimum: 1
          maximum: 3
    PatchSubscriptionRequest:
      type: object
      additionalProperties: false
      description: >-
        Edit display label only. Must be nonempty PLAIN value of at most 256 characters. Query,
        target, original host arguments and lifecycle are immutable through this operation.
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/TypeValue'
    SimulatorConfiguration:
      type: object
      additionalProperties: false
      description: >-
        Typed simulator producer settings. Omitted camera profile advertises motion/person; doorbell
        adds chime. Profile must be compatible with device_type.
      required: []
      properties:
        eventProfile:
          type: string
          enum:
            - CAMERA
            - DOORBELL
            - THERMOSTAT
          x-enum-varnames:
            - SimulatorEventProfileCamera
            - SimulatorEventProfileDoorbell
            - SimulatorEventProfileThermostat
    SimulatorSharedFields:
      description: >-
        Shared simulator fields. Existing device_type wire spelling is retained for compatibility in
        both media projections.
      allOf:
