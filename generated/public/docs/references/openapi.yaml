          type: string
          description: a token that can be used to get the next page of results.
    EndpointQueryResponseError:
      type: object
      description: >-
        Response-level error describing a partial deep endpoint-state query failure. These errors
        report deep-query item failures after endpoint enumeration has succeeded; they do not
        replace HTTP error responses for request-level failures.
      required:
        - location
        - code
        - family
        - message
      properties:
        location:
          type: string
          description: Approximate response location affected by the partial deep-query failure.
          example: >-
            endpoints/port1/principals/user123/endpoints/robot-1/routes/port1/principals/user123/routes/route-1
        code:
          $ref: '#/components/schemas/ErrorCode'
        family:
          $ref: '#/components/schemas/ErrorFamily'
        message:
          type: string
          description: Human-readable failure message.
          example: failed to rebuild stateless metadata for route
