        tosUri:
          type: string
          format: uri
          description: Terms of Service URI (optional)
          example: https://myapp.com/terms
        policyUri:
          type: string
          format: uri
          description: Privacy Policy URI (optional)
          example: https://myapp.com/privacy
        logoUri:
          type: string
          format: uri
          description: Logo URI for the client (optional)
          example: https://myapp.com/logo.png
        clientUri:
          type: string
          format: uri
          description: Client URI (optional)
          example: https://myapp.com
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthScope'
          description: Validated scopes that will be granted if the user consents
    VerifyDeviceResponse:
      type: object
      required:
        - deviceauth_id
        - client_name
        - client_id
        - status
      description: |
        Response from the /oauth/verify-device endpoint. Contains device and client information for display on the authorization page.
      properties:
        deviceauth_id:
          type: string
          description: Unique identifier for the device authentication entry
          example: da_1234567890abcdef
        client_name:
          type: string
          description: Display name of the OAuth client requesting authorization
          example: My OAuth Application
        client_id:
          type: string
          description: OAuth client identifier
          example: port1/principals/user123/oauth-clients/my-client
        status:
          type: string
          description: Current status of the device authentication (e.g., "pending", "authorized", "expired")
          example: pending
        logo_uri:
          type: string
          format: uri
          description: Logo URI for the client (optional)
          example: https://myapp.com/logo.png
        client_uri:
          type: string
          format: uri
          description: Client URI (optional)
          example: https://myapp.com
        tos_uri:
          type: string
          format: uri
          description: Terms of Service URI (optional)
          example: https://myapp.com/terms
        policy_uri:
          type: string
          format: uri
          description: Privacy Policy URI (optional)
          example: https://myapp.com/privacy
    AuthorizeDeviceRequest:
      type: object
      required:
        - user_code
        - scopes
      description: |
        Request body for the /oauth/authorize-device endpoint. Used by authenticated users to grant consent for device authorization.
      properties:
        user_code:
          type: string
          description: User code displayed to the user for device authorization
          example: ABCD-EFGH
        scopes:
          type: array
          items:
