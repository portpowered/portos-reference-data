      operationId: handleSmartThingsWebhook
      responses:
        '200':
          description: OK
        '400':
          description: Invalid request payload
        '500':
          description: Internal server error
      x-portos-delegated: false
      x-portos-resource-permission: true
      security:
        - oauth2: []
        - bearerAuth: []
  /webhooks/github:
    post:
      tags:
        - Webhooks
      summary: Handle GitHub webhook event
      description: |
        Receives webhook events from GitHub. The endpoint validates the request
        using HMAC-SHA256 signature verification via the X-Hub-Signature-256 header.
        Supported event types include pull_request, push, create, delete,
        pull_request_review, and pull_request_review_comment. Events are translated
        into Port OS vcs-events messages for downstream processing.

        This endpoint always returns 200 OK to prevent GitHub from retrying deliveries.
      operationId: handleGitHubWebhook
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: HMAC-SHA256 signature of the request body, prefixed with "sha256="
          schema:
            type: string
            example: sha256=abc123...
        - name: X-GitHub-Delivery
          in: header
          required: false
          description: Unique identifier for the webhook delivery, used for deduplication
          schema:
            type: string
            format: uuid
        - name: X-GitHub-Event
          in: header
          required: false
          description: The type of GitHub event that triggered the webhook (e.g., push, pull_request)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub webhook event payload. The shape varies by event type.
              additionalProperties: true
            example:
              key: value
      responses:
        '200':
          description: Webhook received and processed (always returned to prevent retries)
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid request payload
                type: BAD_REQUEST
        '401':
          description: Invalid HMAC signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Authentication required
                type: UNAUTHORIZED
      x-portos-delegated: false
      x-portos-resource-permission: false
  /webhooks/google-cloud-scheduler:
    post:
      tags:
        - Webhooks
      summary: Handle Google Cloud Scheduler webhook
      description: |-
        Receives scheduled job invocations from Google Cloud Scheduler.
        Triggers a flow run for the specified flow and node. Authentication
        is enforced by the webhook auth middleware (service account validation).

        This endpoint always returns 200 OK to prevent Google Cloud Scheduler
        from retrying deliveries.


        Requires a signed user/session or the existing authenticated client flow. The anonymous DCR delegated device profile cannot invoke this operation.
      operationId: handleGoogleCloudSchedulerWebhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - flow_id
                - node_id
              properties:
                flow_id:
                  type: string
                  description: The Port OS identifier of the flow to trigger
                node_id:
                  type: string
                  description: The Port OS identifier of the flow node to execute
      responses:
        '200':
          description: Webhook received and flow run triggered (always returned to prevent retries)
        '400':
          description: Invalid request payload or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid request payload
                type: BAD_REQUEST
        '401':
          description: Unauthorized — invalid or missing service account credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Authentication required
                type: UNAUTHORIZED
      x-portos-delegated: false
      x-portos-resource-permission: true
  /tuya/qrcode:
    post:
      tags:
        - Tuya
      summary: Generate Tuya QR Code
      operationId: generateTuyaQrCode
      description: |
        Generates a QR code for Tuya smart home device authentication. The QR code can be scanned by the Tuya Smart app to link a Tuya account. Requires a valid Tuya client ID and access code obtained from the Tuya IoT platform.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accessCode
                - clientId
              properties:
                accessCode:
                  type: string
                  description: Access code obtained from the Tuya IoT platform
                schema:
                  type: string
                  description: Optional Tuya app schema identifier
                clientId:
                  type: string
                  description: Tuya IoT platform client ID
                authenticationUrl:
                  type: string
                  description: |
                    Optional override for the Tuya authentication API endpoint. Defaults to https://apigw.iotbing.com if not provided.
      responses:
        '200':
          description: QR code generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: Raw QR code token
                  qrFormattedCode:
                    type: string
                    description: |
                      Formatted QR code string suitable for rendering as a QR image (e.g., tuyaSmart--qrLogin?token={code})
              example:
                key: value
        '400':
          description: Bad request — missing required fields or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid request payload
                type: BAD_REQUEST
        '500':
          description: Internal server error — Tuya API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Internal server error
                type: INTERNAL
      x-portos-delegated: false
      x-portos-resource-permission: false
  /tuya/validatetoken:
    post:
      tags:
        - Tuya
      summary: Validate Tuya Login Code
      operationId: validateTuyaLoginCode
      description: |
        Validates a Tuya login code obtained from QR code scanning and returns authentication tokens. After a user scans the QR code generated by the /tuya/qrcode endpoint, this endpoint verifies the login and retrieves the Tuya access and refresh tokens for the authenticated user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginCode
                - userCode
                - clientId
              properties:
                loginCode:
                  type: string
                  description: Login code obtained from QR code scanning
                userCode:
                  type: string
                  description: User code associated with the QR code session
                clientId:
                  type: string
                  description: Tuya IoT platform client ID
                authenticationUrl:
                  type: string
                  description: |
                    Optional override for the Tuya authentication API endpoint. Defaults to https://apigw.iotbing.com if not provided.
      responses:
        '200':
          description: Login code validated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the validation was successful
                  accessToken:
                    type: string
                    description: Tuya access token for API calls
                  refreshToken:
                    type: string
                    description: Tuya refresh token for renewing the access token
                  expireTime:
                    type: integer
                    description: Token expiry time in seconds
                  terminalID:
                    type: string
                    description: Terminal identifier for the authenticated session
                  uid:
                    type: string
                    description: Tuya user identifier
                  username:
                    type: string
                    description: Tuya username
                  endpoint:
                    type: string
                    description: Tuya API endpoint for subsequent calls
              example:
                key: value
        '400':
          description: Bad request — missing required fields or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invalid request payload
                type: BAD_REQUEST
        '500':
          description: Internal server error — Tuya API unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Internal server error
                type: INTERNAL
      x-portos-delegated: false
      x-portos-resource-permission: false
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      type: oauth2
      description: OAuth2 authentication using the OAuth2 flow.
      flows:
        authorizationCode:
          authorizationUrl: https://api.portpowered.com/oauth/authorize
          tokenUrl: https://api.portpowered.com/auth/token
          scopes:
            endpoint:read: Read authorized endpoints and capability state.
            endpoint:write: Manage authorized endpoints and routes.
            message:read: Read authorized messages.
            message:send: Dispatch capability messages to authorized targets.
            group:read: Read authorized groups and membership.
            group:manage: Manage authorized groups and membership.
            subscription:read: Read authorized subscriptions.
            subscription:write: Manage authorized subscriptions.
            secret:read: Read secrets; unavailable to anonymous DCR clients.
            secret:write: Manage secrets; unavailable to anonymous DCR clients.
            flow:read: Read flows; unavailable to anonymous DCR clients.
            flow:write: Manage flows; unavailable to anonymous DCR clients.
            flow:trigger: Trigger flows; unavailable to anonymous DCR clients.
            principal:read: Read principals; unavailable to anonymous DCR clients.
            principal:write: Manage principals; unavailable to anonymous DCR clients.
            access-control-rule:read: Read resource rules; unavailable to anonymous DCR clients.
            access-control-rule:write: Manage resource rules; unavailable to anonymous DCR clients.
        clientCredentials:
          tokenUrl: https://api.portpowered.com/auth/token
          scopes: {}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-chosen key that makes a non-idempotent request retry-safe, following draft-ietf-httpapi-idempotency-key-header. A committed response is stored for 24 hours and replayed for the same principal, operation, key and payload. Missing key returns 400 IDEMPOTENCY_KEY_REQUIRED, a key longer than 255 characters returns 400 IDEMPOTENCY_KEY_INVALID, the same key with a different payload returns 422, and the same key while the first request is still in flight returns 409. Failed (rolled-back) requests do not consume the key.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 6f1c3b0e-5a52-4b1f-9a0e-2f7c6d8e9a10
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The quoted strong entity tag of the resource the client last read (its `etag` field or `ETag` response header). The mutation is applied only when it still matches: a stale value returns 412 PRECONDITION_FAILED and a missing header returns 428 PRECONDITION_REQUIRED. `*` matches any current version of an existing group (RFC 9110), for a deliberate last-writer-wins change.
      schema:
        type: string
        minLength: 1
      example: '"12"'
  headers:
    ETag:
      description: |
        Opaque strong entity tag of the returned resource version. Send it back in `If-Match` on the next mutation of the same resource.
      schema:
        type: string
        example: '"12"'
  schemas:
    EndpointRegistryInterfaceConfiguration:
      x-namespace: port1/systems/zero/capability-interfaces/endpoint-registry
      x-name: endpoint-registry
      x-version: '1.0'
      x-type: configuration
      description: Configuration for Port OS endpoint registry lifecycle notifications
      type: object
      additionalProperties: false
    EndpointRegistryInterfaceEndpointUpdatedMessage:
      x-namespace: port1/systems/zero/capability-interfaces/endpoint-registry
      x-name: endpoint-updated
      x-version: '1.0'
      x-type: message
      x-directionality: out
      description: Port OS emitted a durable endpoint metadata or enablement change. Delivery is best effort.
      type: object
      properties:
        endpointId:
          type: string
          description: Full Port OS endpoint identifier.
        name:
          type: string
          description: Current endpoint name.
        type:
          type: string
          description: Current ontological endpoint type.
        enablement:
          type: string
          enum:
            - ENABLED
            - DISABLED
          description: Whether Port OS permits messages to be sent to this endpoint.
      required:
        - endpointId
        - name
        - type
        - enablement
      additionalProperties: false
    IntegrationRequest:
      type: object
      description: Email and explicit consent for updates about a selected future integration.
      additionalProperties: false
      required:
        - email
        - pluginId
        - consent
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        pluginId:
          type: string
          enum:
            - port1/systems/zero/plugins/715b7b85-311f-4851-8430-88bbac6dd3e7
            - port1/systems/zero/plugins/f9a10d98-abf9-40ed-8400-a2ab0210fdfd
            - port1/systems/zero/plugins/9d21576b-e2fe-4d6a-99ab-4fc969a08d54
            - muse
            - vscode
            - grok
            - goose
            - openclaw
            - hermes
            - codex
            - cline
        consent:
          type: boolean
          enum:
            - true
    SyntheticEventEndpoint:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 2048
      description: Endpoint identity resolved to the authorized active simulator source binding.
    SyntheticEventHeader:
      type: object
      additionalProperties: false
      description: Capability occurrence or ambient attribute header. No caller-supplied occurrence identity or timestamp.
      required:
        - namespace
        - name
        - version
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 2048
        name:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          minLength: 1
          maxLength: 128
    SyntheticEventRequest:
      type: object
      additionalProperties: false
      description: Authenticated synthetic admission on enabled simulator endpoints only. Server derives tenant, active source binding, event ID and occurrence time. Maximum encoded request size is 64 KiB, enforced by the service; per-source rate limit is 10 requests per second with tenant quotas.
      required:
        - requestId
        - endpoint
        - header
        - body
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 256
          description: Idempotency key scoped to authenticated tenant and resolved simulator binding. Reuse with different semantic input fails 409.
        endpoint:
          $ref: '#/components/schemas/SyntheticEventEndpoint'
        header:
          $ref: '#/components/schemas/SyntheticEventHeader'
        body:
          type: object
          additionalProperties: true
          description: Validated against the selected canonical capability schema and enabled simulator profile. Unsupported fields are rejected.
    SyntheticEventAccepted:
      type: object
      additionalProperties: false
      description: 202 is returned only after durable admission. Semantic duplicates return the same IDs. Acceptance does not prove delivery or ChatGPT task execution.
      required:
        - receiptId
        - eventId
        - endpointId
        - status
      properties:
        receiptId:
          type: string
        eventId:
          type: string
        endpointId:
          type: string
        status:
          type: string
          enum:
            - accepted
          x-enum-varnames:
            - SyntheticAdmissionAccepted
    EventDeliverySummary:
      type: object
      additionalProperties: false
      description: Authorized subscription delivery metadata. Acknowledged means host HTTP acceptance only. Callback URL, credentials and event body are never exposed.
      required:
        - subscriptionId
        - eventId
        - status
        - attemptCount
      properties:
        subscriptionId:
          type: string
        eventId:
          type: string
        status:
          type: string
          enum:
            - pending
            - sending
            - acknowledged
            - dead
            - dropped
            - cancelled
          x-enum-varnames:
            - EventDeliveryStatusPending
            - EventDeliveryStatusSending
            - EventDeliveryStatusAcknowledged
            - EventDeliveryStatusDead
            - EventDeliveryStatusDropped
            - EventDeliveryStatusCancelled
        reasonCode:
          type: string
        attemptCount:
          type: integer
          minimum: 0
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
    EventReceiptDeliveryCounts:
      type: object
      additionalProperties: false
      description: Compact delivery totals for this receipt, limited to subscriptions the reader can currently inspect. May remain available when per-job details exceed the response bound or are pruned only if retained authorization evidence proves the included monitor set. Never copy unfiltered tenant-wide dedup counters. Omit deliveryCounts when ownership or current authorization cannot be resolved; omission does not mean zero. Acknowledged counts host HTTP acceptance and never proves a ChatGPT response or task execution.
      required:
        - matched
        - acknowledged
        - pending
        - failed
      properties:
        matched:
          type: integer
          minimum: 0
          description: Matching delivery jobs in the authorized monitor set.
        acknowledged:
          type: integer
          minimum: 0
          description: Jobs accepted through host HTTP acknowledgement; not proof of task execution.
        pending:
          type: integer
          minimum: 0
          description: Nonterminal jobs, including pending and sending.
        failed:
          type: integer
          minimum: 0
          description: Terminal unacknowledged jobs, including dead, dropped and cancelled.
    EventReceipt:
      type: object
      additionalProperties: false
      description: Retained source receipt and delivery summaries limited to subscriptions the reader may inspect. Missing retained detail is explicitly unavailable, not an inferred zero count. No receipt proves execution of a ChatGPT task.
      required:
        - id
        - receiptId
        - eventId
        - endpointId
        - status
        - acceptedAt
        - observedAt
        - eventIds
        - deliveryDetail
        - deliveries
      properties:
        id:
          type: string
          description: Canonical resource identity, equal to receiptId.
        receiptId:
          type: string
        eventId:
          type: string
        endpointId:
          type: string
        status:
          type: string
          enum:
            - accepted
            - processing
            - completed
            - dead
            - dropped
          x-enum-varnames:
            - EventReceiptStatusAccepted
            - EventReceiptStatusProcessing
            - EventReceiptStatusCompleted
            - EventReceiptStatusDead
            - EventReceiptStatusDropped
        reasonCode:
          type: string
        acceptedAt:
          type: string
          format: date-time
        observedAt:
          type: string
          format: date-time
        eventIds:
          type: array
          items:
            type: string
        deliveryDetail:
          type: string
          enum:
            - available
            - unavailable
          x-enum-varnames:
            - EventDeliveryDetailAvailable
            - EventDeliveryDetailUnavailable
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/EventDeliverySummary'
        deliveryCounts:
          $ref: '#/components/schemas/EventReceiptDeliveryCounts'
    EventDeadLetter:
      type: object
