      required:
        - name
      properties:
        name:
          description: The new name for the endpoint group as a human readable string or a localizable asset
          allOf:
            - $ref: '#/components/schemas/TypeValue'
    AddEndpointGroupMembersRequest:
      type: object
      description: >
        Request payload for adding endpoint members to an endpoint group. Each added member must be
        the ID of an existing endpoint the caller can read; a malformed ID is BAD_REQUEST, and a
        missing or unreadable endpoint is NOT_FOUND.
      required:
        - memberEndpointIds
      properties:
        memberEndpointIds:
          type: array
          items:
            type: string
          description: List of member IDs to add to the group
    RemoveEndpointGroupMembersRequest:
      type: object
      description: Request payload for removing endpoint members from an endpoint group.
      required:
        - memberEndpointIds
      properties:
        memberEndpointIds:
          type: array
          items:
            type: string
          description: List of member IDs to remove from the group
    EnumerateGroupRoutesResponse:
      type: object
      description: Paginated response containing a list of endpoint group routes.
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/GroupRoutesList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    EndpointGroupController:
      type: object
      description: >
        An endpoint able to act on a group through a `CAN_CONTROL` relationship, with the interface
        messages it supports there. Being a controller does not grant authorization.
      additionalProperties: false
      required:
        - endpointId
        - interfaces
      properties:
        endpointId:
          type: string
          description: The controlling endpoint.
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipInterface'
          description: Interfaces and messages the endpoint supports on the group.
    GroupRouteAttributeState:
      type: object
      description: >
        One attribute value reported for one group route of an endpoint group. A group's state is
        the set of its group routes' values; values from different providers are never aggregated,
        so each entry names the group route and the provider that reported it.
      required:
        - groupRouteId
        - pluginId
        - provider
        - namespace
        - name
        - version
        - value
      properties:
        groupRouteId:
          type: string
          description: The typed ID of the group route the value was reported for.
          example: port1/principals/123/endpoint-group-routes/789
        pluginId:
          type: string
          description: The plugin that owns the group route and reported the value.
        provider:
          type: string
          description: The display name of that plugin.
          example: Roborock
        namespace:
          type: string
          description: The capability interface namespace for this attribute
          example: port1/systems/zero/capability-interfaces/spatial
        name:
          type: string
          description: The name of the attribute within the namespace
          example: active
        version:
          type: string
          description: The capability interface version the value conforms to.
          example: '1.0'
        value:
          type: object
          additionalProperties: true
          description: The attribute value payload, structure depends on the attribute schema
        sampledAt:
          type: string
          format: date-time
          description: When the provider observed the value. Omitted when the provider did not say.
    EndpointGroupEtagReference:
      type: object
      description: >-
        A group addressed together with the etag the client last read, validated inside the
        management transaction.
      additionalProperties: false
      required:
        - groupId
        - etag
      properties:
        groupId:
          type: string
          minLength: 1
          description: The endpoint group ID.
        etag:
          type: string
          minLength: 1
          description: The group's `etag` as last read by the client.
          example: '"4"'
    EndpointGroupRedirect:
      type: object
      description: >-
        A merged-away group ID and the group it now redirects to. Reads and control follow
        redirects; mutations fail with GROUP_MERGED.
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          type: string
          description: The merged-away group ID.
        to:
          type: string
          description: The group it redirects to.
    EndpointGroupsManageOperationType:
      type: string
      description: Discriminator of an endpoint group management operation.
      enum:
        - CREATE_GROUP
        - DELETE_GROUP
        - SET_NAME
        - ADD_MEMBERS
        - REMOVE_MEMBERS
        - MERGE_INTO
        - SET_ENABLEMENT
      x-enum-varnames:
        - EndpointGroupsManageOperationTypeCreateGroup
        - EndpointGroupsManageOperationTypeDeleteGroup
        - EndpointGroupsManageOperationTypeSetName
        - EndpointGroupsManageOperationTypeAddMembers
        - EndpointGroupsManageOperationTypeRemoveMembers
        - EndpointGroupsManageOperationTypeMergeInto
        - EndpointGroupsManageOperationTypeSetEnablement
    EndpointGroupsCreateGroupOperation:
      type: object
      description: >
        Creates a user group. Its new ID and etag are returned in the result; later operations in
        the same batch cannot reference it. A user group name is `{"type": "PLAIN", "value": ...}`
        whose value is non-blank UTF-8 text of at most 256 bytes with no control characters;
        anything else is rejected with BAD_REQUEST. Each added member must be the ID of an existing
        endpoint the caller can read; a malformed ID is BAD_REQUEST, and a missing or unreadable
        endpoint is NOT_FOUND.
      additionalProperties: false
      required:
        - requestId
        - operation
        - name
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - CREATE_GROUP
          x-enum-varnames:
            - CreateGroup
          description: Operation discriminator.
        name:
          $ref: '#/components/schemas/TypeValue'
        memberEndpointIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Endpoint IDs.
    EndpointGroupsDeleteGroupOperation:
      type: object
      description: Deletes a group.
      additionalProperties: false
      required:
        - requestId
        - operation
        - groupId
        - etag
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - DELETE_GROUP
          x-enum-varnames:
            - DeleteGroup
          description: Operation discriminator.
        groupId:
          type: string
          minLength: 1
          description: The endpoint group to modify.
        etag:
          type: string
          minLength: 1
          description: >
            The group etag the client last read. When an earlier operation in the same request
            changes this group, send the etag that operation reports instead: every operation that
            changes the group advances its etag by one, and one that changes nothing keeps it.
    EndpointGroupsSetNameOperation:
      type: object
      description: >
        Renames a group. The name is a user override that survives rediscovery. A user group name is
        `{"type": "PLAIN", "value": ...}` whose value is non-blank UTF-8 text of at most 256 bytes
        with no control characters; anything else is rejected with BAD_REQUEST.
      additionalProperties: false
      required:
        - requestId
        - operation
        - groupId
        - etag
        - name
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - SET_NAME
          x-enum-varnames:
            - SetName
          description: Operation discriminator.
        groupId:
          type: string
          minLength: 1
          description: The endpoint group to modify.
        etag:
          type: string
          minLength: 1
          description: >
            The group etag the client last read. When an earlier operation in the same request
            changes this group, send the etag that operation reports instead: every operation that
            changes the group advances its etag by one, and one that changes nothing keeps it.
        name:
          $ref: '#/components/schemas/TypeValue'
    EndpointGroupsAddMembersOperation:
      type: object
      description: >
        Adds endpoint members to a group. Each added member must be the ID of an existing endpoint
        the caller can read; a malformed ID is BAD_REQUEST, and a missing or unreadable endpoint is
        NOT_FOUND.
      additionalProperties: false
      required:
        - requestId
        - operation
        - groupId
        - etag
        - memberEndpointIds
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - ADD_MEMBERS
          x-enum-varnames:
            - AddMembers
          description: Operation discriminator.
        groupId:
          type: string
          minLength: 1
          description: The endpoint group to modify.
        etag:
          type: string
          minLength: 1
          description: >
            The group etag the client last read. When an earlier operation in the same request
            changes this group, send the etag that operation reports instead: every operation that
            changes the group advances its etag by one, and one that changes nothing keeps it.
        memberEndpointIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Endpoint IDs.
    EndpointGroupsRemoveMembersOperation:
      type: object
      description: |
        Removes endpoint members from a group. IDs that are not members are ignored.
      additionalProperties: false
      required:
        - requestId
        - operation
        - groupId
        - etag
        - memberEndpointIds
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - REMOVE_MEMBERS
          x-enum-varnames:
            - RemoveMembers
          description: Operation discriminator.
        groupId:
          type: string
          minLength: 1
          description: The endpoint group to modify.
        etag:
          type: string
          minLength: 1
          description: >
            The group etag the client last read. When an earlier operation in the same request
            changes this group, send the etag that operation reports instead: every operation that
            changes the group advances its etag by one, and one that changes nothing keeps it.
        memberEndpointIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Endpoint IDs.
    EndpointGroupsMergeIntoOperation:
      type: object
      description: >-
        Merges source groups into a target group. Source group routes are rehomed to the target,
        memberships are unioned, and each source ID becomes a redirect to the target. Identity
        decision that requires explicit user confirmation.
      additionalProperties: false
      required:
        - requestId
        - operation
        - sources
        - target
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - MERGE_INTO
          x-enum-varnames:
            - MergeInto
          description: Operation discriminator.
        sources:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/EndpointGroupEtagReference'
          description: >-
            Groups merged into the target; each must be distinct from the target and from each
            other.
        target:
          $ref: '#/components/schemas/EndpointGroupEtagReference'
    EndpointGroupsManageOperation:
      description: >-
        One endpoint group management operation, discriminated by `operation`. Unknown operations
        are rejected with 400.
      oneOf:
        - $ref: '#/components/schemas/EndpointGroupsCreateGroupOperation'
        - $ref: '#/components/schemas/EndpointGroupsDeleteGroupOperation'
        - $ref: '#/components/schemas/EndpointGroupsSetNameOperation'
        - $ref: '#/components/schemas/EndpointGroupsAddMembersOperation'
        - $ref: '#/components/schemas/EndpointGroupsRemoveMembersOperation'
        - $ref: '#/components/schemas/EndpointGroupsMergeIntoOperation'
        - $ref: '#/components/schemas/EndpointGroupsSetEnablementOperation'
      discriminator:
        propertyName: operation
        mapping:
          CREATE_GROUP: '#/components/schemas/EndpointGroupsCreateGroupOperation'
          DELETE_GROUP: '#/components/schemas/EndpointGroupsDeleteGroupOperation'
          SET_NAME: '#/components/schemas/EndpointGroupsSetNameOperation'
          ADD_MEMBERS: '#/components/schemas/EndpointGroupsAddMembersOperation'
          REMOVE_MEMBERS: '#/components/schemas/EndpointGroupsRemoveMembersOperation'
          MERGE_INTO: '#/components/schemas/EndpointGroupsMergeIntoOperation'
          SET_ENABLEMENT: '#/components/schemas/EndpointGroupsSetEnablementOperation'
    EndpointGroupsManageRequest:
      type: object
      description: >
        Atomic batch of static endpoint group management operations. Operations are applied in order
        inside one transaction; either all commit or none do. `requestId` values must be unique
        within the request. Physical control is never part of this request. Every operation that
        writes a group advances its etag by one, so a later operation on a group already written in
        the same request must send the etag the earlier operation reports; each result reports the
        group's etag right after its operation.
      additionalProperties: false
      required:
        - operations
      properties:
        validateOnly:
          type: boolean
          default: false
          description: >
            When true, runs authorization and validation and returns what would happen, writing
            nothing. A validate-only request neither requires nor consumes an `Idempotency-Key`.
        operations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/EndpointGroupsManageOperation'
    EndpointGroupsManageResult:
      type: object
      description: >
        Result of one committed operation, correlated by `requestId`. `CREATE_GROUP`, `SET_NAME`,
        `ADD_MEMBERS` and `REMOVE_MEMBERS` return `group` with its new etag; `DELETE_GROUP` returns
        `deletedGroupId`; `MERGE_INTO` returns `target` with its new etag and `redirects`.
      additionalProperties: false
      required:
        - requestId
        - operation
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          $ref: '#/components/schemas/EndpointGroupsManageOperationType'
        group:
          $ref: '#/components/schemas/EndpointGroupEtagReference'
        deletedGroupId:
          type: string
          description: The deleted group ID (`DELETE_GROUP`).
        target:
          $ref: '#/components/schemas/EndpointGroupEtagReference'
        redirects:
          type: array
          items:
            $ref: '#/components/schemas/EndpointGroupRedirect'
          description: Redirects written by `MERGE_INTO`.
    EndpointGroupsManageResponse:
      type: object
      description: >
        Atomic batch envelope. `errors` is empty if and only if the batch committed. On failure
        `results` is empty and `errors` lists every failing operation; nothing is written and no
        events are emitted. Items correlate by `requestId`, never by position.
      additionalProperties: false
      required:
        - status
        - results
        - errors
      properties:
        status:
          $ref: '#/components/schemas/BatchResponseStatus'
        results:
          type: array
          items:
            $ref: '#/components/schemas/EndpointGroupsManageResult'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchItemError'
    Relationship:
      type: object
      description: >
        A typed relationship between port resources. Provider discovery and group membership
        operations manage relationships; the REST collection is read-only.
      additionalProperties: false
      required:
        - id
        - ownerId
        - type
        - source
        - target
      properties:
        id:
          type: string
          description: The Port OS relationship ID.
        ownerId:
          type: string
          description: The owner of the relationship.
        associatedPluginId:
          type: string
          description: The plugin that reported the relationship.
        type:
          $ref: '#/components/schemas/RelationshipType'
        source:
          $ref: '#/components/schemas/RelationshipVertex'
        target:
          $ref: '#/components/schemas/RelationshipVertex'
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipInterface'
          description: Interface applicability, when declared.
    RelationshipVertex:
      type: object
      description: >-
        A typed resource at one end of a relationship. Route parents are endpoints; group-route
        parents are groups.
      additionalProperties: false
      required:
        - kind
        - id
      properties:
        kind:
          $ref: '#/components/schemas/RelationshipVertexKind'
        id:
          type: string
          description: The full Port OS ID of this resource.
        parentId:
          type: string
          description: >-
            The full endpoint or group ID for a route or group-route vertex. Omitted for endpoint
            and group vertices.
    RelationshipVertexKind:
      type: string
      description: The resource kind addressed by a relationship vertex.
      enum:
        - ENDPOINT
        - ROUTE
        - GROUP
        - GROUP_ROUTE
      x-enum-varnames:
        - RelationshipVertexKindEndpoint
        - RelationshipVertexKindRoute
        - RelationshipVertexKindGroup
        - RelationshipVertexKindGroupRoute
    EnumerateRelationshipsResponse:
      type: object
      description: Paginated response containing relationships visible to the caller.
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    BatchOperationRequestId:
      type: string
      description: >
        Client-chosen identifier for one operation in a batch request. It must be unique within the
        request and is echoed in the matching result or error so items are correlated by ID, never
        by position.
      minLength: 1
      maxLength: 64
      example: merge-kitchen
    BatchResponseStatus:
      type: string
      description: >
        Outcome of an atomic batch. `COMMITTED` means every operation was applied (or, for a
        validate-only request, would be applied); `FAILED` means nothing was written and `errors`
        lists every failing operation.
      enum:
        - COMMITTED
        - FAILED
      x-enum-varnames:
        - BatchResponseStatusCommitted
        - BatchResponseStatusFailed
    BatchItemError:
      type: object
      description: >
        Error for one operation of an atomic batch, correlated by the operation's `requestId`.
        `status` is the HTTP status the operation would have returned on its own.
      additionalProperties: false
      required:
        - requestId
        - code
        - family
        - status
        - message
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        code:
          $ref: '#/components/schemas/ErrorCode'
        family:
          $ref: '#/components/schemas/ErrorFamily'
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP-equivalent status code of the item failure.
        message:
          type: string
          description: Plain-language description of the failure and the suggested next action.
        resourceId:
          type: string
          description: The resource the failure applies to, when it is not the operation's primary target.
    SynchronizationItemError:
      type: object
      description: >
        One rejected discovery item of a `SynchronizationRequest`, keyed by the plugin-owned
        identity of the rejected item: `pluginRouteId` for a route or group route, or
        `relationshipExternalId` for a relationship. Exactly one of the two is set. It shares the
        `code`, `family`, `status` and `message` fields of `BatchItemError`; discovery items are
        keyed by plugin-owned identity because they carry no `requestId`. A request with any
        rejected item is rejected as a whole and lists every rejected item.
      additionalProperties: false
      required:
        - code
        - family
        - status
        - message
      properties:
        pluginRouteId:
          type: string
          description: >-
            Plugin-owned identifier of the rejected route or group route. Set unless the item is a
            relationship.
        relationshipExternalId:
          type: string
          description: Plugin-owned `externalId` of the rejected relationship. Set only for relationship items.
        interface:
          type: string
          description: >-
            Canonical capability interface name the failure applies to, when the failure is
            interface-specific.
        version:
          type: string
          description: >-
            Declared capability interface version the failure applies to, when the failure is
            interface-specific.
        code:
          $ref: '#/components/schemas/ErrorCode'
        family:
          $ref: '#/components/schemas/ErrorFamily'
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP-equivalent status code of the item failure.
        message:
          type: string
          description: Plain-language description of the failure and the suggested fix.
    OAuthClient:
      type: object
      description: An OAuth 2.0 client registration conforming to RFC 7591 with Port OS extensions.
      required:
        - clientId
        - clientName
      properties:
        id:
          type: string
          description: Stable query result identifier for the OAuth client. Mirrors clientId.
        clientId:
          type: string
          description: The unique identifier for the OAuth client
          example: port1/systems/zero/oauth-clients/1234567890
        clientName:
          type: string
          description: >
            A human-readable string name of the client to be presented to the end-user during
            authorization. If omitted, the authorization server may display the raw "client_id"
            value to the end-user instead. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        clientUri:
          type: string
          format: uri
          description: >
            A URL string of a web page providing information about the client. If present, the
            server should display this URL to the end-user in a clickable fashion. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
          example: https://app.example.com/oauth-clients/1234567890
        logoUri:
          type: string
          format: uri
          description: >
            A URL string that references a logo for the client. If present, the server should
            display this image to the end-user during approval. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        redirectUris:
          type: array
          items:
            type: string
            format: uri
          description: >
            An array of redirection URI strings for use in redirect-based flows such as the
            authorization code and implicit flows. Clients using these flows must register their
            redirection URI values. See https://datatracker.ietf.org/doc/html/rfc7591#section-2
        allowedOrigins:
          type: array
          items:
            type: string
            format: uri
          description: >
            An array of authorized JavaScript origin strings. When set, the server validates the
            Origin header on token requests against this list. Origins are scheme + host (+ optional
            port), with no path.
        grantTypes:
          type: array
          items:
            type: string
            x-enum-exempt: OAuth 2.0 Dynamic Client Registration values (RFC 7591)
            enum:
              - authorization_code
              - client_credentials
              - refresh_token
              - implicit
              - password
          description: >
            An array of OAuth 2.0 grant type strings that the client can use at the token endpoint.
            See https://datatracker.ietf.org/doc/html/rfc7591#section-2
        responseTypes:
          type: array
          items:
            type: string
            x-enum-exempt: OAuth 2.0 Dynamic Client Registration values (RFC 7591)
            enum:
              - code
              - token
              - id_token
          description: >
            An array of OAuth 2.0 response type strings that the client can use at the authorization
            endpoint. See https://datatracker.ietf.org/doc/html/rfc7591#section-2
        tokenEndpointAuthMethod:
          type: string
          x-enum-exempt: OAuth 2.0 Dynamic Client Registration values (RFC 7591)
          enum:
            - client_secret_post
            - client_secret_basic
            - client_secret_jwt
            - private_key_jwt
            - none
          description: >
            A string indicating the requested authentication method for the token endpoint. Values
            defined by this specification are "client_secret_post", "client_secret_basic",
            "client_secret_jwt", "private_key_jwt", and "none". See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        tokenEndpointAuthSigningAlg:
          type: string
          description: >
            A string containing a JWS signing algorithm (alg value) that MUST be used for signing
            the JWT used to authenticate the client at the token endpoint for the "private_key_jwt"
            and "client_secret_jwt" authentication methods. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        scope:
          type: string
          description: >
            A string containing a space-separated list of scope values that the client can use when
            requesting access tokens. Valid scopes are: endpoint:read, endpoint:write, message:read,
            message:send, secret:read, secret:write, flow:read, flow:write, flow:trigger,
            principal:read, principal:write, subscription:read, subscription:write,
            access-control-rule:read, access-control-rule:write. Scopes are mapped to Cedar
            permissions (e.g., "endpoint:read" maps to "endpoint.read"). See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
          example: endpoint:read endpoint:write message:read
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthScope'
          description: >
            List of OAuth scopes that this client can request (array representation of scope). This
            is a convenience field that represents the space-separated scope string as an array.
            Scopes are mapped to Cedar permissions (e.g., "endpoint:read" maps to "endpoint.read").
          example:
            - endpoint:read
            - endpoint:write
            - message:read
        contacts:
          type: array
          items:
            type: string
            format: email
          description: >
            An array of strings representing ways to contact people responsible for this client,
            typically email addresses. The authorization server may make these contact addresses
            available to end-users for support requests for the client. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        tosUri:
          type: string
          format: uri
          description: >
            A URL string that points to a human-readable terms of service document for the client
            that describes a contractual relationship between the end-user and the client that the
            end-user accepts when authorizing the client. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        tosUriLocalized:
          type: object
          additionalProperties:
            type: string
            format: uri
          description: >
            Localized versions of the terms of service URI using language tags as keys (BCP 47
            format). The keys are language tags and values are the localized terms of service URIs.
            See https://datatracker.ietf.org/doc/html/rfc7591#section-2.2
        policyUri:
          type: string
          format: uri
          description: >
            A URL string that points to a human-readable privacy policy document that describes how
            the deployment organization collects, uses, retains, and discloses personal data. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        policyUriLocalized:
          type: object
          additionalProperties:
            type: string
            format: uri
          description: >
            Localized versions of the privacy policy URI using language tags as keys (BCP 47
            format). The keys are language tags and values are the localized privacy policy URIs.
            See https://datatracker.ietf.org/doc/html/rfc7591#section-2.2
        clientSecret:
          type: string
          description: >
            The client secret string known only to the client and the authorization server. This
            secret is used for authenticating the client to the authorization server. This field is
            typically only returned during client registration and should not be included in GET
            responses for security reasons. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2.2
        clientSecretExpiresAt:
          type: integer
          description: >
            An integer indicating the expiration time of the client secret, represented as the
            number of seconds since the Unix epoch (1970-01-01T00:00:00Z). A value of 0 indicates
            that the secret does not expire. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2.2
        jwksUri:
          type: string
          format: uri
          description: >
            A URL string referencing the client's JSON Web Key (JWK) Set document, which contains
            the client's public keys. These keys can be used by higher-level protocols that use
            signing or encryption. See https://datatracker.ietf.org/doc/html/rfc7591#section-2
        jwks:
          type: object
          description: >
            The client's JSON Web Key Set document value, which contains the client's public keys.
            This parameter is intended to be used by clients that cannot use the "jwks_uri"
            parameter, such as native clients that cannot host public URLs. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        softwareId:
          type: string
          description: >
            A unique identifier string assigned by the client developer or software publisher used
            by registration endpoints to identify the client software to be dynamically registered.
            See https://datatracker.ietf.org/doc/html/rfc7591#section-2
        softwareVersion:
          type: string
          description: >
            A version identifier string for the client software identified by "software_id". The
            value of the "software_version" should change on any update to the client software
            identified by the same "software_id". See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        ownerId:
          type: string
          description: The owner ID of the OAuth client (Port OS specific field)
        createdAt:
          type: string
          format: date-time
          description: The timestamp when the OAuth client was created (Port OS specific field)
        updatedAt:
          type: string
          format: date-time
          description: The timestamp when the OAuth client was last updated (Port OS specific field)
    OAuthClientRegistrationRequest:
      type: object
      description: Request payload for registering a new OAuth 2.0 client per RFC 7591.
      required:
        - clientName
      properties:
        clientName:
          type: string
          description: >
            A human-readable string name of the client to be presented to the end-user during
            authorization. If omitted, the authorization server may display the raw "client_id"
            value to the end-user instead. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        clientUri:
          type: string
          format: uri
          description: >
            A URL string of a web page providing information about the client. If present, the
            server should display this URL to the end-user in a clickable fashion. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        clientUriLocalized:
          type: object
          additionalProperties:
            type: string
            format: uri
          description: >
            Localized versions of the client URI using language tags as keys (BCP 47 format). The
            keys are language tags and values are the localized URIs. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2.2
        logoUri:
          type: string
          format: uri
          description: >
            A URL string that references a logo for the client. If present, the server should
            display this image to the end-user during approval. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        logoUriLocalized:
          type: object
          additionalProperties:
            type: string
            format: uri
          description: >
            Localized versions of the logo URI using language tags as keys (BCP 47 format). The keys
            are language tags and values are the localized logo URIs. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2.2
        redirectUris:
          type: array
          items:
            type: string
            format: uri
          description: >
            An array of redirection URI strings for use in redirect-based flows such as the
            authorization code and implicit flows. Clients using these flows must register their
            redirection URI values. See https://datatracker.ietf.org/doc/html/rfc7591#section-2
        allowedOrigins:
          type: array
          items:
            type: string
            format: uri
          description: >
            An array of authorized JavaScript origin strings. When set, the server validates the
            Origin header on token requests against this list. Origins are scheme + host (+ optional
            port), with no path.
          example:
            - https://example.com
            - https://app.example.com
        grantTypes:
          type: array
          items:
            type: string
            x-enum-exempt: OAuth 2.0 Dynamic Client Registration values (RFC 7591)
            enum:
              - authorization_code
              - client_credentials
              - refresh_token
              - implicit
              - password
          description: >
            An array of OAuth 2.0 grant type strings that the client can use at the token endpoint.
            See https://datatracker.ietf.org/doc/html/rfc7591#section-2
          default:
            - authorization_code
        responseTypes:
          type: array
          items:
            type: string
            x-enum-exempt: OAuth 2.0 Dynamic Client Registration values (RFC 7591)
            enum:
              - code
              - token
              - id_token
          description: >
            An array of OAuth 2.0 response type strings that the client can use at the authorization
            endpoint. See https://datatracker.ietf.org/doc/html/rfc7591#section-2
        tokenEndpointAuthMethod:
          type: string
          x-enum-exempt: OAuth 2.0 Dynamic Client Registration values (RFC 7591)
          enum:
            - client_secret_post
            - client_secret_basic
            - client_secret_jwt
            - private_key_jwt
            - none
          description: >
            A string indicating the requested authentication method for the token endpoint. Values
            defined by this specification are "client_secret_post", "client_secret_basic",
            "client_secret_jwt", "private_key_jwt", and "none". See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
          default: client_secret_basic
        tokenEndpointAuthSigningAlg:
          type: string
          description: >
            A string containing a JWS signing algorithm (alg value) that MUST be used for signing
            the JWT used to authenticate the client at the token endpoint for the "private_key_jwt"
            and "client_secret_jwt" authentication methods. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthScope'
          description: >
            List of OAuth scopes that this client can request. This is the primary field for
            specifying scopes. Scopes are mapped to Cedar permissions (e.g., "endpoint:read" maps to
            "endpoint.read"). See https://datatracker.ietf.org/doc/html/rfc7591#section-2
          example:
            - endpoint:read
            - endpoint:write
            - message:read
        scope:
          type: string
          description: >
            A string containing a space-separated list of scope values that the client can use when
            requesting access tokens. This is a convenience field that represents the scopes array
            as a space-separated string. If both scope and scopes are provided, scopes takes
            precedence. See https://datatracker.ietf.org/doc/html/rfc7591#section-2
          example: endpoint:read endpoint:write message:read
        contacts:
          type: array
          items:
            type: string
            format: email
          description: >
            An array of strings representing ways to contact people responsible for this client,
            typically email addresses. The authorization server may make these contact addresses
            available to end-users for support requests for the client. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2
        tosUri:
          type: string
          format: uri
          description: >
            A URL string that points to a human-readable terms of service document for the client
