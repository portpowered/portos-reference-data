          pluginId: port1.plugin.hue
          pluginRouteId: hue-device-42
    PluginDispatchErrorDetails:
      type: object
      description: |
        Optional typed context for a plugin dispatch error. Fields are additive and only populated when the error type can safely expose that context to API clients.
      properties:
        endpointId:
          type: string
          description: Port OS endpoint ID involved in the failed dispatch.
        pluginId:
          type: string
          description: Port OS plugin ID that reported the failure.
        pluginRouteId:
          type: string
          description: Plugin-owned route identifier involved in the failed dispatch.
        provider:
          type: string
          description: Third-party provider or bridge name that reported the failure.
        directive:
          type: string
          description: Message namespace and name or provider directive that failed.
        parameter:
          type: string
          description: Request parameter or capability value that caused the failure.
        minimum:
          type: number
          description: Minimum accepted value when `type` is `VALUE_OUT_OF_RANGE`.
        maximum:
          type: number
          description: Maximum accepted value when `type` is `VALUE_OUT_OF_RANGE`.
        actual:
          type: string
          description: String representation of the submitted value when the plugin can safely report it.
        currentMode:
          type: string
          description: Current endpoint mode when `type` is `NOT_SUPPORTED_IN_CURRENT_MODE`.
        retryAfterSeconds:
          type: integer
          minimum: 0
          description: Suggested retry delay for rate-limit or provider-unavailable failures.
        correlationId:
          type: string
          description: Provider or plugin correlation ID useful for support.
      additionalProperties: false
    PluginDispatchErrorFamily:
      type: string
