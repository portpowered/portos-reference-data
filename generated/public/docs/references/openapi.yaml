        id:
          type: string
          description: The created plugin ID
          pattern: ^port1\.plugin\..*
    DeletePluginRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The plugin ID to delete
    EstablishPluginRequest:
      type: object
      required:
        - plugin
      properties:
        plugin:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              description: |
                The plugin type (e.g. local, webservice, applePushNotification)
            applePushNotificationPlugin:
              type: object
              description: Configuration for Apple Push Notification plugins
            webservicePlugin:
              type: object
              description: Configuration for HTTP-based remote plugins
            localPlugin:
              type: object
              description: Configuration for plugins running on the server instance
            clientCredentials:
              type: object
              description: OAuth client credentials for webservice plugins
              properties:
                clientId:
                  type: string
                clientSecret:
                  type: string
                tokenEndpoint:
                  type: string
            secretReferenceId:
              type: string
              description: Reference to an existing secret in the secret store
            applePushNotificationSecret:
              type: object
              description: APNS authentication token secret
    EstablishPluginResponse:
      type: object
      required:
        - pluginId
      properties:
        pluginId:
          type: string
          description: The ID of the created or updated plugin
        isUpdateResponse:
          type: boolean
          description: Whether this was an update to an existing plugin rather than a new creation
    AuthLinkSecret:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The unique identifier for the secret
    AuthLink:
      type: object
