          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    EndpointGroupController:
      type: object
      description: |
        An endpoint able to act on a group through a `CAN_CONTROL` relationship, with the interface messages it supports there. Being a controller does not grant authorization.
      additionalProperties: false
      required:
        - endpointId
        - interfaces
      properties:
        endpointId:
          type: string
          description: The controlling endpoint.
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipInterface'
          description: Interfaces and messages the endpoint supports on the group.
    GroupRouteAttributeState:
      type: object
      description: |
        One attribute value reported for one group route of an endpoint group. A group's state is the set of its group routes' values; values from different providers are never aggregated, so each entry names the group route and the provider that reported it.
      required:
        - groupRouteId
        - pluginId
        - provider
        - namespace
        - name
        - version
        - value
      properties:
        groupRouteId:
          type: string
          description: The typed ID of the group route the value was reported for.
          example: port1/principals/123/endpoint-group-routes/789
        pluginId:
          type: string
          description: The plugin that owns the group route and reported the value.
        provider:
          type: string
          description: The display name of that plugin.
          example: Roborock
        namespace:
          type: string
          description: The capability interface namespace for this attribute
          example: port1/systems/zero/capability-interfaces/spatial
        name:
          type: string
          description: The name of the attribute within the namespace
          example: active
        version:
          type: string
          description: The capability interface version the value conforms to.
          example: '1.0'
        value:
          type: object
          additionalProperties: true
          description: The attribute value payload, structure depends on the attribute schema
        sampledAt:
          type: string
          format: date-time
          description: When the provider observed the value. Omitted when the provider did not say.
    EndpointGroupEtagReference:
      type: object
      description: A group addressed together with the etag the client last read, validated inside the management transaction.
      additionalProperties: false
      required:
        - groupId
        - etag
      properties:
        groupId:
          type: string
          minLength: 1
          description: The endpoint group ID.
        etag:
          type: string
          minLength: 1
          description: The group's `etag` as last read by the client.
          example: '"4"'
    EndpointGroupRedirect:
      type: object
      description: A merged-away group ID and the group it now redirects to. Reads and control follow redirects; mutations fail with GROUP_MERGED.
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          type: string
          description: The merged-away group ID.
        to:
          type: string
          description: The group it redirects to.
    EndpointGroupsManageOperationType:
      type: string
      description: Discriminator of an endpoint group management operation.
      enum:
        - create_group
        - delete_group
        - set_name
        - add_members
        - remove_members
        - merge_into
      x-enum-varnames:
        - EndpointGroupsManageOperationTypeCreateGroup
        - EndpointGroupsManageOperationTypeDeleteGroup
        - EndpointGroupsManageOperationTypeSetName
        - EndpointGroupsManageOperationTypeAddMembers
        - EndpointGroupsManageOperationTypeRemoveMembers
        - EndpointGroupsManageOperationTypeMergeInto
    EndpointGroupsCreateGroupOperation:
      type: object
      description: |
        Creates a user group. Its new ID and etag are returned in the result; later operations in the same batch cannot reference it. A user group name is `{"type": "PLAIN", "value": ...}` whose value is non-blank UTF-8 text of at most 256 bytes with no control characters; anything else is rejected with BAD_REQUEST. Each added member must be the ID of an existing endpoint the caller can read; a malformed ID is BAD_REQUEST, and a missing or unreadable endpoint is NOT_FOUND.
      additionalProperties: false
      required:
        - requestId
        - operation
        - name
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - create_group
          description: Operation discriminator.
        name:
          $ref: '#/components/schemas/TypeValue'
        memberEndpointIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Endpoint IDs.
    EndpointGroupsDeleteGroupOperation:
      type: object
      description: Deletes a group.
      additionalProperties: false
      required:
        - requestId
        - operation
        - groupId
        - etag
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - delete_group
          description: Operation discriminator.
        groupId:
          type: string
          minLength: 1
          description: The endpoint group to modify.
        etag:
          type: string
          minLength: 1
          description: |
            The group etag the client last read. When an earlier operation in the same request writes this group, send the etag that operation reports instead: every operation advances the group etag by one.
    EndpointGroupsSetNameOperation:
      type: object
      description: |
        Renames a group. The name is a user override that survives rediscovery. A user group name is `{"type": "PLAIN", "value": ...}` whose value is non-blank UTF-8 text of at most 256 bytes with no control characters; anything else is rejected with BAD_REQUEST.
      additionalProperties: false
      required:
        - requestId
        - operation
        - groupId
        - etag
        - name
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - set_name
          description: Operation discriminator.
        groupId:
          type: string
          minLength: 1
          description: The endpoint group to modify.
        etag:
          type: string
          minLength: 1
          description: |
            The group etag the client last read. When an earlier operation in the same request writes this group, send the etag that operation reports instead: every operation advances the group etag by one.
        name:
          $ref: '#/components/schemas/TypeValue'
    EndpointGroupsAddMembersOperation:
      type: object
      description: |
        Adds endpoint members to a group. Each added member must be the ID of an existing endpoint the caller can read; a malformed ID is BAD_REQUEST, and a missing or unreadable endpoint is NOT_FOUND.
      additionalProperties: false
      required:
        - requestId
        - operation
        - groupId
        - etag
        - memberEndpointIds
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - add_members
          description: Operation discriminator.
        groupId:
          type: string
          minLength: 1
          description: The endpoint group to modify.
        etag:
          type: string
          minLength: 1
          description: |
            The group etag the client last read. When an earlier operation in the same request writes this group, send the etag that operation reports instead: every operation advances the group etag by one.
        memberEndpointIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Endpoint IDs.
    EndpointGroupsRemoveMembersOperation:
      type: object
      description: |
        Removes endpoint members from a group. IDs that are not members are ignored.
      additionalProperties: false
      required:
        - requestId
        - operation
        - groupId
        - etag
        - memberEndpointIds
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - remove_members
          description: Operation discriminator.
        groupId:
          type: string
          minLength: 1
          description: The endpoint group to modify.
        etag:
          type: string
          minLength: 1
          description: |
            The group etag the client last read. When an earlier operation in the same request writes this group, send the etag that operation reports instead: every operation advances the group etag by one.
        memberEndpointIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Endpoint IDs.
    EndpointGroupsMergeIntoOperation:
      type: object
      description: Merges source groups into a target group. Source group routes are rehomed to the target, memberships are unioned, and each source ID becomes a redirect to the target. Identity decision that requires explicit user confirmation.
      additionalProperties: false
      required:
        - requestId
        - operation
        - sources
        - target
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          type: string
          enum:
            - merge_into
          description: Operation discriminator.
        sources:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/EndpointGroupEtagReference'
          description: Groups merged into the target; each must be distinct from the target and from each other.
        target:
          $ref: '#/components/schemas/EndpointGroupEtagReference'
    EndpointGroupsManageOperation:
      description: One endpoint group management operation, discriminated by `operation`. Unknown operations are rejected with 400.
      oneOf:
        - $ref: '#/components/schemas/EndpointGroupsCreateGroupOperation'
        - $ref: '#/components/schemas/EndpointGroupsDeleteGroupOperation'
        - $ref: '#/components/schemas/EndpointGroupsSetNameOperation'
        - $ref: '#/components/schemas/EndpointGroupsAddMembersOperation'
        - $ref: '#/components/schemas/EndpointGroupsRemoveMembersOperation'
        - $ref: '#/components/schemas/EndpointGroupsMergeIntoOperation'
      discriminator:
        propertyName: operation
        mapping:
          create_group: '#/components/schemas/EndpointGroupsCreateGroupOperation'
          delete_group: '#/components/schemas/EndpointGroupsDeleteGroupOperation'
          set_name: '#/components/schemas/EndpointGroupsSetNameOperation'
          add_members: '#/components/schemas/EndpointGroupsAddMembersOperation'
          remove_members: '#/components/schemas/EndpointGroupsRemoveMembersOperation'
          merge_into: '#/components/schemas/EndpointGroupsMergeIntoOperation'
    EndpointGroupsManageRequest:
      type: object
      description: |
        Atomic batch of static endpoint group management operations. Operations are applied in order inside one transaction; either all commit or none do. `requestId` values must be unique within the request. Physical control is never part of this request. Every operation that writes a group advances its etag by one, so a later operation on a group already written in the same request must send the etag the earlier operation reports; each result reports the group's etag right after its operation.
      additionalProperties: false
      required:
        - operations
      properties:
        validateOnly:
          type: boolean
          default: false
          description: |
            When true, runs authorization and validation and returns what would happen, writing nothing. A validate-only request neither requires nor consumes an `Idempotency-Key`.
        operations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/EndpointGroupsManageOperation'
    EndpointGroupsManageResult:
      type: object
      description: |
        Result of one committed operation, correlated by `requestId`. `create_group`, `set_name`, `add_members` and `remove_members` return `group` with its new etag; `delete_group` returns `deletedGroupId`; `merge_into` returns `target` with its new etag and `redirects`.
      additionalProperties: false
      required:
        - requestId
        - operation
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        operation:
          $ref: '#/components/schemas/EndpointGroupsManageOperationType'
        group:
          $ref: '#/components/schemas/EndpointGroupEtagReference'
        deletedGroupId:
          type: string
          description: The deleted group ID (`delete_group`).
        target:
          $ref: '#/components/schemas/EndpointGroupEtagReference'
        redirects:
          type: array
          items:
            $ref: '#/components/schemas/EndpointGroupRedirect'
          description: Redirects written by `merge_into`.
    EndpointGroupsManageResponse:
      type: object
      description: |
        Atomic batch envelope. `errors` is empty if and only if the batch committed. On failure `results` is empty and `errors` lists every failing operation; nothing is written and no events are emitted. Items correlate by `requestId`, never by position.
      additionalProperties: false
      required:
        - status
        - results
        - errors
      properties:
        status:
          $ref: '#/components/schemas/BatchResponseStatus'
        results:
          type: array
          items:
            $ref: '#/components/schemas/EndpointGroupsManageResult'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchItemError'
    GroupRelationship:
      type: object
      description: |
        A typed relationship between routes and group routes, as reported by a provider through discovery. Read-only through the REST API.
      additionalProperties: false
      required:
        - id
        - ownerId
        - type
        - source
        - target
      properties:
        id:
          type: string
          description: The Port OS relationship ID.
        ownerId:
          type: string
          description: The owner of the relationship.
        associatedPluginId:
          type: string
          description: The plugin that reported the relationship.
        type:
          $ref: '#/components/schemas/RelationshipType'
        source:
          $ref: '#/components/schemas/GroupRelationshipVertex'
        target:
          $ref: '#/components/schemas/GroupRelationshipVertex'
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/RelationshipInterface'
          description: Interface applicability, when declared.
    GroupRelationshipVertex:
      type: object
      description: |
        One end of a relationship in application terms. A route vertex carries `routeId` and its `endpointId`; a group-route vertex carries `groupRouteId` and its canonical `groupId` (after following merges).
      additionalProperties: false
      properties:
        routeId:
          type: string
          description: The Port OS route ID, for a route vertex.
        endpointId:
          type: string
          description: The endpoint the route belongs to, for a route vertex.
        groupRouteId:
          type: string
          description: The Port OS group route ID, for a group-route vertex.
        groupId:
          type: string
          description: The canonical endpoint group the group route belongs to, for a group-route vertex.
    EnumerateGroupRelationshipsResponse:
      type: object
      description: Paginated response containing group relationships visible to the caller.
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/GroupRelationship'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    BatchOperationRequestId:
      type: string
      description: |
        Client-chosen identifier for one operation in a batch request. It must be unique within the request and is echoed in the matching result or error so items are correlated by ID, never by position.
      minLength: 1
      maxLength: 64
      example: merge-kitchen
    BatchResponseStatus:
      type: string
      description: |
        Outcome of an atomic batch. `committed` means every operation was applied (or, for a validate-only request, would be applied); `failed` means nothing was written and `errors` lists every failing operation.
      enum:
        - committed
        - failed
      x-enum-varnames:
        - BatchResponseStatusCommitted
        - BatchResponseStatusFailed
    BatchItemError:
      type: object
      description: |
        Error for one operation of an atomic batch, correlated by the operation's `requestId`. `status` is the HTTP status the operation would have returned on its own.
      additionalProperties: false
      required:
        - requestId
        - code
        - family
        - status
        - message
      properties:
        requestId:
          $ref: '#/components/schemas/BatchOperationRequestId'
        code:
          $ref: '#/components/schemas/ErrorType'
        family:
          $ref: '#/components/schemas/ErrorFamily'
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP-equivalent status code of the item failure.
        message:
          type: string
          description: Plain-language description of the failure and the suggested next action.
        resourceId:
          type: string
          description: The resource the failure applies to, when it is not the operation's primary target.
    SynchronizationItemError:
      type: object
      description: |
        One rejected discovery item of a `SynchronizationRequest`, keyed by the plugin-owned identity of the rejected item: `pluginRouteId` for a route or group route, or `relationshipExternalId` for a relationship. Exactly one of the two is set. It shares the `code`, `family`, `status` and `message` fields of `BatchItemError`; discovery items are keyed by plugin-owned identity because they carry no `requestId`. A request with any rejected item is rejected as a whole and lists every rejected item.
      additionalProperties: false
      required:
        - code
        - family
        - status
        - message
      properties:
        pluginRouteId:
          type: string
          description: Plugin-owned identifier of the rejected route or group route. Set unless the item is a relationship.
        relationshipExternalId:
          type: string
          description: Plugin-owned `externalId` of the rejected relationship. Set only for relationship items.
        interface:
          type: string
          description: Canonical capability interface name the failure applies to, when the failure is interface-specific.
        version:
          type: string
          description: Declared capability interface version the failure applies to, when the failure is interface-specific.
        code:
          $ref: '#/components/schemas/ErrorType'
        family:
          $ref: '#/components/schemas/ErrorFamily'
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP-equivalent status code of the item failure.
        message:
          type: string
          description: Plain-language description of the failure and the suggested fix.
