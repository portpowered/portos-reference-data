        manufacturer:
          $ref: '#/components/schemas/manufacturer'
        model:
          $ref: '#/components/schemas/model'
        serialNumber:
          $ref: '#/components/schemas/serialNumber'
        pluginCustomMetadata:
          $ref: '#/components/schemas/pluginCustomMetadata'
        id:
