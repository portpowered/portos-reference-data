          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    SetEndpointGroupNameRequest:
      type: object
      description: |
        Request payload for renaming an endpoint group. A user group name is `{"type": "PLAIN", "value": ...}` whose value is non-blank UTF-8 text of at most 256 bytes with no control characters; anything else is rejected with BAD_REQUEST.
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/TypeValue'
          description: The new name for the endpoint group as a human readable string or a localizable asset
    AddEndpointGroupMembersRequest:
      type: object
