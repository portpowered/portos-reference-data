      x-type: configuration
      description: Configuration schema for reminders provider capability interface
      type: object
      additionalProperties: false
    RtcStunUrl:
      type: string
      description: Public, credential-free STUN URI using the RFC 7064 stun:host[:port] form. This version supports DNS names and IPv4 hosts, with ports 1 through 65535. IPv6 literals, secure STUN, TURN, paths, queries and fragments are not supported by this configuration subset.
      minLength: 6
      maxLength: 256
      not:
        pattern: \s
      pattern: ^stun:[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)*(?::(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?$
    RtcIceServer:
      type: object
      description: The credential-free public STUN subset of the standard WebRTC RTCIceServer dictionary. URLs are discoverable configuration, never session credentials.
      required:
        - urls
      properties:
        urls:
          oneOf:
            - $ref: '#/components/schemas/RtcStunUrl'
            - type: array
              minItems: 1
              maxItems: 8
              items:
                $ref: '#/components/schemas/RtcStunUrl'
      additionalProperties: false
    RtcSessionSupportedStream:
      type: object
      description: A discoverable RTC media stream supported by an endpoint.
      additionalProperties: false
      required:
        - id
        - mediaKind
        - direction
      properties:
        id:
          type: string
          description: Stable identifier for the stream within the endpoint contract.
        mediaKind:
          type: string
          enum:
            - AUDIO
            - VIDEO
        direction:
          type: string
          description: Direction from the endpoint perspective; browser SENDONLY and RECVONLY are reversed.
          enum:
            - SENDRECV
            - SENDONLY
            - RECVONLY
            - INACTIVE
        codecs:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          description: Ordered permitted RTP codec MIME types, such as audio/opus or video/H264. Omitted uses browser defaults.
          items:
            type: string
            pattern: ^(audio|video)/[A-Za-z0-9.+-]+$
            maxLength: 128
    RtcDataChannel:
      type: object
      description: Standard WebRTC RTCDataChannelInit options plus the required label passed to createDataChannel. Channels are bidirectional.
      additionalProperties: false
      required:
        - label
      properties:
        label:
          type: string
          maxLength: 256
        ordered:
          type: boolean
        protocol:
          type: string
          maxLength: 256
        maxPacketLifeTime:
          type: integer
          minimum: 0
          maximum: 65535
        maxRetransmits:
          type: integer
          minimum: 0
          maximum: 65535
        negotiated:
          type: boolean
        id:
          type: integer
          minimum: 0
          maximum: 65534
      not:
        required:
          - maxPacketLifeTime
          - maxRetransmits
      allOf:
        - if:
            properties:
              negotiated:
                const: true
            required:
              - negotiated
          then:
            required:
              - id
    RtcSessionAuthorizationRequirement:
      type: object
      description: A typed authorization requirement for an RTC session message.
      additionalProperties: false
      required:
        - type
        - required
      properties:
        type:
          type: string
        required:
          type: boolean
    RtcSessionMessageAuthorizationRequirement:
      type: object
      description: Authorization requirements for a specific RTC session message.
      additionalProperties: false
