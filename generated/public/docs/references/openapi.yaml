                  description: The anonymous principal's refresh token
                subject_token:
                  type: string
                  description: The real identity token (Google, Apple, or Test ID token)
                subject_token_type:
                  type: string
                  description: |
                    Token type identifier. Must be urn:ietf:params:oauth:token-type:id_token
      responses:
