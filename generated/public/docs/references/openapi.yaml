        startedAt:
          type: string
          format: date-time
          description: Recording start time.
        durationSeconds:
          type: number
          minimum: 0
          description: Recording duration in seconds.
      required:
        - recordingId
      additionalProperties: false
    ErrorType:
      type: string
      enum:
        - BAD_REQUEST
        - BAD_REQUEST_PAYLOAD
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - TOO_MANY_REQUESTS
        - SERVICE_UNAVAILABLE
        - INTERNAL
        - INTERNAL_SERVER_ERROR
        - CHECKSUM_MISMATCH
        - FILE_TOO_LARGE
        - STORAGE_UNAVAILABLE
        - INSUFFICIENT_PERMISSIONS
        - INVALID_FILE_TYPE
        - QUOTA_EXCEEDED
        - CONCURRENT_MODIFICATION
        - ENDPOINT_UNREACHABLE
        - BRIDGE_UNREACHABLE
        - CLOUD_CONTROL_DISABLED
        - ENDPOINT_BUSY
        - ENDPOINT_LOW_POWER
        - AUTHORIZATION_CREDENTIAL_INVALID
        - AUTHORIZATION_CREDENTIAL_EXPIRED
        - INVALID_DIRECTIVE
        - INVALID_VALUE
        - VALUE_OUT_OF_RANGE
        - NOT_SUPPORTED_IN_CURRENT_MODE
        - RATE_LIMIT_EXCEEDED
        - PROVIDER_SERVICE_UNAVAILABLE
        - PROVIDER_TIMEOUT
        - PROVIDER_INTERNAL_ERROR
        - PRECONDITION_FAILED
        - PRECONDITION_REQUIRED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_KEY_IN_FLIGHT
        - IDEMPOTENCY_KEY_INVALID
        - GROUP_MERGED
        - MULTI_ROOM_UNSUPPORTED
        - MAP_NOT_ACTIVE
        - TARGET_UNSUPPORTED
        - TARGET_AMBIGUOUS
        - MESSAGE_UNSUPPORTED
        - UNKNOWN_INTERFACE
        - INVALID_CONFIGURATION
        - INVALID_ATTRIBUTE
        - PLUGIN_ROUTE_ID_CONFLICT
        - UNRESOLVED_REFERENCE
        - INVALID_RELATIONSHIP
        - RELATIONSHIP_CYCLE
        - MULTIPLE_PARENTS
      description: The error type, which is a specific type of error that belongs to a family of errors.  For example, a INVALID_TEMPERATURE_RANGE error is a specific type of error that belongs to the BAD_REQUEST family of errors.
    ErrorFamily:
      type: string
      enum:
        - NOT_FOUND
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - CONFLICT
        - PRECONDITION_FAILED
        - PRECONDITION_REQUIRED
        - PAYLOAD_TOO_LARGE
        - UNPROCESSABLE_ENTITY
        - LOCKED
        - TOO_MANY_REQUESTS
        - BAD_GATEWAY
        - SERVICE_UNAVAILABLE
        - GATEWAY_TIMEOUT
        - INTERNAL_SERVER_ERROR
        - REQUEST_INVALID
        - AUTHENTICATION
        - PERMISSION
        - ENDPOINT_NOT_FOUND
        - ENDPOINT_STATE_CONFLICT
        - ENDPOINT_UNAVAILABLE
        - RATE_LIMIT
        - PROVIDER_BAD_RESPONSE
        - PROVIDER_UNAVAILABLE
        - PROVIDER_TIMEOUT
      description: The error family
    Error:
      type: object
      description: Standard error response containing a message, error type, error family, and optional debug code.
      properties:
        message:
          type: string
          description: The error message
        type:
          $ref: '#/components/schemas/ErrorType'
        family:
          $ref: '#/components/schemas/ErrorFamily'
        code:
          type: string
          description: An opaque error code that can be given for debugging purposes.
        details:
          $ref: '#/components/schemas/PluginDispatchErrorDetails'
        errors:
          type: array
          description: |
            Every rejected item when a request that is validated item by item and applied atomically fails, such as a discovery `SynchronizationRequest` whose routes, group routes or relationships are rejected. Omitted for single-item failures.
          items:
            $ref: '#/components/schemas/SynchronizationItemError'
    TypeValue:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: The type identifier of the name value, defined as plain when not defined.
        value:
          type: string
          description: the raw value of a plain name.
    ApplicationInterfaceMessage:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the command
    ApplicationInterfaceAttribute:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the attribute
        value:
          description: the value of the attribute, this is an opaque resource object, so it can be any type of struct.
          type: object
          additionalProperties: true
    ApplicationInterface:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the interface
        version:
          type: string
          description: The version of the interface
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationInterfaceMessage'
          description: List of messages supported by the interface
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationInterfaceAttribute'
          description: List of attributes supported by the interface
        configuration:
          type: object
          additionalProperties: true
          description: Interface-specific configuration published for discovery and enumeration.
    Principal:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The unique identifier for the principal
          pattern: ^port1\.principal\..*
        ownerId:
          type: string
          description: The owner ID of the principal
        name:
          type: string
          description: The name of the principal
        googleEmail:
          type: string
          description: The Google email associated with the principal
        googleIdentity:
          type: string
          description: The Google identity associated with the principal
        appleEmail:
          type: string
          description: The Apple email associated with the principal
    ResourceGroupMemberType:
      type: string
      enum:
        - PRINCIPAL
        - GROUP
      description: The type of member (principal or nested group)
      x-enum-varnames:
        - ResourceGroupMemberPrincipal
        - ResourceGroupMemberGroup
    ResourceGroupMember:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: The ID of the member
        type:
          $ref: '#/components/schemas/ResourceGroupMemberType'
    ResourceGroupResourceType:
      type: string
      enum:
        - ENDPOINT
        - PLUGIN
        - FLOW
        - QUERY_STREAM
      description: The type of resource
      x-enum-varnames:
        - ResourceGroupResourceEndpoint
        - ResourceGroupResourcePlugin
        - ResourceGroupResourceFlow
        - ResourceGroupResourceQueryStream
    ResourceGroupResource:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: The ID of the resource
        type:
          $ref: '#/components/schemas/ResourceGroupResourceType'
    Permission:
      type: object
      required:
        - id
        - principalId
        - resourceType
        - resourceId
      properties:
        id:
          type: string
          description: The unique identifier for the permission
        principalId:
          type: string
          description: The ID of the associated principal
        resourceType:
          $ref: '#/components/schemas/AuthResourceType'
          description: The type of resource this permission grants access to
        resourceId:
          type: string
          description: The ID of the resource this permission grants access to
    ResourceGroup:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: The unique identifier for the resource group
          pattern: ^port1\.resourcegroup\..*
        name:
          type: string
          description: The name of the resource group
        owner:
          $ref: '#/components/schemas/Principal'
        members:
          type: array
          items:
            $ref: '#/components/schemas/ResourceGroupMember'
          description: List of members in the resource group
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceGroupResource'
          description: List of resources in the resource group
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: List of permissions attached to the resource group
    RouteInterface:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the interface
        version:
          type: string
          description: the version of the interface
        messages:
          type: array
          nullable: true
          minItems: 1
          description: Supported inbound message subset for the declared interface version. Omission or null retains the interface's full message contract; a supplied array must be nonempty and contain distinct canonical names for implemented messages.
          items:
            $ref: '#/components/schemas/ApplicationInterfaceMessage'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationInterfaceAttribute'
          description: Supported attribute subset. An omitted or empty list retains catalog-default behavior.
        configuration:
          type: object
          additionalProperties: true
          description: The configuration of the interface
    Route:
      type: object
      required:
        - id
        - associatedPluginId
        - associatedPluginRouteId
        - externalId
        - associatedAuthLinkId
        - associatedEndpointId
        - interfaces
        - ontologicalTypes
      properties:
        id:
          type: string
          description: |
            The persisted Port OS route identifier. Synchronized routes can receive a backend-generated, owner-scoped value here even when the discovery payload supplied an explicit route `id`; do not use this field as the stable plugin-owned route identity unless the synchronizing implementation explicitly documents preservation.
          pattern: ^port1\.route\..*
        associatedPluginId:
          type: string
          description: The ID of the associated plugin
        associatedPluginRouteId:
          type: string
          description: |
            The stable plugin-owned route identifier associated with this Port OS route. For synchronized plugin capability contracts and fixture parity checks, use this field to match a route from enumeration back to the discovery payload.
        externalId:
          type: string
          description: The external ID of the route given by the reporting system
        associatedAuthLinkId:
          type: string
          description: The ID of the associated auth link
        associatedEndpointId:
          type: string
          description: The ID of the associated endpoint
        name:
          $ref: '#/components/schemas/TypeValue'
          description: 'The name of the route as a human readable string or a localizable asset. This is either a raw string or a localizable asset reference. '
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/RouteInterface'
          description: List of interfaces supported by the route. These denote what the route is capable of performing such as turning off/on, etc.
        ontologicalTypes:
          type: array
          items:
            type: string
          description: List of ontological types for the route. These are used mostly for customers to know what an endpoint is, like if its a lightbulb, or a speaker, etc.
        pluginCustomMetadata:
          type: object
          additionalProperties: true
          description: A set of custom metadata that the plugin uses and attaches to the route, this is meant specifically for the plugin to use.
        description:
          $ref: '#/components/schemas/TypeValue'
          description: The description of the route as a human readable string or a localizable asset.
        manufacturer:
          $ref: '#/components/schemas/TypeValue'
          description: The manufacturer of the route as a human readable string or a localizable asset.
        model:
          $ref: '#/components/schemas/TypeValue'
          description: The model of the route as a human readable string or a localizable asset.
        serialNumber:
          $ref: '#/components/schemas/TypeValue'
          description: The serial number of the route as a human readable string or a localizable asset.
    AttributeState:
      type: object
      required:
        - namespace
        - name
        - value
      properties:
        namespace:
          type: string
          description: The capability interface namespace for this attribute
          example: port1/systems/zero/capability-interfaces/power
        name:
          type: string
          description: The name of the attribute within the namespace
          example: power-state
        value:
          type: object
          additionalProperties: true
          description: The attribute value payload, structure depends on the attribute schema
        version:
          type: string
          description: Version of the capability attribute schema used for this value.
          example: '1.0'
        sampledAt:
          type: string
          format: date-time
          description: Device or provider reported sample time in UTC. Omitted when the source did not report a sample time; fetching the value does not make an unknown or old sample fresh.
    Endpoint:
      type: object
      required:
        - id
        - name
        - type
        - interfaces
        - ownerId
        - enablement
      properties:
        enablement:
          type: string
          enum:
            - ENABLED
            - DISABLED
          default: ENABLED
          description: Disabled endpoints are hidden from collections by default and cannot send or receive device messages. Exact authorized metadata reads remain available.
        id:
          type: string
          description: The unique identifier for the endpoint
          pattern: ^port1\/principals\/.*\/endpoints\/.*
          example: port1\principals/123/endpoints/456
        name:
          $ref: '#/components/schemas/TypeValue'
          description: The name of the endpoint
        type:
          type: string
          description: The type of endpoint
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationInterface'
          description: List of interfaces supported by the endpoint
        ownerId:
          type: string
          description: The ID of the owner of the endpoint
        description:
          $ref: '#/components/schemas/TypeValue'
          description: The description of the route as a human readable string or a localizable asset.
        manufacturer:
          $ref: '#/components/schemas/TypeValue'
          description: The manufacturer of the route as a human readable string or a localizable asset.
        model:
          $ref: '#/components/schemas/TypeValue'
          description: The model of the route as a human readable string or a localizable asset.
        serialNumber:
          $ref: '#/components/schemas/TypeValue'
          description: The serial number of the route as a human readable string or a localizable asset.
        resourceGroups:
          type: array
          items:
            $ref: '#/components/schemas/ResourceGroup'
          description: List of associated resource groups
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
          description: List of associated routes
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeState'
          description: Device state attributes for this endpoint. Query responses populate this array when `GET /endpoints` is called with `expand=interfaces.attributes`; otherwise it remains the default shallow shape.
    EndpointsList:
      type: array
      items:
        $ref: '#/components/schemas/Endpoint'
    PaginationContext:
      type: object
      properties:
        maxResults:
          type: integer
          description: the maximum number of results to return.
        nextToken:
          type: string
          description: a token that can be used to get the next page of results.
    EndpointQueryResponseError:
      type: object
      description: Response-level error describing a partial deep endpoint-state query failure. These errors report deep-query item failures after endpoint enumeration has succeeded; they do not replace HTTP error responses for request-level failures.
      required:
        - location
        - type
        - family
        - message
      properties:
        location:
          type: string
          description: Approximate response location affected by the partial deep-query failure.
          example: endpoints/port1/principals/user123/endpoints/robot-1/routes/port1/principals/user123/routes/route-1
        type:
          type: string
          description: Stable machine-readable error type for client grouping and filtering.
          example: DEEP_QUERY_ERROR
        family:
          type: string
          description: Stable machine-readable error family for broader client grouping.
          example: ENDPOINT_STATE_QUERY
        message:
          type: string
          description: Human-readable failure message.
          example: failed to rebuild stateless metadata for route
    EndpointQueryResponse:
      type: object
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/EndpointsList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial deep-query failures collected while building expanded endpoint state. This field is present only when endpoint enumeration succeeded but one or more live attribute refresh items failed; request-level failures still use HTTP error responses.
          items:
            $ref: '#/components/schemas/EndpointQueryResponseError'
    UpsertEndpointRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The endpoint ID
        name:
          $ref: '#/components/schemas/TypeValue'
        type:
          type: string
          description: The endpoint type
    DeleteEndpointRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The endpoint ID to delete
    ModifyEndpointRequest:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          description: Endpoint to modify; merge source when mergeInto is provided.
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9 \-_]+$
        type:
          type: string
          description: A supported endpoint ontological type, such as light or plug.
        enablement:
          type: string
          enum:
            - ENABLED
            - DISABLED
        mergeInto:
          type: string
          description: Same-owner surviving endpoint. Routes and supported dependencies transfer atomically; the source remains disabled. Other supplied fields modify the survivor. No redirect from the source ID is created.
    QueryComparator:
      type: object
      properties:
        key:
          type: string
          description: The key to match on
        value:
          type: string
          description: The value to match on
    EndpointQueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          $ref: '#/components/schemas/Query'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        expand:
          type: array
          description: Expansion tokens that request related or computed endpoint fields.
          items:
            type: string
    Simulator:
      description: Legacy string-name application/json projection; default representation remains unchanged.
      allOf:
        - $ref: '#/components/schemas/SimulatorRecordFields'
        - type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Display name; legacy application/json projection of the canonical PLAIN name.
    SimulatorQueryResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Simulator'
          description: List of simulators
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    UpsertSimulatorRequest:
      description: Legacy string-name application/json projection; default representation remains unchanged.
      allOf:
        - $ref: '#/components/schemas/SimulatorSharedFields'
        - type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Display name; legacy application/json projection of the canonical PLAIN name.
            id:
              type: string
              description: The unique identifier for the simulator (optional; if provided, performs an update/upsert)
              pattern: ^port1\.simulator\..*
    DeleteSimulatorRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The principal-scoped simulator identifier, or a retained legacy simulator identifier.
          pattern: ^(port1/principals/[^/]+/endpoint-simulators/[^/]+|port1\.simulator\..+)$
    RoutesList:
      type: array
      items:
        $ref: '#/components/schemas/Route'
    EnumerateRoutesResponse:
      type: object
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/RoutesList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    UpsertRouteRequest:
      type: object
      required:
        - id
        - endpointId
        - pluginId
      properties:
        id:
          type: string
          description: The route ID
        endpointId:
          type: string
          description: The endpoint ID
        pluginId:
          type: string
          description: The plugin ID
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationInterface'
          description: List of interfaces to support
        metadata:
          type: object
          description: Additional metadata about the route
          properties:
            name:
              type: string
              description: The name of the route
            manufacturer:
              type: string
              description: The manufacturer of the device
            model:
              type: string
              description: The model of the device
    DeleteRouteRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The route ID to delete
    PluginType:
      type: string
      enum:
        - WEBSOCKET
        - HTTP
        - WEBSERVICE
        - APPLE_PUSH_NOTIFICATION
        - HOSTED_COMPUTE
        - LOCAL
    PluginAuthorization:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - OAUTH
            - API_KEY
            - NONE
          description: The type of authorization
    PluginEntry:
      type: object
      required:
        - name
        - region
        - uri
        - type
        - interfaces
        - authorization
      properties:
        name:
          type: string
          description: The name of the plugin entry
        region:
          type: string
          description: The region of the plugin entry
        uri:
          type: string
          description: The URI endpoint for the plugin
        type:
          type: string
          description: The type of the plugin entry
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationInterface'
          description: List of interfaces supported by the plugin
        authorization:
          $ref: '#/components/schemas/PluginAuthorization'
    DeviceInterface:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: The unique identifier for the device interface
        name:
          type: string
          description: The name of the interface
    PluginMetadataOAuth:
      type: object
      properties:
        clientId:
          type: string
          description: OAuth2 client ID
        clientSecret:
          type: string
          description: OAuth2 client secret. Only included when the caller explicitly requests expand=oauth.clientSecret and only for direct-variant plugins (never exposed for backend-proxy variants). Used by the website to complete PKCE token exchanges client-side.
        authorizeUrl:
          type: string
          description: OAuth2 authorization URL
        tokenUrl:
          type: string
          description: OAuth2 token URL
        scope:
          type: string
          description: OAuth2 scope
        requiresCodeVerifier:
          type: boolean
          description: Whether PKCE code verifier is required
        additionalAuthorizeParams:
          type: object
          additionalProperties:
            type: string
          description: Additional query parameters that the website appends to the OAuth2 authorization URL when redirecting the user to the provider's consent screen (e.g., access_type=offline, prompt=consent).
        oauthVariant:
          type: string
          enum:
            - direct
            - backend-proxy
          description: OAuth flow variant. "direct" means the website performs the full PKCE token exchange client-side. "backend-proxy" means the website sends the authorization code to the Port OS backend, which exchanges it for tokens on behalf of the user.
    PluginMetadataMultifactorField:
      type: object
      required:
        - key
        - label
        - type
      properties:
        key:
          type: string
          description: Field key identifier
        label:
          type: string
          description: Human-readable label for the field
        type:
          type: string
          description: Field input type
    PluginMetadataMultifactor:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/PluginMetadataMultifactorField'
          description: List of multifactor authentication fields
    PluginCapabilityInterface:
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
          description: Capability interface name
        version:
          type: string
          description: Capability interface version
    BasePlugin:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: The unique identifier for the plugin
        type:
          type: string
        name:
          $ref: '#/components/schemas/TypeValue'
        description:
          $ref: '#/components/schemas/TypeValue'
        owner:
          $ref: '#/components/schemas/Principal'
        resourceGroups:
          type: array
          items:
            $ref: '#/components/schemas/ResourceGroup'
          description: List of associated resource groups
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PluginEntry'
          description: List of plugin entries
        supportsEventSubscription:
          type: boolean
          description: Whether the plugin supports event subscription
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DeviceInterface'
          description: List of capabilities supported by the plugin
        displayName:
          type: string
          description: Human-readable display name from plugin metadata (populated when expand=metadata)
        icon:
          type: string
          description: Icon identifier from plugin metadata (populated when expand=metadata)
        authType:
          type: string
          enum:
            - oauth2
            - 2fa
            - api-key
            - api-key-endpoint
            - username-password
            - qr-code
            - code-link
            - none
          description: Authentication type from plugin metadata (populated when expand=metadata). "api-key" accepts a single API key; "api-key-endpoint" accepts both an API key and a custom endpoint URL (used for OpenAI-compatible providers where users bring their own base URL); "qr-code" uses an access-code + QR code scanning flow (e.g., Tuya Smart app).
        oauth:
          $ref: '#/components/schemas/PluginMetadataOAuth'
        multifactor:
          $ref: '#/components/schemas/PluginMetadataMultifactor'
        capabilityInterfaces:
          type: array
          items:
            $ref: '#/components/schemas/PluginCapabilityInterface'
          description: Capability interfaces from plugin metadata (populated when expand=metadata)
    WebsocketPlugin:
      allOf:
        - $ref: '#/components/schemas/BasePlugin'
        - type: object
          required:
            - connectionId
            - active
          properties:
            connectionId:
              type: string
              description: Unique identifier provided for a websocket by the websocket gateway
            active:
              type: boolean
              description: Whether the websocket connection is active
    OAuth2ConnectionData:
      type: object
      required:
        - clientId
        - clientSecret
