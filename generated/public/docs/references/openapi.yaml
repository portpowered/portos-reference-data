    SynchronizationRequest:
      type: object
      description: >
        Request payload for synchronizing plugin routes, group routes and their relationships with
        the system. When a route in this payload includes `id`, that value is advisory for
        synchronization and is not the stable identifier to assert after enumeration unless a
        specific implementation documents preservation. Newly persisted synchronized routes can
        receive backend-generated, owner-scoped Port OS route IDs; use each route's
        `associatedPluginRouteId` to match the stable plugin-owned or fixture route identity.
        Omitted group routes and relationships are not deletion instructions. Every reference must
        resolve to committed data or to an item in the same request.
      required:
        - routes
      properties:
        pluginIdentity:
          $ref: '#/components/schemas/ClientIdentity'
        authLinkIdentity:
          type: string
          description: The ID of the auth link
        routes:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ProviderDiscoveredRoute'
          description: >
            List of routes to synchronize. Route `id` values supplied here are not the stable plugin
            capability lookup surface after synchronization; match enumerated routes by
            `associatedPluginRouteId`.
        groupRoutes:
          type: array
          items:
            $ref: '#/components/schemas/GroupRoute'
          description: >
            Group routes (maps, rooms, provider groups) to create or update, keyed by
            `pluginRouteId` within the plugin and auth link.
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/PluginDiscoveryRelationship'
          description: Typed relationships between the reported routes and group routes.
    GroupRoute:
      type: object
      description: >
        A provider-reported group route (for example a vacuum map or room, a lighting room or a
        speaker group) as carried by discovery. It is shared by the route-discovery report message
        and `SynchronizationRequest.groupRoutes` so both decode to the same model.
      required:
        - pluginRouteId
        - name
      properties:
        pluginProfileId:
          type: string
          minLength: 1
          description: Stable group-route profile ID selected from the registered V2 plugin declaration.
        ontologicalTypes:
          type: array
          items:
            type: string
          description: >-
            Actual classifications of the native group route, constrained by its selected plugin
            profile for V2 discovery.
        pluginRouteId:
          type: string
          minLength: 1
          description: >
            Plugin-owned stable identifier of the group route. Must be unique across routes and
            group routes within one plugin and auth link.
        name:
          type: string
          description: The name of the associated group route
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/RouteInterface'
        memberPluginRouteIds:
          type: array
          uniqueItems: true
          items:
            type: string
          description: List of plugin route IDs that are members of this group route
        pluginCustomMetadata:
          type: object
          additionalProperties: true
          description: >
            Private plugin metadata (native map, segment or cloud room addressing) returned to the
            plugin on dispatch; never exposed as application data.
      additionalProperties: false
    PluginDiscoveryRelationship:
      type: object
      description: >
        A provider-reported relationship between typed port resources. Identity is `externalId`
        within the reporting plugin and auth link; resubmitting the same `externalId` updates the
        relationship. Omission from a later synchronization is not a deletion instruction.
      additionalProperties: false
      required:
        - externalId
        - type
        - source
        - target
      properties:
        externalId:
          type: string
          minLength: 1
          description: Plugin-owned stable identifier of the relationship.
        type:
          $ref: '#/components/schemas/RelationshipType'
        source:
          $ref: '#/components/schemas/PluginDiscoveryRelationshipVertex'
        target:
          $ref: '#/components/schemas/PluginDiscoveryRelationshipVertex'
        interfaces:
          type: array
          minItems: 1
          description: >-
            Optional interface applicability; used by `CAN_CONTROL` to declare which messages the
            source supports on the target.
          items:
            $ref: '#/components/schemas/RelationshipInterface'
    PluginDiscoveryRelationshipVertex:
      type: object
      description: >
        One end of a discovered relationship, addressed by plugin-owned identity within the
        reporting plugin and auth link. Exactly one of `pluginRouteId` (a route),
        `groupPluginRouteId` (a group route), `endpointId` or `groupId` must be set.
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        pluginRouteId:
          type: string
          minLength: 1
          description: The plugin route ID of a route reported in the same or an earlier synchronization.
        groupPluginRouteId:
          type: string
          minLength: 1
          description: The plugin route ID of a group route reported in the same or an earlier synchronization.
        endpointId:
          type: string
          minLength: 1
          description: The full ID of an endpoint owned by the reporting principal.
        groupId:
          type: string
          minLength: 1
          description: The full ID of a group owned by the reporting principal.
    RelationshipType:
      type: string
      description: >
        Typed relationship between port resources. `IS_PART_OF`: a resource is contained in a parent
        resource (acyclic). `CAN_CONTROL`: an endpoint or route can act on another resource with the
        listed interface messages; it never grants authorization. `LOCATED_IN`: an endpoint route is
        currently observed inside a group route; it is an observation, not membership. `MEMBER_OF`:
        an endpoint belongs to a group.
      enum:
        - IS_PART_OF
        - CAN_CONTROL
        - LOCATED_IN
        - MEMBER_OF
      x-enum-varnames:
        - RelationshipTypeIsPartOf
        - RelationshipTypeCanControl
        - RelationshipTypeLocatedIn
        - RelationshipTypeMemberOf
    RelationshipInterface:
      type: object
      description: >
        Capability-interface applicability of a relationship, for example the robotic-vacuum-cleaner
        messages a `CAN_CONTROL` edge supports on a room.
      additionalProperties: false
      required:
        - name
        - version
      properties:
        name:
          type: string
          minLength: 1
          description: The capability interface namespace.
          example: port1/systems/zero/capability-interfaces/robotic-vacuum-cleaner
        version:
          type: string
          minLength: 1
          description: The capability interface version.
          example: '1.0'
        messages:
          type: array
          uniqueItems: true
          description: >-
            Message names of the interface the relationship applies to. An explicit empty array
            applies to no messages. Omission retains every message supported by the source
            interface.
          items:
            type: string
            minLength: 1
          example:
            - clean-room
    ClientIdentity:
      type: object
      description: Identifies a plugin client by its type and unique identifier.
      required:
