              description: The OAuth access token
            refreshToken:
              type: string
              description: The OAuth refresh token
            pluginCustomMetadata:
              type: object
              additionalProperties: true
              description: A set of custom metadata that the plugin uses and attaches to the token, this is meant specifically for the plugin to use.
            expiresIn:
              type: integer
              description: The token expiration time in seconds
            scopes:
              type: string
              description: The OAuth scopes
    OauthClientCredentialSecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - clientId
            - clientSecret
          properties:
            clientId:
              type: string
              description: The OAuth client ID
            clientSecret:
              type: string
              description: The OAuth client secret
    ApplePushNotificationAuthTokenSecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - keyId
          properties:
            keyId:
              type: string
              description: The Apple Push Notification key ID
            authKey:
              type: string
              format: binary
              description: The Apple Push Notification private key (P8 file)
    PersonalAccessTokenSecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - accessToken
          properties:
            accessToken:
              type: string
              description: The access token
    CustomPluginSecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - secretPluginId
          properties:
            secretPluginId:
              type: string
              description: The ID of the plugin that the secret is associated with, all custom secrets must be associated with a plugin.
          additionalProperties: true
    ApiKeySecret:
      allOf:
        - $ref: '#/components/schemas/BaseSecret'
        - type: object
          required:
            - apiKey
          properties:
            apiKey:
              type: string
