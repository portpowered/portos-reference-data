          description: Device token for Apple Push Notification Service
        oauthTokens:
          type: object
          description: OAuth token credentials
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
        usernamePassword:
          type: object
          description: Username and password credentials
          properties:
            username:
              type: string
            password:
              type: string
        apiKey:
          type: string
          description: API key for service authentication (e.g. OpenRouter)
    EstablishAuthLinkResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The ID of the created auth link
    PluginAuthMultifactorExchangeRequest:
      type: object
      required:
        - pluginId
        - principalId
        - pluginAuthenticationData
      properties:
        pluginId:
          type: string
          description: The ID of the plugin for which we are attempting to receive the multifactor code for.
        principalId:
          type: string
          description: The ID of the principal to setup the auth link for, or alternatively ~self, when the target is the current user principal.
        pluginAuthenticationData:
          type: object
          additionalProperties: true
          description: The data to exchange the multifactor code with. This is opaque data that is bespoke to the plugin and the plugin's authentication flow.
    PluginAuthCodeExchangeRequest:
      type: object
      required:
        - pluginId
        - principalId
        - pluginAuthenticationData
      properties:
        pluginId:
          type: string
          description: The ID of the plugin for which we are attempting to exchange the code for an access token for.
        principalId:
          type: string
          description: The ID of the principal to exchange the code for an access token for, or alternatively ~self, when the target is the current user principal.
        pluginAuthenticationData:
          type: object
          additionalProperties: true
          description: The data to exchange the code with. This is opaque data that is bespoke to the plugin and the plugin's authentication flow.
    PluginAuthCodeLinkRequest:
      type: object
      additionalProperties: false
      required:
        - pluginId
        - principalId
      properties:
        pluginId:
          type: string
          minLength: 1
          description: Canonical ID of a plugin declaring code-link authentication.
        principalId:
          type: string
          enum:
            - ~self
          description: Start linking for the authenticated Port OS principal.
    PluginAuthCodeLinkResponse:
      type: object
      additionalProperties: false
      required:
        - sessionId
        - userCode
        - verificationUri
        - expiresIn
      properties:
        sessionId:
          type: string
          description: Opaque, principal-bound session ID used for plugin-auth-code-exchange. Not a vendor private code.
        userCode:
          type: string
          description: Public code the user enters on the vendor's verification page.
        verificationUri:
          type: string
          format: uri
          description: Vendor verification page where the user signs in and approves linking.
        expiresIn:
          type: integer
          minimum: 1
          description: Session lifetime in seconds. Expired sessions require starting again.
    EndpointGroupsList:
      type: array
      items:
        $ref: '#/components/schemas/EndpointGroup'
    CreateEndpointGroupItem:
      type: object
      description: |
        The client-supplied fields of a new endpoint group. Members are added afterwards with `add-members` or created together through `/endpoint-groups-manage` `create_group`. A user group name is `{"type": "PLAIN", "value": ...}` whose value is non-blank UTF-8 text of at most 256 bytes with no control characters; anything else is rejected with BAD_REQUEST.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          $ref: '#/components/schemas/TypeValue'
          description: The display name of the new endpoint group.
    CreateEndpointGroupRequest:
      type: object
      description: Request payload for creating a user endpoint group. The server assigns the ID, owner, etag and every derived field.
      additionalProperties: false
      required:
        - item
      properties:
        item:
          $ref: '#/components/schemas/CreateEndpointGroupItem'
    CreateEndpointGroupResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The created endpoint group ID
          examples:
            id:
              value: port1/systems/zero/endpoint-groups/123
    GroupRoutesList:
      type: array
      items:
        $ref: '#/components/schemas/EndpointGroupRoute'
    AccessControlRuleEffect:
      type: string
      enum:
        - ALLOW
        - DENY
    AccessControlRule:
      type: object
      required:
        - operation
        - resource
        - identity
        - effect
        - owner
      properties:
        id:
          type: string
          description: The ID of the access control rule
          example: port1/account/john/access-control-rule/123
        effect:
          $ref: '#/components/schemas/AccessControlRuleEffect'
        operation:
          type: string
          description: The operation that the identity is granted to perform on a resource. A Universal resource identifier namespaced under port1/endpoint/read
          example: port1/endpoint/read
        resource:
          type: string
          description: The resource permissions are granted to
          example: port1/user/alice/endpoint/thermostat-zero
        identity:
          type: string
          description: The identity permissions are granted to
          example: port1/account/john/user/alice
        owner:
          type: string
          description: The owner of the access control rule
          example: port1/account/john
    GetAccessControlRulesResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AccessControlRule'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    UpsertAccessControlRuleRequest:
      type: object
      required:
        - operation
        - resource
        - identity
        - effect
      properties:
        id:
          type: string
          description: |
            The ID of the access control rule to upsert on.
          example: port1/systems/zero/access-control-rules/123
        effect:
          $ref: '#/components/schemas/AccessControlRuleEffect'
        operation:
          type: string
          description: |
            The operation to grant access to.  This could be a read, write, delete, etc.  Please see the access controls list specification for all operations and their descriptions. 
          example:
            - port1/systems/zero/operations/flow-read
            - port1/systems/zero/operations/endpoint-name-update
            - port1/systems/zero/operations/endpoint-delete
        resource:
          type: string
          description: |
            The resource to grant access to.  This could be an endpoint, a flow, a secret, etc.  You can define this as either a class of resources, or a specific resource. 
            Examples: - port1/users/alice/endpoints/thermostat-zero grants access to that thermostat - port1/users/alice/flows/* grants access to all flows owned by alice
          example: port1/users/alice/endpoints/thermostat-zero
        identity:
          type: string
          description: |
            The identity to grant access to. This could be a user, a role, a group, etc. You can define this as either a class of identities, or a specific identity.
            Examples: - port1/account/john/users/alice grants access to alice - port1/account/john/users/* grants access to all users owned by john - * just grants access to all identities
          example: port1/account/john/users/alice
    UpsertAccessControlRuleResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The ID of the access control rule
          example: port1/account/john/access-control-rule/123
    AccessControlRequesterContext:
      type: object
      required:
        - requesterId
      properties:
        requesterId:
          type: string
          description: The ID of the requester
    AccessControlResourceContext:
      type: object
      required:
        - resourceId
      properties:
        resourceId:
          type: string
          description: The ID of the resource
    AccessControlEntity:
      type: object
      required:
        - id
        - owner
        - type
      properties:
        id:
          type: string
          description: The ID of the entity
        type:
          $ref: '#/components/schemas/AuthResourceType'
          description: The type of the entity
        owner:
          type: string
          description: The owner of the entity
        context:
          type: object
          additionalProperties: true
          description: Additional context for the entity
    EvaluateAccessControlRuleRequest:
      type: object
      description: Evaluate whether or not a request is allowed to be performed.
      required:
        - requests
      properties:
        requesterContext:
          $ref: '#/components/schemas/AccessControlRequesterContext'
        resourceContext:
          $ref: '#/components/schemas/AccessControlResourceContext'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/AccessControlEntity'
        operation:
          type: string
    EvaluateAccessControlRuleResult:
      type: string
      enum:
        - ALLOW
        - DENY
    EvaluateAccessControlRuleResponse:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/EvaluateAccessControlRuleResult'
        error:
          $ref: '#/components/schemas/Error'
    BaseSecret:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: The unique identifier for the secret
        type:
          type: string
          description: The secret type
        ownerId:
          type: string
          description: The owner ID of the secret
        owner:
          $ref: '#/components/schemas/Principal'
    OauthTokenSecret:
