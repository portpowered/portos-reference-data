openapi: 3.0.2
info:
  title: Portos API
  version: '1.0'
  description: >
    The Portos API is for turning on lights, playing music on your speaker, and managing your
    devices.
servers:
  - url: https://api.portoperatingsystem.com
    description: Pilot API. Discover its canonical OAuth issuer and resource before authorization.
  - url: http://localhost
security:
  - oauth2: []
  - bearerAuth: []
tags:
  - name: OAuth flows
    description: |
      Use OAuth flows to sign a person or an agent in to Port OS and get an
      access token for the other APIs.

      Port OS requires authorization for calls against its APIs. It uses OAuth
      to issue the tokens that authorize those calls, and it supports
      extensions that let agents connect automatically: Dynamic Client
      Registration, client information metadata documents, PKCE and others.

      This section covers discovery metadata, client registration, authorize
      and consent, and the callback that returns the authorization code.
      Registration alone grants no access to resources. Operation scopes
      restrict delegated authority in addition to the permission rules for
      principals and resources.
  - name: Tokens
    description: |
      Use tokens when you already have credentials and need an access token,
      or when you want to manage the long-lived tokens you hand to a CLI,
      device automation or agent.

      Tokens are JWTs vended by principals for token exchange. A principal may
      create tokens, and list and delete the tokens it owns. The raw JWT is
      returned only once at creation. Exchange it at the OAuth token endpoint
      for an access token, then refresh or revoke the grant there.
  - name: Principals
    description: |
      Use principals when you manage who can act in Port OS.

      Principals are people, endpoints, or organizations. They can perform
      actions on resources, and can be granted permissions to access
      resources.
  - name: Secrets
    description: |
      Use secrets to store a credential that Port OS needs to keep for you, such
      as a key a plugin uses to call a provider.

      A secret is a type of storage credential.
  - name: Clients
    description: |
      Use clients when you build an application that signs in to Port OS with
      OAuth and need to register it, rotate its secrets, or remove it.

      Clients are applications that can interact with Port OS.
  - name: Access control
    description: |
      Use access control to decide who can do what with a resource.

      Rules grant or deny permissions on a resource to principals. You can also
      evaluate a rule to check what a principal is allowed to do.
  - name: Endpoints
    description: |
      An endpoint is a device or service you can act on, such as a phone, TV,
      lightbulb or vacuum.

      Customers interact with endpoints whenever they want to control their
      lights or find where their phone is.

      Endpoints declare a set of capabilities. These capabilities denote what
      functions an endpoint has. For example, an endpoint that declares the
      power interface can be turned on and off. Similarly, the capability tells
      customers they can check whether the device is on or off.
  - name: Messages
    description: |
      Port OS allows you to send messages to things. 
      By sending messages to endpoints, customers can turn off lights, play music, etc. 
      A message is an object that is sent around in port OS between different endpoints. 
  - name: Plugins
    description: >
      A plugin is a receiver of messages. A plugin could be an HTTP connection, android device
      messenger, an MQTT connection, or anything else.

      Messages sent to endpoints are propagated through plugins.
  - name: Routes
    description: >
      A route is a part of an endpoint that denotes what types of interfaces the endpoint can
      support from a specific plugin. 

      Additionally, a route may describe the endpoint with metadata such as names, manufacturer
      name, model data, etc.
  - name: Endpoint Simulators
    description: >
      Endpoint Simulators lets customers simulate endpoints to test out their flows and
      integrations. 
  - name: Subscriptions
    description: >
      When a message gets sent to port OS, you may want to listen to it. 


      Customers can enable a subscription for a customer's events, and have the subscription
      published to a flow, a plugin, or endpoint. 


      This makes it so that subscriptions can trigger events. 
  - name: Auth Links
    description: |
      Auth Links are a way to link an endpoint to a plugin.
  - name: Endpoint Groups
    description: |
      An endpoint group is a way to group a set of endpoints.
  - name: Relationships
    description: Typed relationships between port resources.
  - name: Endpoint Group Routes
    description: |
      An endpoint group route is a way for a gropu of devices to be controlled at the same time.
  - name: Tuya
    description: >
      Tuya smart home integration endpoints for QR code-based device authentication. These endpoints
      interact with the Tuya IoT platform to generate QR codes and validate login tokens for linking
      Tuya accounts.
  - name: Infrastructure
    description: |
      Health checks and metrics. These are public endpoints that do not require authentication.
  - name: Events
    description: Operations for events.
  - name: Webhooks
    description: Operations for webhooks.
paths:
  /integration-requests:
    post:
      operationId: requestFutureIntegration
      tags:
        - Plugins
      summary: Join a future integration waitlist
      description: >-
        Records explicit consent to receive updates for the selected future device or AI
        integration. Adds the subscriber to the provider group without removing existing groups or
        reactivating unsubscribed contacts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: person@example.test
              pluginId: port1/systems/zero/plugins/715b7b85-311f-4851-8430-88bbac6dd3e7
              consent: true
            schema:
              $ref: '#/components/schemas/IntegrationRequest'
      responses:
        '201':
          description: Request saved
          content:
            application/json:
              example:
                status: REQUESTED
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - REQUESTED
                    x-enum-varnames:
                      - Requested
        '400':
          description: Invalid email, consent, or future plugin identifier
          content:
            application/json:
              example:
                message: Invalid email, consent, or future plugin identifier
                code: BAD_REQUEST
                family: BAD_REQUEST
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests; retry after the Retry-After interval
          content:
            application/json:
              example:
                message: Too many requests; retry after the Retry-After interval
                code: TOO_MANY_REQUESTS
                family: TOO_MANY_REQUESTS
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Waitlist temporarily unavailable; the client may retry
          content:
            application/json:
              example:
                message: Waitlist temporarily unavailable; the client may retry
                code: INTERNAL
                family: INTERNAL_SERVER_ERROR
              schema:
                $ref: '#/components/schemas/Error'
      x-portos-delegated: false
      x-portos-resource-permission: false
  /ping:
    get:
      operationId: ping
      tags:
        - Infrastructure
      summary: Health check
      description: >-
        Returns a 200 OK response indicating the server is running. Used by load balancers and
        monitoring systems to verify service availability.
      security: []
      responses:
        '200':
          description: Server is healthy
      x-portos-delegated: false
      x-portos-resource-permission: false
  /metrics:
    get:
      operationId: getMetrics
      tags:
        - Infrastructure
      summary: Prometheus metrics
      description: >-
        Returns server metrics in Prometheus text exposition format. This endpoint is intentionally
        unauthenticated so that Prometheus can scrape it.
      security: []
      responses:
        '200':
          description: Prometheus metrics retrieved successfully
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus text exposition format metrics
              example: pong
      x-portos-delegated: false
      x-portos-resource-permission: false
  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthAuthorizationServerMetadata
      tags:
        - OAuth flows
      summary: Discover OAuth and DCR endpoints
      security: []
      x-portos-delegated: false
      x-portos-resource-permission: false
      description: >-
        Discover the canonical issuer and endpoints for the deployed environment. Public REST grants
        use issuer as resource; MCP grants use issuer/mcp. CIMD client IDs must be public HTTPS
        metadata URLs. Registration is anonymous; device access requires user consent.
      responses:
        '200':
          description: Authorization server metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - issuer
                  - authorization_endpoint
                  - token_endpoint
                  - revocation_endpoint
                  - scopes_supported
                properties:
                  issuer:
                    type: string
                    format: uri
                  authorization_endpoint:
                    type: string
                    format: uri
                  token_endpoint:
                    type: string
                    format: uri
                  registration_endpoint:
                    type: string
                    format: uri
                    description: Advertised when new anonymous registration is enabled; omitted when disabled.
                  revocation_endpoint:
                    type: string
                    format: uri
                  jwks_uri:
                    type: string
                    format: uri
                  scopes_supported:
                    type: array
                    items:
                      type: string
                  code_challenge_methods_supported:
                    type: array
                    items:
                      type: string
                      enum:
                        - S256
                  token_endpoint_auth_methods_supported:
                    type: array
                    items:
                      type: string
                  client_id_metadata_document_supported:
                    type: boolean
                  authorization_response_iss_parameter_supported:
                    type: boolean
              example:
                issuer: https://auth.portoperatingsystem.com
                authorization_endpoint: https://auth.portoperatingsystem.com/oauth/authorize
                token_endpoint: https://auth.portoperatingsystem.com/auth/token
                revocation_endpoint: https://auth.portoperatingsystem.com/auth/revoke
                scopes_supported:
                  - endpoint:read
                  - message:send
                registration_endpoint: https://auth.portoperatingsystem.com/oauth/register
                jwks_uri: https://auth.portoperatingsystem.com/.well-known/jwks.json
                code_challenge_methods_supported:
                  - S256
                token_endpoint_auth_methods_supported:
                  - none
                client_id_metadata_document_supported: true
                authorization_response_iss_parameter_supported: true
  /.well-known/jwks.json:
    get:
      operationId: getJWKS
      tags:
        - OAuth flows
      summary: JSON Web Key Set
      description: >
        Returns the JSON Web Key Set (JWKS) containing the public keys used to verify JWT
        signatures. This endpoint is publicly accessible and does not require authentication.
        Responses are cached for one hour.
      security: []
      responses:
        '200':
          description: JWKS retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty:
                          type: string
                          description: Key type
                          example: RSA
                        alg:
                          type: string
                          description: Algorithm
                          example: RS256
                        kid:
                          type: string
                          description: Key ID
                        use:
                          type: string
                          description: Public key use
                          example: sig
                        'n':
                          type: string
                          description: RSA modulus (Base64url encoded)
                        e:
                          type: string
                          description: RSA exponent (Base64url encoded)
              example:
                key: value
      x-portos-delegated: false
      x-portos-resource-permission: false
  /.well-known/oauth-protected-resource:
    get:
      operationId: getOAuthProtectedResourceMetadata
      tags:
        - OAuth flows
      summary: OAuth protected resource metadata
      description: >
        Returns OAuth 2.0 Protected Resource Metadata as defined by RFC 9728. This endpoint is
        publicly accessible and does not require authentication. Responses are cached for one hour.
      security: []
      responses:
        '200':
          description: Protected resource metadata retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                    description: The protected resource identifier
                    example: https://api.portoperatingsystem.com/mcp
                  authorization_servers:
                    type: array
                    items:
                      type: string
                    description: Authorization servers that can issue tokens for this resource
                    example:
                      - https://auth.portoperatingsystem.com
                  scopes_supported:
                    type: array
                    items:
                      type: string
                    description: Scopes supported by this resource
                    example:
                      - mcp:read
                      - mcp:write
                      - mcp:admin
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                    description: Methods supported for presenting bearer tokens
                    example:
                      - header
              example:
                key: value
      x-portos-delegated: false
      x-portos-resource-permission: false
  /.well-known/oauth-protected-resource/mcp:
    get:
      operationId: getMCPOAuthProtectedResourceMetadata
      tags:
        - OAuth flows
      summary: MCP OAuth protected resource metadata
      description: >
        Returns OAuth 2.0 Protected Resource Metadata for the MCP endpoint as defined by RFC 9728.
        This endpoint is publicly accessible and does not require authentication. Responses are
        cached for one hour.
      security: []
      responses:
        '200':
          description: MCP protected resource metadata retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                    description: The protected resource identifier
                    example: https://api.portoperatingsystem.com/mcp
                  authorization_servers:
                    type: array
                    items:
                      type: string
                    description: Authorization servers that can issue tokens for this resource
                    example:
                      - https://auth.portoperatingsystem.com
                  scopes_supported:
                    type: array
                    items:
                      type: string
                    description: Scopes supported by this resource
                    example:
                      - mcp:read
                      - mcp:write
                      - mcp:admin
                  bearer_methods_supported:
                    type: array
                    items:
                      type: string
                    description: Methods supported for presenting bearer tokens
                    example:
                      - header
              example:
                key: value
      x-portos-delegated: false
      x-portos-resource-permission: false
  /endpoints:
    get:
      operationId: enumerateEndpoints
      tags:
        - Endpoints
      description: |
        List the endpoints that a customer has access to. For example, you
        enumerate to list the customer's lights, vacuums, or similar devices.

        Endpoints contain information such as:
          1. The endpoint's name, description, and other top-level data.
          2. The capabilities the endpoint has, like power, camera, etc.
          3. The state of the endpoint.

        Usage of the API is controlled by the query parameters. By default it
        lists enabled endpoints owned by the authenticated user. Type and
        serialNumber filters stay within that scope. An explicit owner can select
        another owner's endpoints when the caller can read them.

        An exact id lookup takes precedence over the owner, type, serialNumber, and
        enablement filters. It can return a readable shared endpoint, including a
        disabled one, but still requires endpoint-read permission.

        To retrieve the state of a specific endpoint, send `id=<endpoint-id>`
        together with `expand=interfaces.attributes`. Add
        `forceDeviceAttributeQuery=true` to refresh that state from the device
        before the response is returned.
      parameters:
        - $ref: '#/components/parameters/EnablementQuery'
        - $ref: '#/components/parameters/OwnerQuery'
        - name: id
          in: query
          description: >-
            The unique identifier of a specific endpoint to retrieve. When provided, this exact-ID
            filter takes precedence over owner, type, serialNumber and enablement filters. It can
            return a shared or disabled endpoint when the caller has endpoint-read permission.
          required: false
          schema:
            type: string
          examples:
            endpoint-id:
              value: port1/principals/example/endpoints/light-1
        - name: type
          in: query
          description: Filter endpoints by their primary type
          required: false
          schema:
            type: string
          examples:
            type-filter:
              value: LIGHT
        - name: serialNumber
          in: query
          description: Filter endpoints by their serial number
          required: false
          schema:
            type: string
          examples:
            serial-number-filter:
              value: SN-12345
        - name: nextToken
          in: query
          description: >-
            Opaque server-issued continuation token. Repeat the same selection, page size,
            expansion, force-refresh setting and authenticated grant. Modified, expired or
            differently bound tokens return 400; restart without nextToken.
          required: false
          schema:
            type: string
            minLength: 1
          examples:
            next-token:
              value: OPAQUE_TOKEN_FROM_PREVIOUS_RESPONSE
        - name: maxResults
          in: query
          description: The maximum number of results to return, from 1 through 100.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          examples:
            max-results:
              value: 10
        - name: expand
          in: query
          description: |
            Expand determines what data we retrieve for each endpoint.

            Use `interfaces.attributes` to populate each endpoint's `attributes`
            array so you can, for example, find their states.

            When omitted, the response returns only a limited set of data.
          required: false
          schema:
            type: array
            uniqueItems: true
            maxItems: 1
            items:
              type: string
              enum:
                - interfaces.attributes
          examples:
            deep-interface-attributes:
              value:
                - interfaces.attributes
          style: form
          explode: false
        - name: forceDeviceAttributeQuery
          in: query
          description: |
            Forces a live device-backed attribute refresh for endpoint-state
            queries.

            This makes Port OS call into the device to get its data, if the device
            provider does not update the state automatically.

            This flag is only applied when `expand` includes
            `interfaces.attributes`. Send `true` to force the refresh; absent or
            `false` values use stored state. Invalid values, or `true` without
            the required expansion, return 400.
          required: false
          schema:
            type: boolean
          examples:
            forced-deep-query:
              value: true
      responses:
        '200':
          description: >-
            Endpoints retrieved successfully. Responses without `expand=interfaces.attributes`
            return the default shallow endpoint shape. Responses with that expansion populate deep
            attribute state in each endpoint's `attributes` array. If endpoint enumeration succeeds
            but one or more forced deep-query items fail, the response can include an `errors` array
            describing those partial state-refresh failures; request-level failures still use HTTP
            error responses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointQueryResponse'
              examples:
                partial-deep-query-failure:
                  value:
                    results:
                      - id: port1/principals/user123/endpoints/robot-1
                        name:
                          type: plain
                          value: Downstairs Vacuum
                        type: robotic-vacuum-cleaner
                        interfaces:
                          - name: port1/systems/zero/capability-interfaces/robotic-vacuum-cleaner
                        attributes: []
                        ownerId: port1/principals/user123
                        enablement: ENABLED
                    paginationContext: {}
                    errors:
                      - location: >-
                          endpoints/port1/principals/user123/endpoints/robot-1/routes/port1/principals/user123/routes/route-1
                        code: DEEP_QUERY_FAILED
                        family: INTERNAL_SERVER_ERROR
                        message: failed to rebuild stateless metadata for route
                empty:
                  value:
                    results:
                      - id: port1/principals/example/endpoints/light-1
                        name:
                          type: PLAIN
                          value: Office light
                        type: LIGHT
                        interfaces: []
                        ownerId: port1/principals/example
                        enablement: ENABLED
        '400':
          description: Missing or malformed endpoint query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Bad request - missing required parameters
                code: BAD_REQUEST
                family: BAD_REQUEST
        '401':
          description: Unauthorized - invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized - invalid or missing authentication token
                code: UNAUTHORIZED
                family: AUTHENTICATION
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Internal server error
                code: INTERNAL
                family: INTERNAL_SERVER_ERROR
      x-portos-delegated: true
      x-portos-resource-permission: true
      security:
        - oauth2:
            - endpoint:read
        - bearerAuth: []
      summary: Enumerate Endpoints
    post:
      operationId: upsertEndpoint
      tags:
        - Endpoints
      description: Creates or updates an endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertEndpointRequest'
            example:
              id: port1/principals/example/endpoints/light-1
              name:
                type: PLAIN
                value: Office light
              type: LIGHT
      responses:
        '200':
          description: Endpoint upserted successfully
        '400':
          description: Invalid request payload
        '500':
          description: Internal server error
      x-portos-delegated: true
      x-portos-resource-permission: true
      security:
        - oauth2:
            - endpoint:write
        - bearerAuth: []
      summary: Upsert Endpoint
    patch:
      operationId: modifyEndpoint
      tags:
        - Endpoints
      description: >-
        Apply endpoint partial metadata, enablement or merge changes in one SQLite transaction. At
        least one field besides id is required. An empty 202 is returned only after commit; clients
        may requery metadata. Endpoint updated notifications are best effort. A merge cannot cross
        owners or silently rewrite unsupported dependencies; conflicts roll back all changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyEndpointRequest'
            example:
              id: port1/principals/user123/endpoints/abc-123
              name: Lounge lamp
              type: LIGHT
              enablement: ENABLED
      responses:
        '202':
          description: Endpoint modification committed; empty response.
        '400':
          description: Invalid partial update or incompatible merge.
        '401':
          description: Authentication required.
        '403':
          description: Endpoint management or dependency permission denied.
        '404':
          description: Endpoint not found.
        '409':
          description: Dependent state prevents merge; nothing changed.
        '500':
          description: Modification failed before commit.
        '503':
          description: >-
            ENDPOINT_COMMITTED_CLEANUP_PENDING. The modification committed, but required active-work
            cleanup is pending. Re-read source and target before retrying.
      x-portos-delegated: true
      x-portos-resource-permission: true
      security:
        - oauth2:
            - endpoint:write
        - bearerAuth: []
      summary: Modify Endpoint
    delete:
      operationId: deleteEndpoint
      tags:
        - Endpoints
      description: Deletes an endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEndpointRequest'
            example:
              id: port1/principals/example/endpoints/light-1
      responses:
        '200':
          description: Endpoint deleted successfully
        '400':
          description: Invalid request payload
        '500':
          description: Internal server error
      x-portos-delegated: true
      x-portos-resource-permission: true
      security:
        - oauth2:
            - endpoint:write
        - bearerAuth: []
      summary: Delete Endpoint
  /endpoint-query:
    post:
      operationId: endpointQuery
      tags:
        - Endpoints
      description: >-
        Return a bounded page of authorized endpoints matching the shared Query expression. An empty
        query and filters such as type or interfaces default to enabled endpoints owned by the
        caller. An explicit ownerId, groupId, or required exact id selector can include readable
        endpoints owned by others; endpoint-read permission is still required for each result.
        Collections exclude disabled endpoints unless enablement is filtered, while a query that
        requires specific exact endpoint IDs can return disabled endpoint metadata without an
        enablement filter. See the request schema for supported fields and operators. Use groupId to
        select members of a readable room/group, then intersect type or declared interfaces to
        select lights. Group predicates additionally require group:read for delegated OAuth. Repeat
        the complete query settings and grant when following nextToken; cursors expire after fifteen
        minutes. Device attributes are returned only when expanded. Report per-target command
        acceptance and observed state separately; querying a group does not grant permission to
        control its members.
      x-portos-conditional-scopes:
        groupId:
          - group:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointQueryRequest'
            example:
              query:
                match:
                  key: type
                  value: LIGHT
              paginationContext:
                maxResults: 10
      responses:
        '200':
          description: Endpoints retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointQueryResponse'
              example:
                results: []
        '400':
          description: Invalid query, unsupported expansion, or invalid/expired/mismatched cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Bad request - missing required parameters
                code: BAD_REQUEST
                family: BAD_REQUEST
        '401':
          description: Unauthorized - invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Unauthorized - invalid or missing authentication token
                code: UNAUTHORIZED
                family: AUTHENTICATION
        '403':
          description: Missing conditional OAuth scope or permission to read a referenced group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Permission to read the requested group is required.
                code: FORBIDDEN
                family: FORBIDDEN
        '404':
          description: A referenced group does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Requested group was not found.
                code: NOT_FOUND
                family: NOT_FOUND
        '409':
          description: A selected disabled endpoint cannot be forcibly refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: endpoint messaging is disabled
                code: ENDPOINT_DISABLED
                family: CONFLICT
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Internal server error
                code: INTERNAL
                family: INTERNAL_SERVER_ERROR
      x-portos-delegated: true
      x-portos-resource-permission: true
      security:
