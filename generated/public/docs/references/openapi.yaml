        results:
          $ref: '#/components/schemas/PrincipalsList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    UpsertPrincipalRequest:
      type: object
      required:
        - items
      properties:
        item:
          $ref: '#/components/schemas/Principal'
    UpsertPrincipalResponse:
      type: object
      required:
        - id
      properties:
        result:
          $ref: '#/components/schemas/Principal'
    GenerateTokenRequest:
      type: object
      required:
        - grant_type
        - client_id
      properties:
        grant_type:
          type: string
          description: |
            The OAuth grant type. Use authorization_code for code exchange, or urn:ietf:params:oauth:grant-type:refresh_token to exchange a vended JWT (from POST /tokens) for an access token.
        client_id:
          type: string
          description: The client ID (e.g. port1/systems/zero/oauth-clients/custom-access-token for token vending).
        client_secret:
          type: string
          description: Required for confidential clients. Public DCR/CIMD clients omit this field and use PKCE.
        code:
          type: string
          description: Authorization code; required when grant_type is authorization_code.
        refresh_token:
          type: string
          description: The vended JWT from POST /tokens; required when grant_type is urn:ietf:params:oauth:grant-type:refresh_token.
        redirect_uri:
          type: string
          description: Redirect URI; required when grant_type is authorization_code.
        code_verifier:
          type: string
          description: Original PKCE verifier; required for public-client code exchange.
        resource:
          type: string
          format: uri
          description: Exact resource from authorization; canonical issuer for REST or issuer/mcp for MCP. Required for DCR and CIMD.
        scope:
          type: string
          description: Optional narrower subset during refresh; cannot add scopes.
    GenerateTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: The access token
        token_type:
          type: string
          description: The token type
        expires_in:
          type: integer
          description: The token expiration time in seconds
        refresh_token:
          type: string
          description: Rotating refresh credential for resource-bound grants; store privately.
        scope:
          type: string
          description: Granted space-separated scopes.
    TokenListItem:
      type: object
      description: A token in a list response (no raw JWT).
      properties:
        id:
          type: string
          description: Token identifier (same as JWT jti).
        subject:
          type: string
          description: Principal path that is the subject of the token.
        created_at:
          type: string
          format: date-time
          description: When the token was created (ISO 8601).
        expires_at:
          type: string
          format: date-time
          description: When the token expires (ISO 8601).
        client_id:
          type: string
          description: OAuth client ID for the token (e.g. custom-access-token client).
        scope:
          type: string
          description: Space-separated scopes, if any.
        label:
          type: string
          description: Human-readable label, if set.
    TokenList:
      type: array
      items:
        $ref: '#/components/schemas/TokenListItem'
    EnumerateTokensResponse:
      type: object
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/TokenList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    CreateTokenRequest:
      type: object
      description: Request body for creating a token (JWT) for token exchange.
      properties:
        subject:
          type: string
          description: |
            Identity for the token. Use ~self for the current user (resolved to the authenticated principal at create time). May be another principal path if policy allows.
        expires_in:
          type: integer
          description: Lifetime of the token in seconds. Optional; defaults to 3600 (1 hour).
        scope:
          type: string
          description: |
            Space-separated scopes. Optional; default no scopes. See scopes documentation for allowed values and semantics.
        label:
          type: string
          description: Optional human-readable label for the token (e.g. "CLI token").
    CreateTokenResponse:
      type: object
      required:
        - id
        - token
        - expires_at
      description: |
        Response when a token is created. The raw JWT (token) is returned only once; store it securely. Use id for list/delete and in the DELETE URL.
      properties:
        id:
          type: string
          description: Token identifier (same as JWT jti). Use for list/delete and in the DELETE URL.
        token:
          type: string
          description: The raw JWT. Returned only once at creation; cannot be retrieved again.
        expires_at:
          type: string
          format: date-time
          description: When the token expires (ISO 8601).
    InvalidateTokenResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Confirmation message (e.g. "Token invalidated successfully").
    Token:
      type: object
      properties:
        accessToken:
          type: string
          description: The access token
        refreshToken:
          type: string
          description: The refresh token
    OAuthErrorResponse:
      type: object
      required:
        - error
        - error_description
      description: |
        Standard OAuth 2.0 error response format. Used for error responses in OAuth-related endpoints.
      properties:
        error:
          type: string
          description: OAuth error code
          enum:
            - invalid_request
            - invalid_client
            - invalid_scope
            - invalid_grant
            - server_error
          example: invalid_request
        error_description:
          type: string
          description: Human-readable description of the error
          example: user_code is required
    DeviceAuthorizationRequest:
      type: object
      required:
        - client_id
      properties:
        client_id:
          type: string
          description: The OAuth client identifier
        scope:
          type: string
          description: Space-separated list of scopes requested by the client
          example: read write
    DeviceAuthorizationResponse:
      type: object
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_in
        - interval
      properties:
        device_code:
          type: string
          description: The device verification code used to poll the token endpoint
        user_code:
          type: string
          description: The user verification code displayed to the user
        verification_uri:
          type: string
          description: The URI where the user should enter the user code
          example: https://portpowered.com/oauth/device/verify
        verification_uri_complete:
          type: string
          description: The complete URI including the user code (optional, for convenience)
          example: https://portpowered.com/oauth/device/verify?user_code=ABC123
        expires_in:
          type: integer
          description: The lifetime in seconds of the device_code and user_code
          example: 1800
        interval:
          type: integer
          description: The minimum amount of time in seconds that the client should wait between polling requests
          example: 5
    OAuthScope:
      type: string
      enum:
        - endpoint:read
        - endpoint:write
        - message:read
        - message:send
        - secret:read
        - secret:write
        - flow:read
        - flow:write
        - flow:trigger
        - principal:read
        - principal:write
        - subscription:read
        - subscription:write
        - access-control-rule:read
        - access-control-rule:write
        - group:read
        - group:manage
      description: |
        OAuth 2.0 scope values that can be requested by clients. Delegated REST scopes bound operations before the owning service evaluates resource policy. A scope is an upper bound, not a resource permission or an automatic Cedar grant. Each scope follows the pattern "resource:action" where resource indicates the resource type and action indicates the permitted operation (read, write, send, trigger).
    GenerateOAuthCodeRequest:
      type: object
      required:
        - client_id
        - redirect_uri
      properties:
        client_id:
          type: string
          description: OAuth client identifier
          example: port1/principals/user123/oauth-clients/my-client
        redirect_uri:
          type: string
          description: Redirect URI to return to after authorization
          example: https://myapp.com/callback
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthScope'
        code_challenge:
          type: string
          description: PKCE code challenge (required if client requires PKCE)
          example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method:
          type: string
          enum:
            - S256
            - plain
          description: PKCE code challenge method (S256 or plain)
          example: S256
        state:
          type: string
          description: Optional state parameter for CSRF protection
          example: xyz123
    GenerateOAuthCodeResponse:
      type: object
      required:
        - code
        - expiryInSeconds
      description: 'Response from the /oauth/generate-code endpoint.  This endpoint is used by the website to generate an authorization code for the client to exchange for an access token.  When the customer receives the code, they are expected to call the port OS /auth/token OAUTH API to exchange the code for an access token. '
      properties:
        code:
          type: string
          description: 'Authorization code that can be exchanged for an access token via the /auth/token endpoint. '
          example: abc123def456ghi789
        expiryInSeconds:
          type: integer
          description: Expiry time in seconds (typically 600 seconds / 10 minutes)
          example: 600
    DynamicClientMetadata:
      type: object
      required:
        - redirect_uris
        - token_endpoint_auth_method
      properties:
        client_name:
          type: string
          maxLength: 200
          description: Unverified display name.
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            format: uri
            maxLength: 2048
        token_endpoint_auth_method:
          type: string
          enum:
            - none
        grant_types:
          type: array
          maxItems: 2
          items:
            type: string
            enum:
              - authorization_code
              - refresh_token
        response_types:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum:
              - code
        scope:
          type: string
          default: endpoint:read
          description: Space-separated subset of endpoint:read endpoint:write message:read message:send group:read group:manage subscription:read subscription:write.
        client_uri:
          type: string
          maxLength: 2048
          description: Unverified descriptive URL; never fetched as evidence.
        software_id:
          type: string
          maxLength: 200
          description: Unverified software claim.
        software_version:
          type: string
          maxLength: 100
        software_statement:
          type: string
          description: Unsupported; rejected if supplied.
    OAuthProtocolError:
      type: object
      required:
        - error
        - error_description
      properties:
        error:
          type: string
          description: Stable OAuth protocol error identifier.
        error_description:
          type: string
          description: Human-readable recovery guidance.
    ValidateOAuthRequestRequest:
      type: object
      required:
        - client_id
        - redirect_uri
      properties:
        client_id:
          type: string
          description: OAuth client identifier
          example: port1/principals/user123/oauth-clients/my-client
        redirect_uri:
          type: string
          description: Redirect URI to validate
          example: https://myapp.com/callback
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/OAuthScope'
          description: Requested scopes to validate
        code_challenge:
          type: string
          description: PKCE code challenge (required if client requires PKCE)
          example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method:
          type: string
          enum:
            - S256
            - plain
          description: PKCE code challenge method (S256 or plain)
          example: S256
    ValidateOAuthRequestResponse:
      type: object
