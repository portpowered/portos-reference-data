          $ref: '#/components/schemas/EndpointsList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: >-
            Partial deep-query failures collected while building expanded endpoint state. This field
            is present only when endpoint enumeration succeeded but one or more live attribute
            refresh items failed; request-level failures still use HTTP error responses.
          items:
            $ref: '#/components/schemas/EndpointQueryResponseError'
