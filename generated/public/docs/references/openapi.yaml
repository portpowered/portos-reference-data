          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PROVIDER_SERVICE_UNAVAILABLE
                family: PROVIDER_UNAVAILABLE
                message: The provider service is temporarily unavailable.
