    OAuthClientsList:
      type: array
      description: A list of registered OAuth clients.
      items:
        $ref: '#/components/schemas/OAuthClient'
    EnumerateOAuthClientsResponse:
      type: object
      description: Paginated response containing a list of registered OAuth clients.
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/OAuthClientsList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
        errors:
          type: array
          description: Partial query errors collected while returning available results.
          items:
            $ref: '#/components/schemas/Error'
    CreateOAuthClientResponse:
      type: object
      description: Response returned after successfully creating a new OAuth client.
      required:
        - clientId
        - clientSecret
      properties:
        clientId:
          type: string
          description: The created OAuth client ID
        clientSecret:
          type: string
          description: >
            The OAuth client secret (only returned on creation). This is the secret string known
            only to the client and the authorization server, used for authenticating the client. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2.2
        clientSecretExpiresAt:
          type: integer
          description: >
            An integer indicating the expiration time of the client secret, represented as the
            number of seconds since the Unix epoch (1970-01-01T00:00:00Z). A value of 0 indicates
            that the secret does not expire. See
            https://datatracker.ietf.org/doc/html/rfc7591#section-2.2
    UpdateOAuthClientResponse:
      type: object
      description: Response returned after successfully updating an OAuth client.
      required:
        - clientId
      properties:
        clientId:
          type: string
          description: The updated OAuth client ID
    OAuthClientSecretInfo:
      type: object
      description: Active masked OAuth client secret metadata. No plaintext or hash is returned.
      required:
        - id
        - clientId
        - maskedPreview
        - createdAt
      properties:
        id:
          type: string
          description: Opaque child identifier scoped to the selected OAuth client.
        clientId:
          type: string
          description: Full OAuth client identifier.
        maskedPreview:
          type: string
          description: Masked preview that cannot be used to authenticate.
        createdAt:
          type: string
          description: Creation timestamp, or an empty string when not recorded.
    ListOAuthClientSecretsResponse:
      type: object
      required:
        - secrets
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/OAuthClientSecretInfo'
    GenerateOAuthClientSecretResponse:
      type: object
      description: >-
        New OAuth client secret returned once. Plaintext must not be retained in ordinary client
        metadata.
      required:
        - secretId
        - clientSecret
      properties:
        secretId:
          type: string
          description: Opaque child identifier scoped to the selected OAuth client.
        clientSecret:
          type: string
          description: Plaintext client secret returned once.
    EnablementFilter:
      type: string
      description: |
        Which resources a collection returns by enablement. ENABLED returns resources
        Port OS is using, DISABLED returns the ones the customer turned off, and '*'
        returns both.
      enum:
        - ENABLED
        - DISABLED
        - '*'
      default: ENABLED
      x-enum-varnames:
        - EnablementFilterENABLED
        - EnablementFilterDISABLED
        - EnablementFilterAll
    Enablement:
      type: string
      description: >
        Whether Port OS uses an endpoint or group. A disabled one is hidden from collections by
        default and cannot be sent device messages or targeted by them; exact authorized reads still
        return it. Rediscovery never changes it, so disabling is how a user hides a discovered
        device or room for good.
      enum:
        - ENABLED
        - DISABLED
      default: ENABLED
      x-enum-varnames:
        - EnablementENABLED
        - EnablementDISABLED
    TypeValue:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: The type identifier of the name value, defined as plain when not defined.
        value:
          type: string
          description: the raw value of a plain name.
    ApplicationInterfaceMessage:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the command
    ApplicationInterfaceAttribute:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the attribute
        value:
          description: >-
            the value of the attribute, this is an opaque resource object, so it can be any type of
            struct.
          type: object
          additionalProperties: true
    ApplicationInterface:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the interface
        version:
          type: string
          description: The version of the interface
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationInterfaceMessage'
          description: Supported message subset. An omitted or empty list declares no supported messages.
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationInterfaceAttribute'
          description: Supported attribute subset. An omitted or empty list declares no supported attributes.
        configuration:
          type: object
          additionalProperties: true
          description: Interface-specific configuration published for discovery and enumeration.
    Principal:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: The unique identifier for the principal
          pattern: ^port1/[^/]+/[^/]+$
        ownerId:
          type: string
          description: The owner ID of the principal
        name:
          type: string
          description: The name of the principal
        googleEmail:
          type: string
          description: The Google email associated with the principal
        googleIdentity:
          type: string
          description: The Google identity associated with the principal
        appleEmail:
          type: string
          description: The Apple email associated with the principal
    ResourceGroupMemberType:
      type: string
      enum:
        - PRINCIPAL
        - GROUP
      description: The type of member (principal or nested group)
      x-enum-varnames:
        - ResourceGroupMemberPrincipal
        - ResourceGroupMemberGroup
