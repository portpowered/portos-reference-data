      summary: Complete pending consent with a signed user session
      description: >-
        The website uses this endpoint after sign-in. Agents open the authorization URL and wait for
        the user; they never manufacture the user session.


        Requires a signed user/session or the existing authenticated client flow. The anonymous DCR
        delegated device profile cannot invoke this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - request_id
                - approved
              properties:
                request_id:
                  type: string
                approved:
                  type: boolean
                scope:
                  type: string
            example:
              request_id: SERVER_ISSUED_PENDING_REQUEST_ID
              approved: true
      responses:
        '200':
          description: >-
            One-time browser continuation URL. Navigate the browser to receive a 302 to the
            registered callback.
          content:
            application/json:
              schema:
                type: object
                required:
                  - redirect_url
                properties:
                  redirect_url:
                    type: string
                    format: uri
              example:
                redirect_url: >-
                  https://auth.portoperatingsystem.com/oauth/authorization-response?request_id=SERVER_ISSUED_RESPONSE_ID
        '400':
          description: Invalid, expired or consumed request.
        '401':
          description: User sign-in required.
      x-portos-delegated: false
  /oauth/authorization-request:
