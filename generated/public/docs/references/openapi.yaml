              example:
                message: Conflict
                code: CONFLICT
                family: CONFLICT
        '412':
          description: >-
            The If-Match etag does not match the current auth link version; re-read the link and
            retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: auth link etag does not match; re-read the auth link and retry
                code: PRECONDITION_FAILED
                family: PRECONDITION_FAILED
        '428':
          description: >-
            The If-Match header is missing, or is the wildcard *; send the etag of the draft you
            last read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: If-Match header is required; send the auth link etag
                code: PRECONDITION_REQUIRED
                family: PRECONDITION_REQUIRED
      x-portos-delegated: false
      x-portos-resource-permission: true
