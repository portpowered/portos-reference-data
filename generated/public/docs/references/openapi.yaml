      summary: Open user consent for a resource-bound public client
      description: |
        Browser entry for registered DCR or CIMD clients. Redirects to the
        sign-in and consent UI. The client must start its registered callback listener
        first, generate random state and an S256 challenge, and wait for the user.
        Validate callback state and iss before exchanging the code. CIMD client IDs
        must match the deployment allowlist; arbitrary client metadata URLs are rejected.
      parameters:
        - in: query
          name: client_id
          required: true
          schema:
            type: string
          description: The client_id of the requested resource.
        - in: query
          name: redirect_uri
          required: true
          schema:
            type: string
            format: uri
          description: The redirect_uri of the requested resource.
        - in: query
          name: response_type
          required: true
          schema:
            type: string
            x-enum-exempt: >-
              OAuth 2.0 response_type is the externally defined case-sensitive value code (RFC
              6749).
            enum:
              - code
          description: The response_type of the requested resource.
        - in: query
          name: scope
          required: true
          schema:
            type: string
          description: The scope of the requested resource.
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: The state of the requested resource.
        - in: query
          name: resource
          required: false
          schema:
            type: string
            format: uri
          description: Canonical issuer for REST or issuer/mcp for MCP. Omission defaults to REST.
        - in: query
          name: code_challenge
          required: true
          schema:
            type: string
          description: The code_challenge of the requested resource.
        - in: query
          name: code_challenge_method
          required: true
          schema:
            type: string
            enum:
              - S256
          description: The code_challenge_method of the requested resource.
      responses:
        '302':
          description: Navigate to sign-in and pending consent.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: Invalid or unsupported OAuth request.
