            type: string
          description: The type of principal
        - name: principalId
          required: true
          in: path
          schema:
            type: string
          description: The ID of the principal
        - name: groupId
          required: true
          in: path
          schema:
            type: string
          description: The ID of the endpoint group to retrieve
        - name: expand
          in: query
          description: >-
            Expansion tokens that request related or computed fields for the returned resource. Use
            `interfaces.attributes` to populate the group's `attributes` array with the stored
            values of its group routes.
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          examples:
            include-related:
              value:
                - metadata
            group-route-state:
              value:
                - interfaces.attributes
        - name: forceDeviceAttributeQuery
          in: query
          description: >-
            Asks each provider for fresh values of the group routes before the response is returned.
            Only applied when `expand` includes `interfaces.attributes`. Absent, invalid or `false`
            values return the stored values. A forced read includes only attributes refreshed by
            that request. If any provider fails, the request returns `500 DEEP_QUERY_FAILED` instead
            of presenting stored values as fresh.
          required: false
          schema:
            type: boolean
          examples:
            forced-deep-query:
              value: true
