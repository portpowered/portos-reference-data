        - flowlinks
        - flow-runs
        - principals
        - systems
        - accounts
        - access-control-rules
        - tokens
        - secrets
        - auth-links
        - oauth-clients
        - plugins
        - endpoints
        - endpoint-simulators
        - endpoint-groups
        - virtual-endpoint-groups
        - endpoint-group-routes
        - routes
        - device-interfaces
        - application-interfaces
        - messages
        - subscriptions
        - plugin-subscription
        - views
      example: endpoints
    Query:
      type: object
      description: Shared Port OS query AST modeled as a recursive JSON graph supporting match, comparison, pattern, freeform, and boolean operators.
      properties:
        match:
          description: Match data between fields
          $ref: '#/components/schemas/QueryComparator'
        lessThan:
          description: Less than comparison
          $ref: '#/components/schemas/QueryComparator'
        greaterThan:
          description: Greater than comparison
          $ref: '#/components/schemas/QueryComparator'
        and:
          type: array
          description: match all fields in the array
          items:
            $ref: '#/components/schemas/Query'
        or:
          type: array
          items:
            $ref: '#/components/schemas/Query'
        patternMatch:
          type: string
          description: Pattern for REGEX queries (e.g., "*.json")
          example: '*.json'
        freeformMatch:
          type: string
          description: Freeform query string for natural language searches
          example: notes about meeting yesterday
        not:
          description: Negate the inner query (NOT wraps a single child query)
          $ref: '#/components/schemas/Query'
    EndpointGroup:
      type: object
      description: A logical grouping of endpoints that share common interfaces and ownership.
      required:
        - id
        - name
        - ownerId
        - interfaces
        - etag
      properties:
        id:
          type: string
          description: The unique identifier for the endpoint group
          pattern: ^port1\/principals\/.*\/groups\/.*
          example: port1/principals/123/groups/456
        name:
          $ref: '#/components/schemas/TypeValue'
          description: The name of the endpoint group
        ownerId:
          type: string
          description: The ID of the owner of the endpoint group
        memberEndpointIds:
          type: array
          items:
            type: string
          description: List of member endpoint IDs of the endpoint group
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationInterface'
          description: List of interfaces supported by the endpoint group
        etag:
          type: string
          description: |
            Opaque strong entity tag of this group version, for example `"12"`. It changes on any committed write to the group, its group routes or its relationships. Send it as `If-Match` (or as the operation `etag` in `/endpoint-groups-manage`) when mutating the group.
          example: '"12"'
        redirectedFrom:
          type: string
          description: |
            Set when the group was read through a merged-away ID: the ID that was requested, which now redirects to this group. Mutations must use this group's `id`.
        parentGroupId:
          type: string
          description: The canonical parent group derived from `IS_PART_OF` relationships, when the group has one.
        childGroupIds:
          type: array
          items:
            type: string
          description: Canonical child groups derived from `IS_PART_OF` relationships.
        controllers:
          type: array
          items:
            $ref: '#/components/schemas/EndpointGroupController'
          description: Endpoints that declare `CAN_CONTROL` on one of this group's group routes, with the messages they support on it.
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/GroupRouteAttributeState'
          description: 'The group''s state: every attribute value stored for its group routes, one entry per group route and attribute, tagged with the group route and provider. Populated only when the read is called with `expand=interfaces.attributes`.'
    EndpointGroupRoute:
      type: object
      description: A route within an endpoint group linking a plugin route to a group with interface metadata.
      required:
        - id
        - associatedGroupId
        - associatedPluginId
        - associatedPluginRouteId
        - associatedAuthLinkId
        - ownerId
        - interfaces
      properties:
        id:
          type: string
          description: The unique identifier for the group route
          pattern: ^port1\/principals\/.*\/group-routes\/.*
          example: port1/principals/123/group-routes/456
        associatedGroupId:
          type: string
          description: The ID of the associated endpoint group
          pattern: ^port1\/principals\/.*\/groups\/.*
        associatedPluginId:
          type: string
          description: The ID of the associated plugin
        associatedPluginRouteId:
          type: string
          description: |
            The stable plugin-owned route identifier associated with this group route. Use this value, not the Port OS group route `id`, when matching group route membership back to synchronized plugin or fixture route identities.
        associatedAuthLinkId:
          type: string
          description: The ID of the associated auth link
        ownerId:
          type: string
          description: The ID of the owner of the group route
        memberPluginRouteIds:
          type: array
          items:
            type: string
          description: List of member plugin route IDs of the group route
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/RouteInterface'
          description: List of interfaces supported by the group route
        pluginCustomMetadata:
          type: object
          additionalProperties: true
          description: A set of custom metadata that the plugin uses and attaches to the group route, this is meant specifically for the plugin to use.
    EnumerateEndpointGroupsResponse:
      type: object
      description: Paginated response containing a list of endpoint groups.
      required:
        - results
      properties:
        results:
          $ref: '#/components/schemas/EndpointGroupsList'
        paginationContext:
          $ref: '#/components/schemas/PaginationContext'
