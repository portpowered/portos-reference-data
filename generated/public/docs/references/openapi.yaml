              enum:
                - LIGHT
                - LOCK
                - SENSOR
                - THERMOSTAT
                - TV
                - CAMERA
                - VACUUM
                - COLORED_LIGHT
                - SWITCH
                - PLUG
                - FAN
                - CLOSURE
                - WINDOW_COVERING
                - CONTACT_SENSOR
                - HUMIDITY_SENSOR
                - LIGHT_SENSOR
                - STANDALONE_TEMPERATURE_SENSOR
                - AIR_QUALITY_SENSOR
                - CO_SENSOR
                - COOKTOP
                - DISHWASHER
                - MICROWAVE_OVEN
                - OVEN
                - REFRIGERATOR
                - EXTRACTOR_HOOD
                - LAUNDRY_WASHER
                - LAUNDRY_DRYER
                - AUDIO_PLAYER
                - MEDIA_PLAYER
                - MEDIA_PROVIDER
                - SPEAKER
                - TEXT_MESSAGE_RECEIVER
                - CALENDAR_PROVIDER
                - KEYPAD
                - LOCATION_TRACKER
                - SMOKE_ALARM
                - SECURITY_PANEL
                - PET_FEEDER
              x-enum-varnames:
                - Light
                - Lock
                - Sensor
                - Thermostat
                - Tv
                - Camera
                - Vacuum
                - ColoredLight
                - Switch
                - Plug
                - Fan
                - Closure
