          type: string
          description: Endpoint to modify; merge source when mergeInto is provided.
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9 \-_]+$
        type:
          type: string
          description: A supported endpoint ontological type, such as light or plug.
        enablement:
          $ref: '#/components/schemas/Enablement'
        mergeInto:
          type: string
          description: >-
            Same-owner surviving endpoint. Routes and supported dependencies transfer atomically;
            the source remains disabled. Other supplied fields modify the survivor. No redirect from
            the source ID is created.
    QueryComparator:
      type: object
      properties:
        key:
          type: string
          description: The key to match on
        value:
          type: string
          description: The value to match on
    EndpointQueryRequest:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          description: >-
            A bounded shared Query expression. By default, an empty object and filters such as type
            or interfaces select enabled endpoints owned by the caller. An explicit ownerId,
            groupId, or required exact id selector can include readable endpoints owned by others;
            endpoint-read permission is still required for every result. This endpoint supports
            match, and, or, and not. Scalar match keys are id, name, type, ownerId, manufacturer,
            model, serialNumber, and enablement. interfaces matches membership in the endpoint's
            declared interface names; groupId matches membership in a readable endpoint group.
            Comparisons, patterns, freeform search, unknown keys, ambiguous nodes, expressions
            deeper than eight levels, or more than 64 nodes return 400. Values are exact strings.
            Collections exclude disabled endpoints unless the expression filters enablement. A query
            that requires specific exact endpoint IDs can also return disabled endpoint metadata
            without an enablement filter, subject to endpoint-read permission. A groupId predicate
            additionally requires group:read for delegated OAuth and read permission on that group.
          allOf:
            - $ref: '#/components/schemas/Query'
        paginationContext:
          type: object
          additionalProperties: false
          properties:
            maxResults:
              type: integer
              minimum: 1
              maximum: 100
              default: 10
              description: Maximum authorized matching endpoints in this page.
            nextToken:
              type: string
              minLength: 1
              description: >-
                Opaque server-issued continuation token. Repeat the same query, page size,
                expansions, forceDeviceQuery setting, and authenticated grant. Modified, expired, or
                differently bound tokens return 400; restart without nextToken. Follow nextToken
                until absent, including empty pages.
        expand:
          type: array
          uniqueItems: true
          maxItems: 1
          description: Optional reported state expansion; only interfaces.attributes is supported.
          items:
            type: string
            enum:
              - interfaces.attributes
            x-enum-exempt: Existing published REST expansion token shared with GET /endpoints.
        forceDeviceQuery:
          type: boolean
          default: false
          description: >-
            Refresh reported device attributes for the selected page. Requires expand to contain
            interfaces.attributes. An accepted command is not proof of device state; inspect the
            returned sample times and partial errors. Disabled endpoints cannot be forcibly
            refreshed.
