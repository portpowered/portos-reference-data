          APPLE_PUSH_NOTIFICATION_CREDENTIALS: '#/components/schemas/ApplePushNotificationAuthTokenSecret'
          PERSONAL_ACCESS_TOKEN: '#/components/schemas/PersonalAccessTokenSecret'
          CUSTOM_PLUGIN_SECRET: '#/components/schemas/CustomPluginSecret'
          API_KEY: '#/components/schemas/ApiKeySecret'
    SecretsList:
      type: array
