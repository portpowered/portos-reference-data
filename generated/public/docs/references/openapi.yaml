        Supplying id selects the exact subscription and still applies its read permission. The
        default page size is 10 and the maximum is 100; results use nextToken pagination.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnumerateSubscriptionsResponse'
              example:
                results: []
                paginationContext:
                  nextToken: abc123
        '400':
          description: Invalid query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: maxResults must be between 1 and 100; choose a value in that range and retry.
                code: BAD_REQUEST
                family: BAD_REQUEST
        '401':
          description: Unauthorized — invalid or missing authentication token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  The authentication token is missing or invalid; sign in with a valid token and
                  retry.
                code: UNAUTHORIZED
                family: AUTHENTICATION
        '403':
          description: Forbidden — insufficient permissions for the requested owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: >-
                  You cannot read subscriptions for the requested owner; choose an owner you can
                  access or request read permission.
                code: INSUFFICIENT_PERMISSIONS
                family: PERMISSION
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Internal server error
                code: INTERNAL
                family: INTERNAL_SERVER_ERROR
      parameters:
        - name: id
          in: query
          description: Exact subscription ID to retrieve, subject to the caller's read permission.
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/OwnerQuery'
        - $ref: '#/components/parameters/ExpandQuery'
        - $ref: '#/components/parameters/NextTokenQuery'
        - $ref: '#/components/parameters/MaxResultsQuery'
