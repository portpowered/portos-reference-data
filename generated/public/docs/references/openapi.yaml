          example: The living room bridge is offline.
        details:
          $ref: '#/components/schemas/PluginDispatchErrorDetails'
      example:
        type: ENDPOINT_UNREACHABLE
        family: ENDPOINT_UNAVAILABLE
        code: device-offline
        message: The device is not reachable.
        details:
