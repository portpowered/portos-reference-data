      description: Possession of the matching refresh token proves revocation authority. The endpoint invalidates the grant family; it does not delete the client or other users' grants.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - token
                - client_id
              properties:
                token:
                  type: string
                client_id:
                  type: string
      responses:
        '200':
          description: Grant revoked or token was already invalid.
        '400':
          description: Invalid request or client mismatch.
        '503':
          description: Revocation storage unavailable; do not claim success.
