    schema: /docs/references/capability-interfaces/control-route-groups-provider/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/control-route-groups-provider/1.0.md
  - id: port1/systems/zero/capability-interfaces/control-routes-provider
    version: '1.0'
    description: >-
      Control route providers carry dispatch results and attribute reports between an integration
