    guide: /docs/for-ai/capability-interfaces/doorbell/1.0.md
  - id: port1/systems/zero/capability-interfaces/electrical-conductivity-sensor
    version: '1.0'
    description: >-
      Electrical conductivity measurements report a sensor reading. Use the value and its declared
