    schema: /docs/references/capability-interfaces/ozone-concentration-sensor/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/ozone-concentration-sensor/1.0.md
  - id: port1/systems/zero/capability-interfaces/percentage
    version: '1.0'
    description: >-
      Percentage controls set or adjust a percentage and report the current value. Use them for
