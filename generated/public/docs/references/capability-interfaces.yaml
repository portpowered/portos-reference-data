    schema: /docs/references/capability-interfaces/control-routes-provider/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/control-routes-provider/1.0.md
  - id: port1/systems/zero/capability-interfaces/cooktop
    version: '1.0'
    description: >-
      Cooktops report their operational state. Use that state to show what the appliance is doing or
      supply context to an automation.
    schema: /docs/references/capability-interfaces/cooktop/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/cooktop/1.0.md
  - id: port1/systems/zero/capability-interfaces/dishwasher
    version: '1.0'
    description: >-
      Dishwashers report their operational state. Use it to keep an appliance dashboard up to date
      or react when a reported state changes.
    schema: /docs/references/capability-interfaces/dishwasher/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/dishwasher/1.0.md
  - id: port1/systems/zero/capability-interfaces/doorbell
    version: '1.0'
    description: >-
      Doorbells emit a chime event. Use that event to start a notification or another flow when
