    guide: /docs/for-ai/capability-interfaces/formaldehyde-concentration-sensor/1.0.md
  - id: port1/systems/zero/capability-interfaces/humidity-sensor
    version: '1.0'
    description: >-
      Humidity sensors report relative humidity. Use the reading to display room conditions or
