    guide: /docs/for-ai/capability-interfaces/extractor-hood/1.0.md
  - id: port1/systems/zero/capability-interfaces/fan-control
    version: '1.0'
    description: >-
      Fan control selects a fan mode and speed. Read the reported settings to check how a fan is
