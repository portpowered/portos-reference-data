    schema: /docs/references/capability-interfaces/oven/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/oven/1.0.md
  - id: port1/systems/zero/capability-interfaces/ozone-concentration-sensor
    version: '1.0'
    description: >-
      Ozone measurements report the concentration observed by a sensor. Use the reading and its
