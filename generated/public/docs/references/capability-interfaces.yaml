    guide: /docs/for-ai/capability-interfaces/flows/1.0.md
  - id: port1/systems/zero/capability-interfaces/formaldehyde-concentration-sensor
    version: '1.0'
    description: >-
      Formaldehyde measurements report the concentration observed by a sensor. Use the reading and
