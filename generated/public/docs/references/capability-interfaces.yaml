    guide: /docs/for-ai/capability-interfaces/keypad-input/1.0.md
  - id: port1/systems/zero/capability-interfaces/laundry-dryer
    version: '1.0'
    description: >-
      Laundry dryers report their operational state. Use it to show the current appliance status or
