    schema: /docs/references/capability-interfaces/laundry-dryer/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/laundry-dryer/1.0.md
  - id: port1/systems/zero/capability-interfaces/laundry-washer
    version: '1.0'
    description: >-
      Laundry washers report their operational state. Use it to keep a laundry dashboard in step
