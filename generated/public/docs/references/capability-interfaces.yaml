    schema: /docs/references/capability-interfaces/ph-sensor/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/ph-sensor/1.0.md
  - id: port1/systems/zero/capability-interfaces/pm10-concentration-sensor
