    guide: /docs/for-ai/capability-interfaces/recordings/1.0.md
  - id: port1/systems/zero/capability-interfaces/refrigerator
    version: '1.0'
    description: >-
      Refrigerators report their temperature. Use the reading to show the conditions supplied by the
      appliance.
    schema: /docs/references/capability-interfaces/refrigerator/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/refrigerator/1.0.md
  - id: port1/systems/zero/capability-interfaces/reminders-provider
    version: '1.0'
    description: >-
      Reminder providers list reminders from a connected account. Use the returned items to give an
      assistant task context or display an existing reminder list.
    schema: /docs/references/capability-interfaces/reminders-provider/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/reminders-provider/1.0.md
  - id: port1/systems/zero/capability-interfaces/remote-control
    version: '1.0'
    description: >-
      Remote control starts and ends control sessions and sends movement instructions. Use velocity,
      turning, and duration fields to request movement from a connected device.
    schema: /docs/references/capability-interfaces/remote-control/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/remote-control/1.0.md
  - id: port1/systems/zero/capability-interfaces/robotic-vacuum-cleaner
    version: '1.0'
    description: >-
      Robotic vacuum cleaners start, pause, stop, and return to their dock. Set a cleaning mode and
      read the reported mode and operational state to follow a cleaning session.
    schema: /docs/references/capability-interfaces/robotic-vacuum-cleaner/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/robotic-vacuum-cleaner/1.0.md
  - id: port1/systems/zero/capability-interfaces/route-discovery
    version: '1.0'
    description: >-
      Route discovery reports the control routes available to an integration. Use its group commands
      to name a group or update the routes that belong to it.
    schema: /docs/references/capability-interfaces/route-discovery/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/route-discovery/1.0.md
  - id: port1/systems/zero/capability-interfaces/rtc-session
    version: '1.0'
    description: >-
      RTC sessions initiate a connection using an offer and return an answer for the session. Follow
      disconnection events and close the session when the connection is no longer needed.
    schema: /docs/references/capability-interfaces/rtc-session/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/rtc-session/1.0.md
  - id: port1/systems/zero/capability-interfaces/rtsp-session
    version: '1.0'
    description: >-
      RTSP sessions open a camera connection and return its RTSP URI and optional SDP description.
      Close the session when the connection is no longer needed.
    schema: /docs/references/capability-interfaces/rtsp-session/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/rtsp-session/1.0.md
  - id: port1/systems/zero/capability-interfaces/scene
    version: '1.0'
    description: >-
      Scenes activate or deactivate a predefined device scene. Use them to request a saved
      combination of settings from a connected integration.
    schema: /docs/references/capability-interfaces/scene/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/scene/1.0.md
  - id: port1/systems/zero/capability-interfaces/security-panel
    version: '1.0'
    description: >-
      Security panels accept arm and disarm commands and report alarm and arming states. Use those
      reports to show the status supplied by a connected panel.
    schema: /docs/references/capability-interfaces/security-panel/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/security-panel/1.0.md
  - id: port1/systems/zero/capability-interfaces/security-pin
    version: '1.0'
    description: >-
      Security PINs create, update, query, and delete PIN records. Follow operation results and PIN
      reports when managing the records supported by a device.
    schema: /docs/references/capability-interfaces/security-pin/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/security-pin/1.0.md
  - id: port1/systems/zero/capability-interfaces/smoke-co-alarm
    version: '1.0'
    description: >-
      Smoke and carbon monoxide detectors report detection state. Devices expose alarm controls
      through the alarm capability and charge level through the battery capability.
    schema: /docs/references/capability-interfaces/smoke-co-alarm/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/smoke-co-alarm/1.0.md
  - id: port1/systems/zero/capability-interfaces/snapshot
    version: '1.0'
    description: >-
      Snapshots request a captured view and return a snapshot response. Use them when an integration
      needs a single capture rather than a continuous live view.
    schema: /docs/references/capability-interfaces/snapshot/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/snapshot/1.0.md
  - id: port1/systems/zero/capability-interfaces/soil-moisture-sensor
    version: '1.0'
    description: >-
      Soil moisture measurements report the reading supplied by a connected sensor. Use the value as
      input when monitoring growing conditions.
    schema: /docs/references/capability-interfaces/soil-moisture-sensor/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/soil-moisture-sensor/1.0.md
  - id: port1/systems/zero/capability-interfaces/spatial
    version: '1.0'
    description: >-
      Descriptive spatial declaration of a group route (home, floor/map, room or zone). The spatial
      interface declares no control messages; cleaning is sent to the robot endpoint.
    schema: /docs/references/capability-interfaces/spatial/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/spatial/1.0.md
  - id: port1/systems/zero/capability-interfaces/speaker
    version: '1.0'
    description: >-
      Speakers set or adjust volume and change mute state. Read the current volume and mute state to
      keep playback controls in step with the device.
    schema: /docs/references/capability-interfaces/speaker/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/speaker/1.0.md
  - id: port1/systems/zero/capability-interfaces/speech-audio-generation
    version: '1.0'
    description: >-
      Speech audio generation turns an input into speech audio and returns its URI. Use the result
      when an integration needs an audio file it can pass to a player.
    schema: /docs/references/capability-interfaces/speech-audio-generation/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/speech-audio-generation/1.0.md
  - id: port1/systems/zero/capability-interfaces/speech-synthesizer
    version: '1.0'
    description: >-
      Speech synthesizers accept a request to speak. Use them to send spoken output to a connected
      device or integration.
    schema: /docs/references/capability-interfaces/speech-synthesizer/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/speech-synthesizer/1.0.md
  - id: port1/systems/zero/capability-interfaces/temperature-sensor
    version: '1.0'
    description: >-
      Temperature sensors report temperature and operation mode. Use the reading to display
      conditions or give a heating and cooling flow a measured input.
    schema: /docs/references/capability-interfaces/temperature-sensor/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/temperature-sensor/1.0.md
  - id: port1/systems/zero/capability-interfaces/text
    version: '1.0'
    description: >-
      Text sends a text message to a connected component. Use it to pass written input between
      integrations.
    schema: /docs/references/capability-interfaces/text/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/text/1.0.md
  - id: port1/systems/zero/capability-interfaces/text-stream
    version: '1.0'
    description: >-
      Text streams emit text as a stream of messages. Use the stream to consume output as it becomes
      available.
    schema: /docs/references/capability-interfaces/text-stream/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/text-stream/1.0.md
  - id: port1/systems/zero/capability-interfaces/thermostat
    version: '1.0'
    description: >-
      Thermostats set a target temperature and select a heating or cooling mode. Read the reported
      setpoints and operating mode to show the current settings.
    schema: /docs/references/capability-interfaces/thermostat/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/thermostat/1.0.md
  - id: port1/systems/zero/capability-interfaces/water-heater
    version: '1.0'
    description: >-
      Water heaters set a temperature and operating mode. Read the temperature setpoint and mode to
      show the settings supplied by a connected heater.
    schema: /docs/references/capability-interfaces/water-heater/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/water-heater/1.0.md
  - id: port1/systems/zero/capability-interfaces/wind-speed-sensor
    version: '1.0'
    description: >-
      Wind speed measurements report the reading supplied by a connected sensor. Use the value and
      its declared unit when displaying measured wind conditions.
    schema: /docs/references/capability-interfaces/wind-speed-sensor/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/wind-speed-sensor/1.0.md
  - id: port1/systems/zero/capability-interfaces/window
    version: '1.0'
    description: >-
      Windows report their window state and lock state. Use those reports to check the status
      supplied by a connected window.
    schema: /docs/references/capability-interfaces/window/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/window/1.0.md
  - id: port1/systems/zero/capability-interfaces/window-covering
    version: '1.0'
    description: >-
      Window coverings move to a requested lift or tilt percentage. Read their reported position to
      keep a shade or blind control in step with the device.
    schema: /docs/references/capability-interfaces/window-covering/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/window-covering/1.0.md
