interfaces:
  - id: port1/systems/zero/capability-interfaces/air-quality-sensor
    version: '1.0'
    description: >-
      Air quality reports the air-quality index measured by a device. Use the reading to understand
      conditions in a room and decide when to run ventilation or another automation.
    schema: /docs/references/capability-interfaces/air-quality-sensor/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/air-quality-sensor/1.0.md
  - id: port1/systems/zero/capability-interfaces/alarm
    version: '1.0'
    description: >-
      Alarms ring, silence, or test a device's siren when supported. Read the alarm state to see
      whether the siren is active.
    schema: /docs/references/capability-interfaces/alarm/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/alarm/1.0.md
  - id: port1/systems/zero/capability-interfaces/application-launcher
    version: '1.0'
    description: >-
      Application launchers start and stop applications on a connected device. Check the available
      applications and the current selection before choosing what to launch.
    schema: /docs/references/capability-interfaces/application-launcher/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/application-launcher/1.0.md
  - id: port1/systems/zero/capability-interfaces/authorization
    version: '1.0'
    description: >-
      Authorization connects an integration to an account and keeps its credentials up to date. Use
      token refresh and authorization reports to follow the connection as it changes.
    schema: /docs/references/capability-interfaces/authorization/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/authorization/1.0.md
  - id: port1/systems/zero/capability-interfaces/barrier-control
    version: '1.0'
    description: >-
      Barrier control opens, closes, or positions a connected barrier. Read its position and state
      to check a garage door or gate before sending the next command.
    schema: /docs/references/capability-interfaces/barrier-control/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/barrier-control/1.0.md
  - id: port1/systems/zero/capability-interfaces/battery
    version: '1.0'
    description: >-
      Battery reports a connected device's charge level and battery health. Use it to show when a
      device needs charging or a replacement battery.
    schema: /docs/references/capability-interfaces/battery/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/battery/1.0.md
  - id: port1/systems/zero/capability-interfaces/brightness
    version: '1.0'
    description: >-
      Brightness sets how bright a connected device should be and reports its current level. Use it
      to dim a light for the evening or restore a brighter setting for work.
    schema: /docs/references/capability-interfaces/brightness/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/brightness/1.0.md
  - id: port1/systems/zero/capability-interfaces/calendar-provider
    version: '1.0'
    description: >-
      Calendar providers list events from a connected calendar. Use the returned events to give an
      assistant schedule context or build an automation around an upcoming appointment.
    schema: /docs/references/capability-interfaces/calendar-provider/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/calendar-provider/1.0.md
  - id: port1/systems/zero/capability-interfaces/camera
    version: '1.0'
    description: >-
      Cameras provide streaming, event images, and camera controls. Start a stream, adjust pan and
      tilt when supported, or configure motion detection for the view you need.
    schema: /docs/references/capability-interfaces/camera/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/camera/1.0.md
  - id: port1/systems/zero/capability-interfaces/carbon-dioxide-concentration-sensor
    version: '1.0'
    description: >-
      Carbon dioxide measurements report the concentration observed by a sensor, including its
      minimum and maximum readings. Use them to track changes in indoor conditions over time.
    schema: /docs/references/capability-interfaces/carbon-dioxide-concentration-sensor/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/carbon-dioxide-concentration-sensor/1.0.md
  - id: port1/systems/zero/capability-interfaces/carbon-monoxide-concentration-sensor
    version: '1.0'
    description: >-
      Carbon monoxide measurements report the concentration observed by a sensor, including its
      minimum and maximum readings. Use the reported values as input to monitoring and notification
      flows.
    schema: /docs/references/capability-interfaces/carbon-monoxide-concentration-sensor/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/carbon-monoxide-concentration-sensor/1.0.md
  - id: port1/systems/zero/capability-interfaces/channel
    version: '1.0'
    description: >-
      Channel controls select a channel or skip between channels on a connected device. Read the
      current channel to keep the interface in step with what is playing.
    schema: /docs/references/capability-interfaces/channel/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/channel/1.0.md
  - id: port1/systems/zero/capability-interfaces/cleaning-mode
    version: '1.0'
    description: >-
      Cleaning types, suction levels and water flows the robot supports, refreshed on every
      discovery. set-cleaning-mode values outside these lists are rejected before dispatch.
    schema: /docs/references/capability-interfaces/cleaning-mode/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/cleaning-mode/1.0.md
  - id: port1/systems/zero/capability-interfaces/color
    version: '1.0'
    description: >-
      Color sets and reports the color of a connected device. Use it to coordinate lighting for a
      scene or let an assistant choose a new color.
    schema: /docs/references/capability-interfaces/color/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/color/1.0.md
  - id: port1/systems/zero/capability-interfaces/color-temperature
    version: '1.0'
    description: >-
      Color temperature adjusts a light between warmer and cooler tones. Set a temperature directly
      or increase and decrease it, then read the reported value in kelvin.
    schema: /docs/references/capability-interfaces/color-temperature/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/color-temperature/1.0.md
  - id: port1/systems/zero/capability-interfaces/connectivity
    version: '1.0'
    description: >-
      Connectivity tells you whether a connected device is reachable. Use its reported state to
      explain an unavailable device or decide when to retry an action.
    schema: /docs/references/capability-interfaces/connectivity/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/connectivity/1.0.md
  - id: port1/systems/zero/capability-interfaces/contact-sensor
    version: '1.0'
    description: >-
      Contact sensors tell you whether a door, window, or gate is open or closed. Use their reported
      state to check an entryway or trigger an automation when something is left open.
    schema: /docs/references/capability-interfaces/contact-sensor/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/contact-sensor/1.0.md
  - id: port1/systems/zero/capability-interfaces/contacts-provider
    version: '1.0'
    description: >-
      Contacts providers list contacts from a connected account. Use the returned records to give an
      assistant the contact information available to your integration.
    schema: /docs/references/capability-interfaces/contacts-provider/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/contacts-provider/1.0.md
  - id: port1/systems/zero/capability-interfaces/content-launcher
    version: '1.0'
    description: >-
      Content launchers open content or a URL on a connected device. Use them to send a selected
      item to a screen or start the content a customer asked for.
    schema: /docs/references/capability-interfaces/content-launcher/1.0.yaml
    guide: /docs/for-ai/capability-interfaces/content-launcher/1.0.md
