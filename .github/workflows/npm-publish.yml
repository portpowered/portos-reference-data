name: Publish public reference data

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable Go release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: reference-data-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify package version and identical public assets
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); const m=JSON.parse(fs.readFileSync("generated/public/docs/references/manifest.json")); if(p.name!=="@portpowered/reference-data" || `v${p.version}`!==process.env.RELEASE_TAG || m.version!==p.version) throw new Error("Release identity mismatch");'
          npm run check
          go test ./...
      - name: Publish through npm trusted publishing
        run: npm publish --access public --tag next
